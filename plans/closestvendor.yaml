  - id: cv.s9.3
    title: With the translation file installed, trigger a question
    action:
      kind: manual
      text: With the translation file installed, trigger a question.
    expect: The question shows the translation. Press Pass.
    verify:
    - player
  - id: cv.s9.4
    title: With the translation file installed, open the settings page
    action:
      kind: manual
      text: With the translation file installed, open the settings page.
    expect: The page shows the translation. Press Pass.
    verify:
    - player
- id: s10
  title: Buying ammo
  intro: 'Hunter only; press Skip otherwise. Use a Hunter with a bow or gun and a quiver. Defaults: buying
    on, asking off, arrows equipped. The last check puts them back.'
  steps:
  - id: cv.s10.1
    title: With /cvn buy auto and a partly filled quiver, open an ammo vendor
    setup: Ammo buying on, asking off. Your quiver is partly filled and holds arrows or bullets.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Press Run. It types |cff99ccff/cvn buy on|r and |cff99ccff/cvn
        buy auto|r. Then open an ammo vendor.
      commands:
      - /cvn buy on
      - /cvn buy auto
    expect: The addon buys ammo with no dialog.
    verify:
    - assertions
    auto: true
    timeout: 90
    assertions:
    - kind: log
      source: debug
      contains: 'ammo buy: bought '
      scope: attempt
      label: The addon bought ammo
    - kind: log
      source: debug
      contains: 'ammo buy: asked'
      absent: true
      scope: attempt
      label: No dialog was shown
    notes: 'Class step (Hunter). The bought line proves the purchase, the absent "asked" line proves no
      dialog. The count against the room left is not asserted; the mode line "ammo buy: <mode> <kind>
      item ..., space N" holds the room if a reviewer wants it. Absent check: the step waits its whole
      timeout.'
  - id: cv.s10.2
    title: Open an ammo vendor with a full quiver
    setup: Ammo buying on, asking off. Your quiver is full.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Open an ammo vendor with a full quiver.
    expect: The addon buys nothing.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'ammo buy: less than one purchase of room'
      scope: attempt
      label: The addon saw no room
    - kind: log
      source: debug
      contains: 'ammo buy: bought '
      absent: true
      scope: attempt
      label: Nothing was bought
    notes: Class step (Hunter). A full quiver gives no room for one purchase.
  - id: cv.s10.3
    title: Open an ammo vendor with no quiver or ammo pouch
    setup: Ammo buying on, asking off. No quiver or ammo pouch in your bags.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Open an ammo vendor with no quiver or ammo pouch.
    expect: The addon buys nothing.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'ammo buy: less than one purchase of room'
      scope: attempt
      label: The addon saw no room
    - kind: log
      source: debug
      contains: 'ammo buy: bought '
      absent: true
      scope: attempt
      label: Nothing was bought
    notes: Class step (Hunter). Without a quiver the room is 0.
  - id: cv.s10.4
    title: Open an ammo vendor with a thrown weapon equipped
    setup: Ammo buying on, asking off. A thrown weapon is equipped in the ranged slot.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Equip a thrown weapon, then open an ammo vendor.
    expect: The addon buys nothing.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'ammo buy: no bow, crossbow or gun equipped, or its ammo cannot be read'
      scope: attempt
      label: The addon saw no ammo weapon
    - kind: log
      source: debug
      contains: 'ammo buy: bought '
      absent: true
      scope: attempt
      label: Nothing was bought
    notes: Class step (Hunter). Put the bow or gun back on after this check.
  - id: cv.s10.5
    title: Open a vendor that sells no ammo
    setup: Ammo buying on, asking off. A bow or gun is equipped again.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Open a vendor that sells no ammo.
    expect: The addon buys nothing.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'ammo buy: merchant sells no '
      scope: attempt
      label: The addon saw no ammo for sale
    - kind: log
      source: debug
      contains: 'ammo buy: bought '
      absent: true
      scope: attempt
      label: Nothing was bought
    notes: Class step (Hunter). The line names the kind ("arrows" or "bullets") and the count of ammo
      items, so the check matches the start only. That the chat stays silent is not proven by a line.
  - id: cv.s10.6
    title: Enter /cvn buy ask, open an ammo vendor and do not click
    setup: Ammo buying on. Your quiver has room.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Press Run. It types |cff99ccff/cvn buy ask|r. Open an ammo
        vendor and do not click.
      commands:
      - /cvn buy ask
    expect: A dialog shows the count and the price. Nothing is bought. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'ammo buy: asked'
      scope: attempt
      label: The purchase dialog was shown
    - kind: log
      source: debug
      contains: 'ammo buy: bought '
      absent: true
      scope: attempt
      label: Nothing was bought
    notes: 'Player step, class step (Hunter). drawing: the dialog text. The "asked" line proves the dialog
      showed; the player reads the count and price.'
  - id: cv.s10.7
    title: With the dialog open, click No
    setup: The dialog from the last check is open.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. With the dialog open, click |cffffd100No|r.
    expect: The addon buys nothing.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'ammo buy: declined'
      scope: attempt
      label: The addon took No
    - kind: log
      source: debug
      contains: 'ammo buy: bought '
      absent: true
      scope: attempt
      label: Nothing was bought
    notes: Class step (Hunter).
  - id: cv.s10.8
    title: With the dialog open, click Yes
    setup: Asking on. Close the vendor window and open it again so the dialog shows. Your quiver has room.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Open the ammo vendor again. With the dialog open, click
        |cffffd100Yes|r.
    expect: The addon buys the ammo.
    verify:
    - assertions
    auto: true
    timeout: 90
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'ammo buy: asked'
      - contains: 'ammo buy: bought '
      scope: attempt
      label: The dialog showed, then the addon bought
    notes: Class step (Hunter).
  - id: cv.s10.9
    title: Enter /cvn buy off. Open an ammo vendor
    setup: Ammo buying on.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Press Run. It types |cff99ccff/cvn buy off|r. Open an ammo
        vendor.
      commands:
      - /cvn buy off
    expect: The addon buys nothing.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'ammo buy: off'
      scope: attempt
      label: The addon saw buying off
    - kind: log
      source: debug
      contains: 'ammo buy: bought '
      absent: true
      scope: attempt
      label: Nothing was bought
    notes: Class step (Hunter). This turns buying off. Check 10 turns it on again.
  - id: cv.s10.10
    title: At a vendor with several arrow grades, set arrows to best
    setup: Level 10 or higher. A bow is equipped. The vendor sells Rough Arrow and Sharp Arrow. Your quiver has room.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Press Run. It types |cff99ccff/cvn buy on|r, |cff99ccff/cvn
        buy auto|r and |cff99ccff/cvn arrows best|r. Open the vendor.
      commands:
      - /cvn buy on
      - /cvn buy auto
      - /cvn arrows best
    expect: The addon picks the highest grade your level allows and buys it.
    verify:
    - assertions
    auto: true
    timeout: 90
    assertions:
    - kind: log
      source: debug
      contains: 'ammo buy: best arrow item'
      scope: attempt
      label: The addon used the best arrow mode
    - kind: log
      source: debug
      contains: 'ammo buy: best arrow item 2512,'
      absent: true
      scope: attempt
      label: Best did not pick Rough Arrow, the lowest grade
    - kind: log
      source: debug
      contains: 'ammo buy: bought '
      scope: attempt
      label: The addon bought arrows
    notes: Class step (Hunter). Check 9 turned buying off, so Run turns it on and asking off. Rough Arrow
      (item 2512) has no level; Sharp Arrow (item 2515) needs level 10. At level 10 or higher Best picks
      Sharp Arrow or a higher grade, never Rough Arrow, so an addon that always buys the cheapest fails.
  - id: cv.s10.11
    title: Enter /cvn arrows cheapest and open the same vendor
    setup: Same vendor. Buying on, asking off. Your quiver has room.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Press Run. It types |cff99ccff/cvn arrows cheapest|r. Open
        the same vendor.
      commands:
      - /cvn arrows cheapest
    expect: The addon picks the cheapest grade and buys it.
    verify:
    - assertions
    auto: true
    timeout: 90
    assertions:
    - kind: log
      source: debug
      contains: 'ammo buy: cheapest arrow item 2512,'
      scope: attempt
      label: Cheapest picked Rough Arrow
    - kind: log
      source: debug
      contains: 'ammo buy: bought '
      scope: attempt
      label: The addon bought arrows
    notes: Class step (Hunter). Rough Arrow (item 2512) costs the least per arrow.
  - id: cv.s10.12
    title: Enter /cvn arrows equipped and open the same vendor
    setup: Same vendor. Sharp Arrows are in your ammo slot. Your quiver has room.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Press Run. It types |cff99ccff/cvn arrows equipped|r. Open
        the same vendor.
      commands:
      - /cvn arrows equipped
    expect: The addon buys the ammo in your ammo slot.
    verify:
    - assertions
    auto: true
    timeout: 90
    assertions:
    - kind: log
      source: debug
      contains: 'ammo buy: equipped arrow item 2515,'
      scope: attempt
      label: Equipped picked Sharp Arrow, the ammo in your slot
    - kind: log
      source: debug
      contains: 'ammo buy: bought '
      scope: attempt
      label: The addon bought arrows
    notes: Class step (Hunter). Sharp Arrow is item 2515. Cheapest would pick Rough Arrow (2512), so an
      addon that always buys the cheapest fails.
  - id: cv.s10.13
    title: Set the arrow and the bullet setting to different values
    setup: A bow is equipped. Buying on, asking off. Your quiver has room.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Press Run. It types |cff99ccff/cvn arrows best|r and |cff99ccff/cvn
        bullets cheapest|r. Open an ammo vendor with the bow equipped.
      commands:
      - /cvn arrows best
      - /cvn bullets cheapest
    expect: The addon follows the arrow setting.
    verify:
    - assertions
    auto: true
    timeout: 90
    assertions:
    - kind: log
      source: debug
      contains: 'ammo buy: best arrow item'
      scope: attempt
      label: The addon used the arrow setting
    - kind: log
      source: debug
      contains: 'ammo buy: cheapest bullet item'
      absent: true
      scope: attempt
      label: The bullet setting was not used
    notes: 'Class step (Hunter). The mode line names the kind: best + arrow proves the arrow setting was
      used.'
  - id: cv.s10.14
    title: With the same settings, open an ammo vendor with a gun equipped
    setup: A gun is equipped. The vendor sells bullets. Your quiver or pouch has room. Same settings as
      the last check.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Equip a gun. Open an ammo vendor that sells bullets.
    expect: The addon follows the bullet setting.
    verify:
    - assertions
    auto: true
    timeout: 90
    assertions:
    - kind: log
      source: debug
      contains: 'ammo buy: cheapest bullet item'
      scope: attempt
      label: The addon used the bullet setting
    - kind: log
      source: debug
      contains: 'ammo buy: best arrow item'
      absent: true
      scope: attempt
      label: The arrow setting was not used
    notes: Class step (Hunter). cheapest + bullet proves the bullet setting was used.
  - id: cv.s10.15
    title: Use equipped with ammo this vendor does not sell
    setup: A bow is equipped, with arrows in the ammo slot that this vendor does not sell. Buying on,
      asking off.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Press Run. It types |cff99ccff/cvn arrows equipped|r. Open
        that vendor.
      commands:
      - /cvn arrows equipped
    expect: The addon buys nothing.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'ammo buy: no arrow offer for mode equipped'
      scope: attempt
      label: The addon found no matching arrows
    - kind: log
      source: debug
      contains: 'ammo buy: bought '
      absent: true
      scope: attempt
      label: Nothing was bought
    notes: Class step (Hunter). The chat line "This merchant does not sell the ammo your settings ask
      for." is not proven by a debug line.
  - id: cv.s10.16
    title: Have too little gold for a full purchase
    setup: Buying on, asking off. You have gold for at least one purchase but not for all the room you
      have. A bow is equipped.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Press Run. It types |cff99ccff/cvn arrows best|r. Open
        an ammo vendor with that little gold.
      commands:
      - /cvn arrows best
    expect: The addon buys only what you can afford.
    verify:
    - assertions
    auto: true
    timeout: 90
    assertions:
    - kind: log
      source: debug
      contains: 'ammo buy: bought '
      scope: attempt
      label: The addon bought ammo
    - kind: log
      source: debug
      contains: ' (all you could afford)'
      scope: attempt
      label: The purchase was cut short by gold
    - kind: log
      source: debug
      contains: 'ammo buy: cannot afford one purchase'
      absent: true
      scope: attempt
      label: Something was bought
    notes: Class step (Hunter). A partial buy is proven by the "(all you could afford)" suffix on the
      bought line. "cannot afford one purchase" is written only when nothing can be bought.
  - id: cv.s10.17
    title: Have almost no gold
    setup: Buying on, asking off. You have less gold than one purchase costs. Your quiver has room.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Open an ammo vendor with almost no gold.
    expect: The addon buys nothing.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'ammo buy: cannot afford one purchase'
      scope: attempt
      label: The addon saw no gold for one purchase
    - kind: log
      source: debug
      contains: 'ammo buy: bought '
      absent: true
      scope: attempt
      label: Nothing was bought
    notes: Class step (Hunter). The chat line "You cannot afford any ammo here." is not proven by a debug
      line.
  - id: cv.s10.18
    title: Use a quiver that holds a different grade of ammo
    setup: Buying on, asking off. The quiver holds a different grade than the vendor sells; some room
      is left.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Open an ammo vendor with that quiver.
    expect: The addon buys only what fits, and the quiver is not over full. Press Pass.
    verify:
    - player
    - assertions
    - reviewer
    reviewer: 'Compare "space N" on the "ammo buy:" mode line with the count on the "ammo buy: bought"
      line. The count must not be more than the space.'
    assertions:
    - kind: log
      source: debug
      contains: 'ammo buy: bought '
      scope: attempt
      label: The addon bought ammo
    - kind: log
      source: debug
      contains: 'ammo buy: FAILED'
      absent: true
      scope: attempt
      label: No purchase failed
    notes: Player step, class step (Hunter). The player sees that the quiver is full and nothing is left
      in the bags. The reviewer compares space and count; no line states "no overbuy".
  - id: cv.s10.19
    title: Open the settings page
    setup: Any class.
    action:
      kind: manual
      text: Open the settings page.
    expect: The Arrows and Bullets dropdowns match |cff99ccff/cvn|r. Press Pass.
    verify:
    - player
    notes: 'Player step. drawing: the dropdowns on the settings page; no line proves their look.'
  - id: cv.s10.20
    title: Put the ammo settings back
    setup: Hunter only; press Skip otherwise. Ends this section.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Press Run. It types |cff99ccff/cvn buy on|r, |cff99ccff/cvn
        buy auto|r, |cff99ccff/cvn arrows equipped|r and |cff99ccff/cvn bullets equipped|r.
      commands:
      - /cvn buy on
      - /cvn buy auto
      - /cvn arrows equipped
      - /cvn bullets equipped
    expect: Buying is on, asking is off, and arrows and bullets use the equipped ammo.
    verify:
    - assertions
    auto: true
    timeout: 30
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: arrowGrade best -> equipped'
      scope: attempt
      label: Arrows are back to equipped
    - kind: log
      source: debug
      contains: 'setting changed: bulletGrade cheapest -> equipped'
      scope: attempt
      label: Bullets are back to equipped
    notes: Class step (Hunter). Restore. The two lines need checks 13 and 16 to have set best and cheapest.
      A setting that already had the default value writes no line, so buying and asking are not asserted.
- id: s11
  title: Targets on another map
  intro: 'Stand near a zone edge, where the closest vendor is across the border. Start from the defaults:
    question mode Ask, prefer map, on-screen notice on. The checks change them; check 28 sets them back.
    Run repeats the question.'
  steps:
  - id: cv.s11.1
    title: Trigger the question when a vendor on another map is closer
    action:
      kind: manual
      text: Where a vendor on another map is closer than the vendor on your map, press Run (|cff99ccff/cvn
        test sell|r).
      commands:
      - /cvn test sell
    expect: The question lists both vendors, each with zone and distance in yards. It has three buttons.
      Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'two targets: '
      - contains: 'question shown: sell, '
      scope: attempt
      label: Two targets were found and the question was asked
    notes: 'Player step. Drawing: the dialog text and its buttons.'
  - id: cv.s11.2
    title: Check the button order with /cvn prefer map (the default)
    action:
      kind: manual
      text: Close the question. Press Run (|cff99ccff/cvn prefer map|r, then |cff99ccff/cvn test sell|r)
        and look at the order of the buttons.
      commands:
      - /cvn prefer map
      - /cvn test sell
    expect: The first button is the vendor on your map. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      pattern: 'two targets: .+prefer map'
      scope: attempt
      label: The map vendor was put first
    notes: 'Player step. Drawing: the button order. The question stays open for check 3.'
  - id: cv.s11.3
    title: Click the first button
    setup: The question from check 2 is open.
    action:
      kind: manual
      text: Click the first button.
    expect: The waypoint goes to the vendor on your map. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'accepted: '
      scope: attempt
      label: Yes set a waypoint
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the waypoint
    notes: 'Player step. Drawing: where the waypoint points.'
  - id: cv.s11.4
    title: Repeat the question, then click the second button
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn test sell|r), then click the second button.
      commands:
      - /cvn test sell
    expect: The waypoint goes to the closer vendor on the other map. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'accepted: '
      scope: attempt
      label: Yes set a waypoint
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the waypoint
    notes: 'Player step. Drawing: where the waypoint points.'
  - id: cv.s11.5
    title: Repeat the question, then click Cancel
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn test sell|r), then click |cffffd100Cancel|r.
      commands:
      - /cvn test sell
    expect: No waypoint is set.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'two targets: '
      - contains: 'question declined: sell'
      scope: attempt
      label: The two-target question was cancelled
    - kind: log
      source: debug
      contains: 'accepted: '
      absent: true
      scope: attempt
      label: No waypoint was set
  - id: cv.s11.6
    title: Repeat the question, then press Esc
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn test sell|r), then press Esc.
      commands:
      - /cvn test sell
    expect: No waypoint is set.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'two targets: '
      - contains: 'question declined: sell'
      scope: attempt
      label: Escape was taken as No
    - kind: log
      source: debug
      contains: 'accepted: '
      absent: true
      scope: attempt
      label: No waypoint was set
  - id: cv.s11.7
    title: Type /cvn prefer distance and trigger the question
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn prefer distance|r, then |cff99ccff/cvn test sell|r).
      commands:
      - /cvn prefer distance
      - /cvn test sell
    expect: The closer vendor is now the first button. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      pattern: 'two targets: .+prefer distance'
      scope: attempt
      label: The closer vendor was put first
    notes: 'Player step. Drawing: the button order. Prefer distance stays until check 10.'
  - id: cv.s11.8
    title: Trigger the question where the closest vendor is on your map
    action:
      kind: manual
      text: Close the question. Stand where the closest vendor is on your own map, then press Run (|cff99ccff/cvn
        test sell|r).
      commands:
      - /cvn test sell
    expect: You get the plain Yes / No question, naming that vendor. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'question shown: sell, '
      scope: attempt
      label: The question was asked
    - kind: log
      source: debug
      contains: 'two targets: '
      absent: true
      scope: attempt
      label: Only one target
    notes: 'Player step. Drawing: the dialog names the vendor on your map.'
  - id: cv.s11.9
    title: Stand on a map with no known vendor and trigger the question
    action:
      kind: manual
      text: Close the question. Stand on a map with no known vendor, then press Run (|cff99ccff/cvn test
        sell|r).
      commands:
      - /cvn test sell
    expect: You get the plain Yes / No question, naming the closest vendor on another map. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'question shown: sell, '
      scope: attempt
      label: The question was asked
    - kind: log
      source: debug
      contains: 'two targets: '
      absent: true
      scope: attempt
      label: Only one target
    notes: 'Player step. Drawing: the dialog names a vendor on another map.'
  - id: cv.s11.10
    title: Type /cvn choice auto and trigger the question with prefer map
    setup: A waypoint method is in use (TomTom, WaypointUI or the game waypoint), not chat alone; checks
      11, 20 and 23 need it too.
    action:
      kind: manual
      text: Close the question. Back near the zone edge, press Run (|cff99ccff/cvn choice auto|r, |cff99ccff/cvn
        prefer map|r, then |cff99ccff/cvn test sell|r).
      commands:
      - /cvn choice auto
      - /cvn prefer map
      - /cvn test sell
    expect: No question opens. The waypoint goes at once to the vendor on your map.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - pattern: 'two targets: .+prefer map'
      - contains: 'chosen from two candidates: the one on your map'
      - pattern: 'accepted: .+ via '
      scope: attempt
      label: The vendor on your map was chosen from two and its waypoint set at once
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: The vendor had a waypoint method
    - kind: log
      source: debug
      contains: via chat
      absent: true
      scope: attempt
      label: The vendor got a waypoint, not only a chat line
    - kind: log
      source: debug
      contains: 'question shown: '
      absent: true
      scope: attempt
      label: No question
    notes: 'Run is the action here: the test command is what the addon answers. The auto line names which
      of the two was taken (the one on your map or the closest), so a reversed preference fails. Needs a
      waypoint method (TomTom, WaypointUI or the game waypoint).'
  - id: cv.s11.11
    title: With choice auto, type /cvn prefer distance and trigger the question
    setup: The question mode is still automatic from check 10, with a waypoint method in use.
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn prefer distance|r, then |cff99ccff/cvn test sell|r).
      commands:
      - /cvn prefer distance
      - /cvn test sell
    expect: No question opens. The waypoint goes at once to the closer vendor.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - pattern: 'two targets: .+prefer distance'
      - contains: 'chosen from two candidates: the closest'
      - pattern: 'accepted: .+ via '
      scope: attempt
      label: The closer vendor was chosen from two and its waypoint set at once
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: The vendor had a waypoint method
    - kind: log
      source: debug
      contains: via chat
      absent: true
      scope: attempt
      label: The vendor got a waypoint, not only a chat line
    - kind: log
      source: debug
      contains: 'question shown: '
      absent: true
      scope: attempt
      label: No question
  - id: cv.s11.12
    title: Trigger an automatic waypoint with two candidates
    setup: The question mode is still automatic and the rule is prefer distance from checks 10 and 11. Stand
      near the zone edge, as in check 10, so a vendor on your map and a closer one on another map are known.
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn test sell|r).
      commands:
      - /cvn test sell
    expect: One chat line and the same on-screen text name the target with zone and distance in yards,
      and the other choice. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: chosen from two candidates
      scope: attempt
      label: An automatic waypoint from two candidates
    notes: 'Player step. Drawing: the chat line and the on-screen text.'
  - id: cv.s11.13
    title: Trigger an automatic waypoint
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn test sell|r).
      commands:
      - /cvn test sell
    expect: The notification sound plays once. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'auto: '
      scope: attempt
      label: An automatic waypoint was set
    notes: 'Player step. Sound: no line records it.'
  - id: cv.s11.14
    title: Trigger an automatic waypoint and watch the on-screen text
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn test sell|r) and watch the on-screen text.
      commands:
      - /cvn test sell
    expect: The text stays about five seconds, high and centered, then goes. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'auto: '
      scope: attempt
      label: An automatic waypoint was set
    notes: 'Player step. Drawing: where the text shows and how long it stays.'
  - id: cv.s11.15
    title: Set a second waypoint while the on-screen text shows
    action:
      kind: manual
      text: Do not press Run. Enter |cff99ccff/cvn test sell|r from its box. While the on-screen text
        shows, enter |cff99ccff/cvn test repair|r from its box.
      commands:
      - /cvn test sell
      - /cvn test repair
    expect: The new text replaces the old one and the time restarts. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'auto: '
      count:
        min: 2
      scope: attempt
      label: Two automatic waypoints were set
    notes: 'Player step. Drawing: the text replacement. Run would enter both lines at once, too fast to
      see the first text.'
  - id: cv.s11.16
    title: Cause a game error, for example try an action that fails
    action:
      kind: manual
      text: Cause a game error, for example try an action that fails.
    expect: The error text looks the same and lasts as long as usual. Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: the game error text. The addon writes nothing for it.'
  - id: cv.s11.17
    title: Type /cvn notice off and trigger an automatic waypoint
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn notice off|r, then |cff99ccff/cvn test sell|r).
      commands:
      - /cvn notice off
      - /cvn test sell
    expect: The on-screen text does not show. The chat line stays. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'auto: '
      scope: attempt
      label: An automatic waypoint was set
    notes: 'Player step. Drawing: no on-screen text.'
  - id: cv.s11.18
    title: Type /cvn notice on and trigger an automatic waypoint
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn notice on|r, then |cff99ccff/cvn test sell|r).
      commands:
      - /cvn notice on
      - /cvn test sell
    expect: The on-screen text comes back. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'auto: '
      scope: attempt
      label: An automatic waypoint was set
    notes: 'Player step. Drawing: the on-screen text.'
  - id: cv.s11.19
    title: Type /cvn notice off, then open the settings page
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn notice off|r), then open the settings page.
      commands:
      - /cvn notice off
    expect: The notice checkbox is cleared. Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: the settings page. Check 20 turns the notice back on.'
  - id: cv.s11.20
    title: With /cvn choice auto, trigger with only one candidate
    setup: The question mode is still automatic from check 10, with a waypoint method in use.
    action:
      kind: manual
      text: Stand where the closest vendor is on your map, then press Run. It turns the notice back on
        (|cff99ccff/cvn notice on|r) and asks (|cff99ccff/cvn test sell|r).
      commands:
      - /cvn notice on
      - /cvn test sell
    expect: The single candidate gets a waypoint at once.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - pattern: 'auto: .+%(npc %d+%)$'
      - pattern: 'accepted: .+ via '
      scope: attempt
      label: One candidate was chosen and its waypoint set at once
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: The vendor had a waypoint method
    - kind: log
      source: debug
      contains: via chat
      absent: true
      scope: attempt
      label: The vendor got a waypoint, not only a chat line
    - kind: log
      source: debug
      contains: chosen from two candidates
      absent: true
      scope: attempt
      label: Not chosen from two
  - id: cv.s11.21
    title: With /cvn choice auto, trigger while in combat
    setup: The question mode is still automatic from check 10. Have at least 3 free bag slots. Start a
      fight first. The Run button hides in combat, so copy the line from its box into chat.
    action:
      kind: manual
      text: During the fight, enter |cff99ccff/cvn bags 200|r from its box.
      commands:
      - /cvn bags 200
    expect: No waypoint is set during the fight.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log
      source: debug
      contains: 'trigger held in combat: sell'
      scope: attempt
      label: The sell warning waited for the fight
    - kind: log
      source: debug
      contains: 'auto: '
      absent: true
      scope: attempt
      diagnostic: true
      label: No automatic waypoint during the fight
    notes: 'The absent check is diagnostic: the fight may end inside the step and the waypoint then comes.
      Check 22 types the bag threshold back.'
  - id: cv.s11.22
    title: Trigger the trainer question with choice set to ask
    setup: A known profession 10 points or fewer from its limit, with a known trainer. The fight from
      check 21 is over.
    action:
      kind: manual
      text: 'Press Run: |cff99ccff/cvn bags 2|r ends the sell warning and |cff99ccff/cvn choice ask|r
        sets the question mode back. Then craft one item or gain a point in that profession.'
      commands:
      - /cvn bags 2
      - /cvn choice ask
    expect: The trainer question opens, as it does for vendors.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log
      source: debug
      contains: 'question shown: trainer for '
      scope: attempt
      label: The trainer question was asked
    notes: 'Run comes first: it ends the sell warning that check 21 left due, which would hold back the
      trainer question.'
  - id: cv.s11.23
    title: Trigger the trainer question with choice set to auto
    setup: The trainer question from check 22 is open, with a waypoint method in use.
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn choice auto|r). Click |cffffd100No|r on the trainer question, then
        craft one item or gain a point.
      commands:
      - /cvn choice auto
    expect: No question opens. The waypoint goes at once to the trainer.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question declined: trainer'
      - contains: 'auto: '
      - pattern: 'accepted: .+ via '
      scope: attempt
      label: After No, the trainer was chosen and its waypoint set at once
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: The trainer had a waypoint method
    - kind: log
      source: debug
      contains: via chat
      absent: true
      scope: attempt
      label: The trainer got a waypoint, not only a chat line
    - kind: log
      source: debug
      contains: 'question shown: trainer for '
      absent: true
      scope: attempt
      label: No second trainer question
  - id: cv.s11.24
    title: Stand in a city and trigger the question
    action:
      kind: manual
      text: Stand in a city, then press Run. It sets the question mode back (|cff99ccff/cvn choice ask|r),
        prefers your map (|cff99ccff/cvn prefer map|r) and asks (|cff99ccff/cvn test sell|r).
      commands:
      - /cvn choice ask
      - /cvn prefer map
      - /cvn test sell
    expect: The vendor on "your map" is a vendor inside the city. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'question shown: sell, '
      scope: attempt
      label: The question was asked
    notes: Player step. Which vendor stands inside the city is map knowledge.
  - id: cv.s11.25
    title: Open the settings page
    action:
      kind: manual
      text: Open the settings page.
    expect: The two target dropdowns show the same values as |cff99ccff/cvn choice|r and |cff99ccff/cvn
      prefer|r. Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: the settings page.'
  - id: cv.s11.26
    title: Type /cvn status
    action:
      kind: manual
      text: Type |cff99ccff/cvn status|r.
      commands:
      - /cvn status
    expect: It shows both target settings. Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: the chat text.'
  - id: cv.s11.27
    title: Type /cvn log
    action:
      kind: manual
      text: Type |cff99ccff/cvn log|r.
      commands:
      - /cvn log
    expect: The report lists the target choice settings and which target the addon showed or set. Press
      Pass.
    verify:
    - player
    notes: Player step. The report header is not in the debug log, so the player reads the report.
  - id: cv.s11.28
    title: Set the target choices back to the defaults
    action:
      kind: manual
      text: 'Press Run to type the defaults back: |cff99ccff/cvn choice ask|r, |cff99ccff/cvn prefer map|r
        and |cff99ccff/cvn notice on|r.'
      commands:
      - /cvn choice ask
      - /cvn prefer map
      - /cvn notice on
    expect: Chat shows the question mode Ask, prefer map and the notice on. Press Pass.
    verify:
    - player
    notes: 'Player step. Cleanup: checks 7 to 23 changed the question mode, the preference and the notice.
      Nothing to log.'
- id: s12
  title: Reagents
  intro: 'Most checks need a Mage; press Skip where a check names another class. Start with the defaults:
    threshold 5, Reagents on, question mode Ask. The checks change them and check 35 sets them back.'
  steps:
  - id: cv.s12.1
    title: Type /cvn status
    action:
      kind: manual
      text: Type |cff99ccff/cvn status|r.
      commands:
      - /cvn status
    expect: 'It shows "Reagents: on, trigger at 5 or fewer". Press Pass.'
    verify:
    - player
    notes: 'Player step. Chat wording: no debug line records the text that /cvn status prints.'
  - id: cv.s12.2
    title: Type /cvn log
    setup: A character whose class has reagents and who knows a spell that uses one.
    action:
      kind: manual
      text: 'A class with reagents only (Mage, Rogue, Priest, Paladin, Shaman or Druid); press Skip otherwise.
        Nothing to type. CheckThat reads what the addon watches, the same list as the report line "reagents:
        ... watching:".'
    expect: The addon watches at least one reagent for the spells you know.
    verify:
    - assertions
    auto: true
    timeout: 30
    call:
      addon: ClosestVendor
      entry: reagents
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.reagents
      op: contains
      value: ':'
      label: The addon watches at least one reagent
    notes: The report header never reaches the debug log, so the reagents entry stands in for it. It runs
      when the step opens. The value is "item id:count" pairs, or "none". Class step.
  - id: cv.s12.3
    title: 'Optional: a low-level mage who does not know Portals'
    setup: A Mage who has not learned Portals.
    action:
      kind: manual
      text: Optional. Mage who knows Teleport but has not learned Portals only; press Skip otherwise.
        Nothing to type.
    expect: The addon watches Rune of Teleportation but not Rune of Portals.
    verify:
    - assertions
    auto: true
    timeout: 30
    call:
      addon: ClosestVendor
      entry: reagents
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.reagents
      op: contains
      value: '17031:'
      label: Rune of Teleportation (17031) is watched
    - kind: log
      source: facts
      pattern: 'entry%.reagents=.*17031:'
      scope: attempt
      label: The reagents line in the facts log names Rune of Teleportation
    - kind: log
      source: facts
      pattern: 'entry%.reagents=.*17032:'
      absent: true
      scope: attempt
      label: Rune of Portals (17032) is not watched
    notes: The reagents entry replaces the report line. The entry proves the reagent list is read, and the
      same value has no 17032 (Rune of Portals, Reagents.lua). The absent check waits the full timeout.
      Class step. Check 4 learns the spell; check 36 reads the result.
  - id: cv.s12.4
    title: Learn Portals as the same mage, then show the log without a reload
    action:
      kind: manual
      text: Optional, the same mage; press Skip otherwise. Learn Portals. Do not reload. Press Run to
        type |cff99ccff/cvn log|r.
      commands:
      - /cvn log
    expect: The report now lists Rune of Portals. Press Pass.
    verify:
    - player
    notes: Player step. The report header never reaches the debug log and the reagents entry runs when
      a step opens, before you learn the spell. Check 36 at the end of the section reads the watched reagents
      without a reload.
  - id: cv.s12.5
    title: Use a druid who knows Rebirth rank 3
    setup: A Druid who knows Rebirth rank 3 and no higher rank.
    action:
      kind: manual
      text: Druid only; press Skip otherwise. Nothing to type.
    expect: The addon watches Ashwood Seed.
    verify:
    - assertions
    - reviewer
    auto: true
    timeout: 30
    call:
      addon: ClosestVendor
      entry: reagents
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.reagents
      op: contains
      value: '17036:'
      label: Ashwood Seed (17036) is watched
    notes: The reagents entry replaces the report line. It proves the rank 3 seed is watched; a person
      confirms the rank 1 and 2 seeds (17034, 17035) are missing from the same value. Class step.
    reviewer: The reagents list has no 17034 (Maple Seed) or 17035 (Stranglethorn Seed).
  - id: cv.s12.6
    title: Use a priest who knows Prayer of Fortitude rank 2
    setup: A Priest who knows Prayer of Fortitude rank 2.
    action:
      kind: manual
      text: Priest only; press Skip otherwise. Nothing to type.
    expect: The addon watches Sacred Candle, not Holy Candle.
    verify:
    - assertions
    auto: true
    timeout: 30
    call:
      addon: ClosestVendor
      entry: reagents
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.reagents
      op: contains
      value: '17029:'
      label: Sacred Candle (17029) is watched
    - kind: log
      source: facts
      pattern: 'entry%.reagents=.*17029:'
      scope: attempt
      label: The reagents line in the facts log names Sacred Candle
    - kind: log
      source: facts
      pattern: 'entry%.reagents=.*17028:'
      absent: true
      scope: attempt
      label: Holy Candle (17028) is not watched
    notes: A priest has two reagents, Holy Candle 17028 and Sacred Candle 17029 (Reagents.lua; Holy Candle
      is not watched once rank 2 is known). The entry proves the second is watched and the first is missing
      from the same value. The absent check waits the full timeout. Class step.
  - id: cv.s12.7
    title: Carry 6 Runes of Teleportation
    setup: Reagent threshold 5, Reagents on, and you carry 6 Runes of Teleportation in your bags.
    action:
      kind: manual
      text: Mage only; press Skip otherwise. Move one item to another bag slot, then wait a minute.
    expect: No question opens for Rune of Teleportation.
    verify:
    - assertions
    auto: true
    timeout: 60
    call:
      addon: ClosestVendor
      entry: reagents
      args:
      - 17031
    assertions:
    - kind: log
      source: debug
      contains: event BAG_UPDATE_DELAYED
      scope: attempt
      label: Your bags were checked
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.reagents
      op: ge
      value: 6
      label: You carry at least 6 Runes of Teleportation
    - kind: log
      source: debug
      contains: 'question shown: reagent Rune of Teleportation'
      absent: true
      scope: attempt
      label: No Rune of Teleportation question
    - kind: log
      source: debug
      contains: trigger go reagent 17031
      absent: true
      scope: attempt
      label: No Rune of Teleportation request
    notes: 'The entry proves the start state: at least 6 in the bags, above the threshold 5. The bag move
      makes the addon check again, so the log has new lines. The two absent checks wait the full timeout.
      Class step.'
  - id: cv.s12.8
    title: Cast Teleport until 5 Runes of Teleportation are left
    setup: The 6 Runes from check 7. Stand where a vendor that sells the rune is known.
    action:
      kind: manual
      text: Mage only; press Skip otherwise. Cast Teleport until 5 Runes are left.
    expect: A question opens for Rune of Teleportation with 5 left.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: trigger go reagent 17031
      - pattern: 'question shown: reagent Rune of Teleportation, .+, 5 left'
      scope: attempt
      label: The Runes crossed the threshold and the question named the reagent and 5 left
    notes: The question text names the same reagent and count as the log line. The vendor name in the
      dialog is drawing and is not checked. Class step.
  - id: cv.s12.9
    title: Click Yes on that question
    setup: The Rune of Teleportation question from check 8 is open. A waypoint method is in use (TomTom,
      WaypointUI or the game waypoint).
    action:
      kind: manual
      text: Mage only; press Skip otherwise. Click |cffffd100Yes|r on that question.
    expect: The waypoint is set to that vendor.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log
      source: debug
      pattern: 'accepted: .+ via '
      scope: attempt
      label: Yes set a waypoint
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the waypoint
    - kind: log
      source: debug
      contains: via chat
      absent: true
      scope: attempt
      label: The waypoint is on the map, not only a chat line
    notes: 'Class step: it needs the question from check 8.'
  - id: cv.s12.10
    title: Put reagents in the bank, then type /cvn log
    action:
      kind: manual
      text: Mage only; press Skip otherwise. Put some Runes of Teleportation in the bank. Press Run to
        type |cff99ccff/cvn log|r.
      commands:
      - /cvn log
    expect: The report does not count the banked reagents. Press Pass.
    verify:
    - player
    notes: Player step. The report header never reaches the debug log, and the reagents entry runs when
      a step opens, before you bank anything. No line proves the bank is left out; left for an issue.
      Class step.
  - id: cv.s12.11
    title: Open a reagent question, then open a vendor that sells the reagent
    setup: Reagent buying does not matter. A vendor that sells the reagent is known.
    action:
      kind: manual
      text: Mage only; press Skip otherwise. Press Run (|cff99ccff/cvn test reagent|r) to open a reagent
        question. Then open a vendor that sells the reagent.
      commands:
      - /cvn test reagent
    expect: The question closes.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question shown: reagent '
      - contains: merchant window opened
      - contains: 'question closed: merchant opened (reagent)'
      scope: attempt
      label: The reagent question closed when the merchant opened
    - kind: log
      source: debug
      contains: 'waypoint cleared: a merchant window opened'
      diagnostic: true
      scope: attempt
      label: A waypoint, if any, was cleared
    notes: 'Run opens the reagent question with the test command; the merchant window then answers it.
      The merchant line writes "question closed: merchant opened (reagent)", not "request released". A
      test question has no waypoint, so the waypoint clear line is diagnostic. Class step.'
  - id: cv.s12.12
    title: Open a reagent question, then open any other merchant
    setup: Reagent buying does not matter. A vendor that sells the reagent is known.
    action:
      kind: manual
      text: Mage only; press Skip otherwise. Press Run (|cff99ccff/cvn test reagent|r) to open a reagent
        question. Then open a merchant that does not sell the reagent.
      commands:
      - /cvn test reagent
    expect: The question closes.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question shown: reagent '
      - contains: merchant window opened
      - contains: 'question closed: merchant opened (reagent)'
      scope: attempt
      label: The reagent question closed when the merchant opened
    - kind: log
      source: debug
      contains: 'waypoint cleared: a merchant window opened'
      diagnostic: true
      scope: attempt
      label: A waypoint, if any, was cleared
    notes: 'Run opens the reagent question with the test command; the merchant window then answers it.
      The merchant line writes "question closed: merchant opened (reagent)", not "request released". A
      test question has no waypoint, so the waypoint clear line is diagnostic. Class step.'
  - id: cv.s12.13
    title: Get two reagents low (Arcane Powder and Rune of Teleportation)
    setup: You carry 1 to 40 Arcane Powder and 1 to 40 Runes of Teleportation. Question mode Ask.
    action:
      kind: manual
      text: Mage only; press Skip otherwise. Press Run. It switches Reagents off and on, then types |cff99ccff/cvn
        reagent 40|r, so both reagents are low. Click |cffffd100No|r on the first question.
      commands:
      - /cvn reagents off
      - /cvn reagents on
      - /cvn reagent 40
    expect: One question shows. The second reagent question appears only after you answer it.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log
      source: debug
      contains: 'trigger go reagent '
      count:
        min: 2
      scope: attempt
      label: Two reagent requests were placed
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question shown: reagent '
      - contains: 'question declined: reagent'
      - contains: 'question shown: reagent '
      scope: attempt
      label: The second question came only after the first answer
    notes: Threshold 40 stays until check 16; checks 14 and 15 use it. The off and on commands clear the
      reagent latch, so the question asks again. Class step.
  - id: cv.s12.14
    title: In combat, have a reagent low and gear worn below the repair threshold
    setup: A reagent is low (threshold 40 from check 13). Gear is worn below the repair threshold, 20
      percent by default. A creature or a training dummy you can fight.
    action:
      kind: manual
      text: Mage only; press Skip otherwise. Attack a creature or a training dummy. While you are in combat,
        press Run. It switches Repair and Reagents off, then Reagents on and Repair on. End the fight.
        Click |cffffd100No|r on the repair question.
      commands:
      - /cvn dur off
      - /cvn reagents off
      - /cvn reagents on
      - /cvn dur on
    expect: The repair question comes first, then the reagent question.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log
      source: debug
      contains: 'trigger held in combat: repair'
      scope: attempt
      label: With both low, the waiting request was repair
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'trigger held in combat: repair'
      - contains: trigger go repair
      - contains: 'question shown: repair'
      - contains: 'question declined: repair'
      - contains: 'question shown: reagent '
      scope: attempt
      label: After the fight repair was asked first, then the reagent
    notes: 'Combat holds every request, so both warnings are low when the fight ends and one check picks
      between them. Reagents comes on first and is held; Repair comes on last and takes its place only
      because it ranks higher. With the order reversed no "held in combat: repair" line is written. Class
      step: it needs a reagent class.'
  - id: cv.s12.15
    title: In combat, have a reagent low and full bags
    setup: A reagent is low (threshold 40 from check 13). Your free bag slots are at or below the bag
      threshold, 2 by default. A creature or a training dummy you can fight.
    action:
      kind: manual
      text: Mage only; press Skip otherwise. Attack a creature or a training dummy. While you are in combat,
        press Run. It switches Bags and Reagents off, then Bags on and Reagents on. End the fight. Click
        |cffffd100No|r on the reagent question.
      commands:
      - /cvn bags off
      - /cvn reagents off
      - /cvn bags on
      - /cvn reagents on
    expect: The reagent question comes before the sell question.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log
      source: debug
      contains: 'trigger held in combat: reagent '
      scope: attempt
      label: With both low, the waiting request was the reagent
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'trigger held in combat: reagent '
      - contains: 'trigger go reagent '
      - contains: 'question shown: reagent '
      - contains: 'question declined: reagent'
      - contains: 'question shown: sell'
      scope: attempt
      label: After the fight the reagent was asked first, then selling
    notes: 'Combat holds every request, so both warnings are low when the fight ends and one check picks
      between them. Bags comes on first and is held; Reagents comes on last and takes its place only because
      it ranks higher. With the order reversed no "held in combat: reagent" line is written. Class step.'
  - id: cv.s12.16
    title: Type /cvn reagent 10, then /cvn status
    action:
      kind: manual
      text: Press Run. It types |cff99ccff/cvn reagent 10|r, then |cff99ccff/cvn status|r.
      commands:
      - /cvn reagent 10
      - /cvn status
    expect: The reagent threshold changes to 10.
    verify:
    - assertions
    auto: true
    timeout: 30
    assertions:
    - kind: log
      source: debug
      pattern: 'setting changed: reagentThreshold %d+ %-> 10'
      scope: attempt
      label: The reagent threshold became 10
    notes: The report header never reaches the debug log. The setting line proves the new value; the chat
      text that /cvn status prints is not checked. The old value is 40 after check 13, or 5 on a fresh run, so
      the pattern takes any number.
  - id: cv.s12.17
    title: Type /cvn reagent 10, then open the settings page
    setup: The threshold is already 10 from check 16.
    action:
      kind: manual
      text: Open the settings page (|cff99ccff/cvn config|r) and look at the Reagents slider. The threshold
        is already 10 from check 16.
      commands:
      - /cvn config
    expect: The reagent slider shows 10. Press Pass.
    verify:
    - player
    notes: Player step. Settings page look. Typing 10 again writes no debug line, and check 16 already
      proved the value.
  - id: cv.s12.18
    title: Type /cvn reagents
    action:
      kind: manual
      text: Press Run to type |cff99ccff/cvn reagents|r.
      commands:
      - /cvn reagents
    expect: The list shows your class reagents, all on. Press Pass.
    verify:
    - player
    notes: 'Player step. Chat wording: no debug line records the list.'
  - id: cv.s12.19
    title: Type /cvn reagent off arcane powder and get it low
    setup: You carry 1 to 40 Arcane Powder.
    action:
      kind: manual
      text: Mage only; press Skip otherwise. Press Run. It types |cff99ccff/cvn reagent off arcane powder|r,
        then |cff99ccff/cvn reagent 40|r, so your Arcane Powder is low.
      commands:
      - /cvn reagent off arcane powder
      - /cvn reagent 40
    expect: No question opens for Arcane Powder.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: reagentOff.17020 none -> true'
      scope: attempt
      label: Arcane Powder was switched off
    - kind: log
      source: debug
      contains: 'question shown: reagent Arcane Powder'
      absent: true
      scope: attempt
      label: No Arcane Powder question
    - kind: log
      source: debug
      contains: trigger go reagent 17020
      absent: true
      scope: attempt
      label: No Arcane Powder request
    notes: The report header never reaches the debug log; the setting line replaces "switched off:". The
      absent checks wait the full timeout. Another reagent can still ask. Class step.
  - id: cv.s12.20
    title: Type /cvn reagent on arcane powder and get it low
    setup: Arcane Powder is switched off (check 19) and you carry 1 to 40 of it, threshold 40. If another
      reagent question is open, click No on it.
    action:
      kind: manual
      text: Mage only; press Skip otherwise. Press Run to type |cff99ccff/cvn reagent on arcane powder|r.
        If another reagent question shows first, click |cffffd100No|r.
      commands:
      - /cvn reagent on arcane powder
    expect: The Arcane Powder question comes back.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: reagentOff.17020 true -> none'
      scope: attempt
      label: Arcane Powder was switched on
    - kind: log
      source: debug
      contains: 'question shown: reagent Arcane Powder'
      scope: attempt
      label: The Arcane Powder question was asked
    notes: Another reagent that is low can ask first, so a No may be needed. Class step.
  - id: cv.s12.21
    title: Open the settings page
    action:
      kind: manual
      text: Open the settings page (|cff99ccff/cvn config|r).
      commands:
      - /cvn config
    expect: It lists only your class reagents, with checkboxes that match |cff99ccff/cvn reagents|r. Press
      Pass.
    verify:
    - player
    notes: 'Player step. Settings page look: no line records it.'
  - id: cv.s12.22
    title: Clear "Reagents" in Warnings and get a reagent low
    setup: Arcane Powder is low (1 to 40, threshold 40) and Reagents is on.
    action:
      kind: manual
      text: Mage only; press Skip otherwise. Press Run. It types |cff99ccff/cvn reagents off|r, the same
        as clearing Reagents in Warnings. Do nothing for a minute.
      commands:
      - /cvn reagents off
    expect: No reagent question opens.
    verify:
    - assertions
    auto: true
    timeout: 90
    call:
      addon: ClosestVendor
      entry: reagents
      args:
      - 17020
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.reagents
      op: le
      value: 40
      label: Arcane Powder is watched and at or below 40 when the step opens
    - kind: log
      source: debug
      contains: 'setting changed: reagentsEnabled true -> false'
      scope: attempt
      label: The Reagents warning was switched off
    - kind: log
      source: debug
      contains: 'question shown: reagent'
      absent: true
      scope: attempt
      label: No reagent question
    notes: The entry proves a reagent is low when the step opens, so the absent check is not empty. The
      switch comes back on in check 25. Class step.
  - id: cv.s12.23
    title: Use a hunter, a warrior or a warlock (any one)
    setup: A Hunter, Warrior or Warlock.
    action:
      kind: manual
      text: Hunter, Warrior or Warlock only; press Skip otherwise. Press Run to type |cff99ccff/cvn reagents|r.
      commands:
      - /cvn reagents
    expect: The addon watches no reagent.
    verify:
    - assertions
    auto: true
    timeout: 30
    call:
      addon: ClosestVendor
      entry: reagents
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.reagents
      op: eq
      value: none
      label: No reagent is watched
    notes: 'The reagents entry replaces "watching: none" from the report header. The settings page and
      the chat text are covered by unit tests. Class step.'
  - id: cv.s12.24
    title: Use a hunter, a warrior or a warlock (any one) and play normally
    setup: A Hunter, Warrior or Warlock.
    action:
      kind: manual
      text: Hunter, Warrior or Warlock only; press Skip otherwise. Move one item to another bag slot,
        then play normally for two minutes.
    expect: No reagent question appears.
    verify:
    - assertions
    auto: true
    timeout: 120
    call:
      addon: ClosestVendor
      entry: reagents
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.reagents
      op: eq
      value: none
      label: No reagent is watched
    - kind: log
      source: debug
      contains: event BAG_UPDATE_DELAYED
      scope: attempt
      label: Your bags were checked
    - kind: log
      source: debug
      contains: 'question shown: reagent'
      absent: true
      scope: attempt
      label: No reagent question
    - kind: log
      source: debug
      contains: trigger go reagent
      absent: true
      scope: attempt
      label: No reagent request
    notes: The bag move makes the addon check again, so the log has new lines. The absent checks wait
      the full timeout. Class step.
  - id: cv.s12.25
    title: Type /cvn test reagent
    setup: A reagent class. Reagents was switched off in check 22.
    action:
      kind: manual
      text: A class with reagents only (Mage, Rogue, Priest, Paladin, Shaman or Druid); press Skip otherwise.
        Press Run. It switches Reagents back on (|cff99ccff/cvn reagents on|r), then types |cff99ccff/cvn
        test reagent|r.
      commands:
      - /cvn reagents on
      - /cvn test reagent
    expect: It asks about the first watched reagent, whatever the count.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'test command: reagent'
      - pattern: 'question shown: reagent .+ left'
      scope: attempt
      label: The test command asked about a reagent
    - kind: log
      source: debug
      contains: 'test command: nothing asked'
      absent: true
      scope: attempt
      label: Something was asked
    - kind: log
      source: debug
      contains: 'setting changed: reagentsEnabled false -> true'
      diagnostic: true
      scope: attempt
      label: The Reagents warning was switched on
    notes: 'The "test command: reagent" line is written by the command itself; the question line after it
      is the proof. Reagents comes back on here; the setting line is diagnostic because a player who skipped
      check 22 sees no change. Class step.'
  - id: cv.s12.26
    title: Type /cvn test reagent with nothing watched
    setup: A Hunter, Warrior or Warlock.
    action:
      kind: manual
      text: Hunter, Warrior or Warlock only; press Skip otherwise. Press Run to type |cff99ccff/cvn test
        reagent|r.
      commands:
      - /cvn test reagent
    expect: Nothing is asked, because no class reagent is watched.
    verify:
    - assertions
    auto: true
    timeout: 30
    assertions:
    - kind: log
      source: debug
      contains: 'test command: nothing asked: no class reagent watched'
      scope: attempt
      label: The test found no reagent to ask about
    - kind: log
      source: debug
      contains: 'question shown: reagent'
      absent: true
      scope: attempt
      label: No reagent question
    notes: The chat text is covered by unit tests; the debug line gives the reason. Class step.
  - id: cv.s12.27
    title: Open a reagent vendor you never opened, then get the reagent low
    setup: A vendor that sells your class reagent and that you have not opened before. Reagents on.
    action:
      kind: manual
      text: A class with reagents only (Mage, Rogue, Priest, Paladin, Shaman or Druid); press Skip otherwise.
        Do not press Run. Open the vendor you have not opened before and close it. Then enter |cff99ccff/cvn
        test reagent|r from its box.
      commands:
      - /cvn test reagent
    expect: The addon learns the vendor. The question can name the new vendor.
    verify:
    - assertions
    - reviewer
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: merchant window opened
      - pattern: 'vendor learned: .+, new'
      - contains: 'question shown: reagent '
      scope: attempt
      label: The new vendor was learned, then the reagent question was asked
    - kind: log
      source: debug
      contains: ; it was not in the search pool
      scope: attempt
      diagnostic: true
      label: The vendor was new to the search
    notes: The lines prove the vendor was learned and the question asked. Which vendor the question names
      depends on distance, so a person compares the names. Class step. A vendor the addon ships or reads
      from NorgannonDB is learned as new without the "not in the search pool" note, so that note is diagnostic.
    reviewer: Compare the vendor named by the question with the vendor you opened.
  - id: cv.s12.28
    title: Open a shipped reagent vendor, then get that reagent low
    setup: A vendor that the addon ships and that sells your class reagent. Reagents on.
    action:
      kind: manual
      text: A class with reagents only (Mage, Rogue, Priest, Paladin, Shaman or Druid); press Skip otherwise.
        Do not press Run. Open a shipped reagent vendor and close it. Then enter |cff99ccff/cvn test reagent|r
        from its box.
      commands:
      - /cvn test reagent
    expect: The question can still name the shipped vendor.
    verify:
    - assertions
    - reviewer
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: merchant window opened
      - contains: 'question shown: reagent '
      scope: attempt
      label: The vendor was opened, then the reagent question was asked
    - kind: log
      source: debug
      contains: it was not in the search pool
      absent: true
      scope: attempt
      label: The vendor was already in the search pool
    notes: A shipped vendor is already in the search pool, so no "not in the search pool" note is written.
      Class step.
    reviewer: Compare the vendor named by the question with the shipped vendor you opened.
  - id: cv.s12.29
    title: Type /cvn choice auto and get a reagent low
    setup: Arcane Powder is low (1 to 40, threshold 40). A waypoint method is in use (TomTom, WaypointUI
      or the game waypoint).
    action:
      kind: manual
      text: Mage only; press Skip otherwise. Press Run. It types |cff99ccff/cvn choice auto|r, then switches
        Reagents off and on, so the low reagent asks again. Check 35 sets the question mode back.
      commands:
      - /cvn choice auto
      - /cvn reagents off
      - /cvn reagents on
    expect: The waypoint is set at once, with no question.
    verify:
    - assertions
    auto: true
    timeout: 90
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'trigger go reagent '
      - contains: 'auto: '
      - pattern: 'accepted: .+ via '
      scope: attempt
      label: A low reagent set its waypoint at once
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the waypoint
    - kind: log
      source: debug
      contains: via chat
      absent: true
      scope: attempt
      label: The waypoint is on the map, not only a chat line
    - kind: log
      source: debug
      contains: 'question shown: '
      absent: true
      scope: attempt
      label: No question
    notes: With /cvn choice auto the code writes "auto:" instead of "question shown:". The wording "Navigating
      to ... to buy <reagent>." is covered by unit tests. Class step.
  - id: cv.s12.30
    title: Trigger an automatic waypoint for ammo
    setup: Question mode is automatic from check 29. A vendor for it is known. A waypoint method is in
      use (TomTom, WaypointUI or the game waypoint).
    action:
      kind: manual
      text: Press Run to type |cff99ccff/cvn test arrows|r.
      commands:
      - /cvn test arrows
    expect: The waypoint is set at once, with no question.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'auto: '
      - pattern: 'accepted: .+ via '
      scope: attempt
      label: The test set its waypoint at once
    - kind: log
      source: debug
      contains: 'test command: nothing asked'
      absent: true
      scope: attempt
      label: The test found a vendor
    - kind: log
      source: debug
      contains: 'question shown: '
      absent: true
      scope: attempt
      label: No question
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the waypoint
    - kind: log
      source: debug
      contains: via chat
      absent: true
      scope: attempt
      label: The waypoint is on the map, not only a chat line
    notes: The "test command:" line comes from the command itself and proves nothing; the auto line is
      the proof, and the accepted line after it shows the waypoint was set. The wording "... to buy ammo." is covered by unit tests.
  - id: cv.s12.31
    title: Trigger an automatic waypoint for repair
    setup: Question mode is automatic from check 29. A vendor for it is known. A waypoint method is in
      use (TomTom, WaypointUI or the game waypoint).
    action:
      kind: manual
      text: Press Run to type |cff99ccff/cvn test repair|r.
      commands:

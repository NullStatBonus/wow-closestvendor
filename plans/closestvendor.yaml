      contains: 'question shown: supply food, '
      scope: attempt
      label: The food question was asked
    notes: 'Class step: a run belongs to one character, so other classes press Skip. The command writes
      "test command: food" itself, so only the question line is required. The question names the vendor,
      its npc id and the food left.'
  - id: cv.s14.2

    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'reagent buy: off'
      scope: attempt
      label: Buying is off
    - kind: log
      source: debug
      contains: 'reagent buy: bought'
      absent: true
      scope: attempt
      label: Nothing was bought
    notes: 'Player step. The report header is chat only; the line "reagent buy: off" proves that nothing
      was bought. Reagent class only.'
  - id: cv.s13.93
    title: Open the settings page, Reagents
    action:
      kind: manual
      text: Open the settings page, Reagents.
    expect: Below the reagent checkboxes are Buy reagents, Ask before buying reagents and an amount slider
      (0 to 100, default 20). Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: the settings page. No debug line proves it.'
  - id: cv.s13.94
    title: On the Reagents page, turn Buy reagents off
    action:
      kind: manual
      text: On the Reagents page, turn Buy reagents on, then off.
    expect: The other two controls are greyed out while it is off. Turning it on makes them usable again.
      Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: greyed controls. Ends with Buy reagents off, the default.'
  - id: cv.s13.95
    title: Type /cvn reagentbuy on, then ask, then 35
    setup: A reagent class. Reagent buying is at its default.
    action:
      kind: manual
      text: Mage only; press Skip otherwise. Press Run. It types |cff99ccff/cvn reagentbuy on|r, |cff99ccff/cvn
        reagentbuy ask|r and |cff99ccff/cvn reagentbuy 35|r.

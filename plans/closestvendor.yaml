    auto: true
    timeout: 300
    assertions:
    - kind: log
      source: debug
      contains: 'direct pin: reagent '
      scope: attempt
      label: The click started a search
    - kind: log
      source: debug
      contains: 'accepted: '
      scope: attempt
      label: A waypoint was set
    - kind: log
      source: debug
      contains: 'direct pin: auctioneer'
      absent: true
      scope: attempt
      label: No auction house inside an instance
    notes: The absent check waits the whole timeout.
  - id: cv.s13.89
    title: Open an auction house you never opened, then show the log
    action:
      kind: manual
      text: WoW Forever only; press Skip otherwise. Open an auction house you have never opened.
    expect: The addon learns the auction house.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log
      source: debug
      pattern: 'auctioneer learned: .+ %(npc %d+%), new'
      scope: attempt
      label: The auctioneer was learned as new
    notes: The learned line is written once per auction house window. Check 90 reads the learned list.
    clients:
    - forever-camelot
  - id: cv.s13.90
    title: Type /cvn log, then /reload
    action:
      kind: manual
      text: The addon remembers the auction house you opened in check 89.
    expect: The addon learned at least one auctioneer.
    verify:
    - assertions
    auto: true
    timeout: 30
    call:
      addon: ClosestVendor
      entry: learned
      args:
      - auctioneers
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.learned
      op: ge
      value: 1
      label: The account learned an auctioneer
    notes: The entry counts the auctioneers the account learned. It runs when the step opens, after check
      89. It cannot tell a new one from an old one. Check 118 reloads and check 119 reads the count again.
    clients:
    - forever-camelot
  - id: cv.s13.91
    title: Walk to a shipped auctioneer and click a tradeable row
    setup: A class that uses reagents, with a reagent row shown (check 86).
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn ah on|r). Walk to a shipped auctioneer and click a reagent row.
      commands:
      - /cvn ah on
    expect: The waypoint points at where the auctioneer stands.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'direct pin: auctioneer '
      - contains: 'accepted: '
      scope: attempt
      label: The click pinned the auctioneer
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the waypoint
    notes: Any of the shipped auctioneers with coordinates.
  - id: cv.s13.92
    title: On a fresh install, type /cvn status, then open a reagent vendor
    setup: A reagent class, with reagent buying at its default (off).
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn status|r). Then open a reagent vendor.

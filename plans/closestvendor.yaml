    notes: 'Player step. Drawing: the log window. The report never reaches the debug log.'
  - id: cv.s20.36
    title: Set the sizes, opacity and sound back
    action:
      kind: manual
      text: 'Press Run to type the defaults back: |cff99ccff/cvn set appearance.hud.scale 100|r, |cff99ccff/cvn
        set appearance.hud.background-opacity 80|r, |cff99ccff/cvn set appearance.toast.scale 100|r and
        |cff99ccff/cvn sound whisper|r.'
      commands:
      - /cvn set appearance.hud.scale 100
      - /cvn set appearance.hud.background-opacity 80
      - /cvn set appearance.toast.scale 100
      - /cvn sound whisper
    expect: Chat shows the sound is Whisper ping, and the window and toast are back to normal size. Press
      Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      pattern: 'setting changed: hudScale %d+ %-> 100'
      scope: attempt
      label: The window scale is back at 100
      diagnostic: true
    - kind: log
      source: debug
      pattern: 'setting changed: hudAlpha %d+ %-> 80'
      scope: attempt
      label: The background opacity is back at 80
      diagnostic: true
    - kind: log
      source: debug
      pattern: 'setting changed: toastScale %d+ %-> 100'
      scope: attempt
      label: The toast scale is back at 100
      diagnostic: true
    - kind: log
      source: debug
      pattern: 'setting changed: remindSound %a+ %-> whisper'
      scope: attempt
      label: The sound is back to Whisper
      diagnostic: true
    notes: 'Player step. Cleanup. The lines are diagnostic: each is written only when the value differed.'
  - id: cv.s20.37
    title: Set the style, notice, lock and switches back
    action:
      kind: manual
      text: 'Press Run to type the rest back: |cff99ccff/cvn set appearance.notification-style toast|r,
        |cff99ccff/cvn set appearance.hud.locked off|r and |cff99ccff/cvn notice on|r. Then turn the two
        switches from check 5 back on.'
      commands:
      - /cvn set appearance.notification-style toast
      - /cvn set appearance.hud.locked off
      - /cvn notice on
    expect: Chat shows On-screen notice on. The two switches are on again. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: notificationStyle warning -> toast'
      scope: attempt
      label: The style is back to Toast
      diagnostic: true
    - kind: log
      source: debug
      contains: 'setting changed: hudLocked true -> false'
      scope: attempt
      label: The window is unlocked
      diagnostic: true
    - kind: log
      source: debug
      contains: 'setting changed: autoNotice false -> true'
      scope: attempt
      label: On-screen notice is back on
      diagnostic: true
    - kind: log
      source: debug
      pattern: 'setting changed: %a+Enabled false %-> true'
      scope: attempt
      label: A switch is back on
      diagnostic: true
    notes: 'Player step. Cleanup. The lines are diagnostic: each is written only when the value differed.'
  intro: Use a character with default settings (Toast style, On-screen notice on, status window scale
    100). Install KeepThat for the About and log checks. The last two checks set everything back. Debug
    logging is on.
- id: s21
  title: Reputation standing
  intro: WoW Forever. Gorhak is the Magram Clan quartermaster in Magram Village, Desolace. Checks 1 to 3 are
    optional, as another character on this account must have opened his window. Checks 2 to 4 need you Unfriendly
    or Hostile with the Magram Clan.
  steps:
  - id: cv.s21.1
    title: Trigger a sell warning near a clan quartermaster
    setup: Optional. Only when another character on this account opened Gorhak's window and this character
      never targeted, moused over or opened him (not on a rerun after check 2); press Skip otherwise. Turn
      nameplates off, since they count too. Stand in Magram Village.
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn test sell|r).
      commands:
      - /cvn test sell
    expect: This character is not sent to Gorhak.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'question shown: sell, '
      scope: attempt
      label: The sell question was asked
    - kind: log
      source: debug
      contains: Gorhak
      absent: true
      scope: attempt
      label: Gorhak was not named
    notes: Check 2 proves the addon knows Gorhak as a vendor (a standing line is written only for a known
      vendor, trainer or auctioneer). A vendor of no side that only another character saw is left out until
      this character sees it trade. Gorhak's npc id is not in the shipped data, so the checks match his name
      and the standing line's form, not a fixed id.
    clients:
    - forever-camelot
  - id: cv.s21.2
    title: Trigger a warning that routes to an unfriendly clan quartermaster
    setup: Optional. Only when check 1 ran (another character opened Gorhak's window, so the addon knows
      him) and this character is Unfriendly or Hostile with the Magram Clan; press Skip otherwise. Stand
      in Magram Village.
    action:
      kind: manual
      text: Mouse over no other NPC. Target Gorhak directly (click him or type /target Gorhak), then press
        Run (|cff99ccff/cvn test sell|r).
      commands:
      - /cvn test sell
    expect: No route goes to Gorhak.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - pattern: 'standing: npc %d+ will not trade'
      - contains: 'question shown: sell, '
      scope: attempt
      label: Gorhak was seen refusing, then the question was asked
    - kind: log
      source: debug
      contains: Gorhak
      absent: true
      scope: attempt
      label: Gorhak was not named
    notes: Target only Gorhak during this check, so the standing line is his. It also proves the addon knows
      him as a vendor.
    clients:
    - forever-camelot
  - id: cv.s21.3
    title: After a reload, target the quartermaster again
    action:
      kind: manual
      text: Optional. Only when check 2 ran; press Skip otherwise. Press Run (|cff99ccff/reload|r). After
        the reload, mouse over nothing, not even Gorhak; type /target Gorhak to target him directly.
      commands:
      - /reload
    expect: The addon remembers that Gorhak will not trade with this character.
    verify:
    - assertions
    auto: true
    timeout: 120
    reload: after_action
    assertions:
    - kind: log
      source: debug
      pattern: 'standing: npc %d+ will not trade %(Unfriendly or Hostile%), already known'
      scope: attempt
      label: Gorhak is remembered as refusing after the reload
    notes: Replaces the report line "standing (this character)", which is not in the debug log. The
      "already known" line comes only from what this character saved, so it proves the standing survived
      the reload. Mousing over him first would write the line from the mouseover; /target keeps it
      to the target.
    clients:
    - forever-camelot
  - id: cv.s21.4
    title: Raise reputation to Neutral and target the quartermaster again
    action:
      kind: manual
      text: Optional. Raise your Magram reputation to Neutral, then target Gorhak again.
    expect: He can be offered again. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      pattern: 'standing: npc %d+ will trade$'
      scope: attempt
      label: Gorhak now trades with this character
    notes: Player step. Raising reputation takes longer than an automatic check waits.
    clients:
    - forever-camelot
- id: s22
  title: AddOns list icon and pages
  steps:
  - id: cv.s22.1
    title: Select Closest Vendor in the game's AddOns list on both clients
    action:
      kind: manual
      text: Open the game's AddOns list (Menu > AddOns) on Classic Era and WoW Forever. Press Skip on
        a client you do not have.
    expect: The badge icon shows by the name; Restock, Navigation, Appearance, Advanced and About are
      listed under it; selecting it shows Home. Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: the icon and the page list. No line proves it.'
  - id: cv.s22.2
    title: Change Restock > Ammo in the AddOns list, then open settings
    action:
      kind: manual
      text: In that list, change a value on Restock > Ammo, then type |cff99ccff/cvn settings|r.
      commands:
      - /cvn settings
    expect: The changed value shows in the settings window. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: '
      scope: attempt
      label: The value changed in the AddOns list was saved
    notes: 'Player step. Drawing: the value in the settings window. The setting changed line proves the
      AddOns list saved the change. The next check sets it back.'
  - id: cv.s22.3
    title: Set the Restock, Ammo value back
    action:
      kind: manual
      text: In the settings window, set the value you changed in check 2 back to what it was.
    expect: The value is back. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: '
      scope: attempt
      label: The value was saved again
      diagnostic: true
    notes: Player step. Cleanup. The line is diagnostic.
- id: s23
  title: Safe questions
  steps:
  - id: cv.s23.1
    title: Leave the ammo question open and close the merchant
    setup: Buy ammo and Ask before buying ammo are on, and your quiver or ammo pouch has room for more ammo.
    action:
      kind: manual
      text: Hunter only; press Skip on other classes. Open an ammo merchant, leave the purchase question open and close the merchant.
    expect: The question closes and nothing is bought.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: merchant window opened
      - contains: 'purchase question closed with the merchant: ammo'
      scope: attempt
      label: The ammo question closed with the merchant
    - kind: log
      source: debug
      contains: 'ammo buy: bought'
      absent: true
      scope: attempt
      label: Nothing was bought
    notes: 'Class step: a run belongs to one character, so other classes skip it. It needs nothing from another check.'
  - id: cv.s23.2
    title: Leave the reagent question open and close the merchant
    setup: Buy reagents and Ask before buying reagents are on, and a watched reagent is below its buy target.
    action:
      kind: manual
      text: Reagent class only (for example a Mage); press Skip on other classes. Open a reagent merchant, leave the purchase question open and close the merchant.
    expect: The question closes and nothing is bought.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: merchant window opened
      - contains: 'purchase question closed with the merchant: reagents'
      scope: attempt
      label: The reagent question closed with the merchant
    - kind: log
      source: debug
      contains: 'reagent buy: bought'
      absent: true
      scope: attempt
      label: Nothing was bought
    notes: 'Class step: it needs a class with watched reagents and nothing from another check.'
  - id: cv.s23.3
    title: With the ammo question open, cause a route question
    setup: Buy ammo and Ask before buying ammo are on. Open an ammo merchant and leave the purchase question open.
    action:
      kind: manual
      text: Hunter only; press Skip on other classes. With the purchase question open, press Run (|cff99ccff/cvn test sell|r) so a route question shows.
      commands:
      - /cvn test sell
    expect: The route question does not replace the ammo question. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: merchant window opened
      - contains: 'question shown: sell, '
      scope: attempt
      label: The merchant opened, then a route question was asked
    notes: 'Player step. Drawing: the purchase and route questions are separate dialogs side by side. No decision point chooses between them, so only the screen shows that both stay. Class step: it opens its own purchase question, so it does not need check 1.'
  - id: cv.s23.4
    title: With gear below the threshold and full bags, answer No to repair
    setup: Have at least 3 free bag slots. Wear at least one item between 21% and 99% durability and nothing at 20% or below. No ammo, reagent, food, water or pet food warning is due, because those come before selling.
    action:
      kind: manual
      text: Press Run. It types |cff99ccff/cvn dur 100|r, then |cff99ccff/cvn bags 200|r. Click |cffffd100No|r (or |cffffd100Cancel|r) on the repair question, or press Escape on it. Leave the sell question open.
      commands:
      - /cvn dur 100
      - /cvn bags 200
    expect: The sell question appears within a moment.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question shown: repair, '
      - contains: 'question declined: repair'
      - contains: 'request released: repair'
      - contains: 'question shown: sell, '
      scope: attempt
      label: No ended the repair request, then the sell question came
    notes: Durability first, then bags, so the repair question comes first. Both thresholds stay changed until check 10 types the defaults back.
  - id: cv.s23.5
    title: After that, wait a minute without repairing
    setup: The sell question from check 4 is still open.
    action:
      kind: manual
      text: Leave the sell question open. Move an item in your bags, then wait a minute without repairing.
    expect: The repair question is not asked again until you repair.
    verify:
    - assertions
    auto: true
    timeout: 90
    call:
      addon: ClosestVendor
      entry: active
    assertions:
    - kind: log
      source: debug
      contains: event BAG_UPDATE_DELAYED
      scope: attempt
      label: The addon checked again
    - kind: log
      source: debug
      contains: trigger go repair
      absent: true
      scope: attempt
      label: No new repair request
    - kind: log
      source: debug
      contains: 'question shown: repair'
      absent: true
      scope: attempt
      label: No repair question
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.active
      op: eq
      value: sell
      label: Sell, not repair, is the open request
    notes: The latch that holds repair back (handled in Triggers) has no entry. After No on repair the sell question from check 4 is the open request, so the active entry must return sell when the step opens. The bag move makes the addon check again inside the step; the step waits its 90 seconds for the absent checks.
  - id: cv.s23.6
    title: 'Optional: need repair with full bags where no repairer is known'
    setup: 'WoW Forever only. Go to a new zone on its own continent (for example Zephras Isle) where you opened a vendor that does not repair and know no repairer, before you press Run.'
    action:
      kind: manual
      text: Optional; press Skip if no such zone is at hand. Press Run. It types |cff99ccff/cvn dur 1|r, which ends the repair warning, then |cff99ccff/cvn dur 100|r.
      commands:
      - /cvn dur 1
      - /cvn dur 100
    expect: The sell question is asked.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: no known vendor for repair on this continent
      - contains: 'request released: repair'
      - contains: 'question shown: sell, '
      scope: attempt
      label: No repairer known, so the sell question came
    notes: 'Optional, WoW Forever only: the shipped Classic Era list has repairers on both outdoor continents, so only a new WoW Forever zone without shipped vendors can lack one, and only when NorgannonDB adds no repairer there. The threshold 1 ends the repair warning unless an item is broken, so the No from check 4 is cleared and the threshold 100 sends the repair warning out again. The bag threshold is still 200. Check 7 starts by going back to a continent with a known repairer.'
    clients:
    - forever-camelot
  - id: cv.s23.7
    title: Make the repair warning due while dead, then resurrect
    setup: Go back to a continent with a known repairer. Then die, for example to a much stronger enemy.
    action:
      kind: manual
      text: While dead or a ghost, press Run. It types |cff99ccff/cvn dur 1|r, then |cff99ccff/cvn dur 100|r. Then resurrect at the corpse or a spirit healer.
      commands:
      - /cvn dur 1
      - /cvn dur 100
    expect: No question while dead or a ghost; the repair question appears once alive.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'trigger held while dead: repair'
      - contains: 'question shown: repair, '
      scope: attempt
      label: Held while dead, asked once alive
    notes: 'Run shows while dead, out of combat. Both commands run while dead: the threshold 1 clears the repair latch, and 100 makes the warning due while dead only. A repair question needs a known repairer, so the check starts on such a continent.'
  - id: cv.s23.8
    title: Repeat, but accept a resurrection from another player before releasing
    setup: Another player who can resurrect you is with you. Die near them.
    action:
      kind: manual
      text: While dead, before you release, press Run. It types |cff99ccff/cvn dur 1|r, then |cff99ccff/cvn dur 100|r. Then accept the resurrection from the other player.
      commands:
      - /cvn dur 1
      - /cvn dur 100
    expect: The repair question appears once alive.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'trigger held while dead: repair'
      - contains: 'question shown: repair, '
      scope: attempt
      label: Held while dead, asked once alive
    notes: The threshold 1 ends the repair request from check 7, so no repair at a vendor is needed in between. You are still on the continent with a known repairer from check 7.
  - id: cv.s23.9
    title: With the sell question showing, drop gear below the threshold
    action:
      kind: manual
      text: Press Run. It ends the repair and sell warnings (|cff99ccff/cvn dur 1|r, |cff99ccff/cvn bags 0|r), makes the sell warning due (|cff99ccff/cvn bags 200|r), then the repair warning (|cff99ccff/cvn dur 100|r). Answer |cffffd100No|r (or |cffffd100Cancel|r) to the repair question.
      commands:
      - /cvn dur 1
      - /cvn bags 0
      - /cvn bags 200
      - /cvn dur 100
    expect: The repair question replaces the sell question. After No, the sell question is asked again.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question shown: sell, '
      - contains: 'question shown: repair, '
      - contains: 'question declined: repair'
      - contains: 'question shown: sell, '
      scope: attempt
      label: Repair replaced sell, then sell came back after No
    notes: 'Run fixes the order: each command checks at once, so the sell question comes first, then repair replaces it. The thresholds 1 and 0 clear both latches whatever the gear and bags are.'
  - id: cv.s23.10
    title: Type the default bag and durability thresholds back
    action:
      kind: manual
      text: 'Press Run to type the default thresholds back: |cff99ccff/cvn bags 2|r and |cff99ccff/cvn dur 20|r.'
      commands:
      - /cvn bags 2
      - /cvn dur 20
    expect: Chat shows the bag threshold 2 and the durability threshold 20. Repair your gear if the deaths took it to 20% or below. Press Pass.
    verify:
    - player
    notes: 'Player step. Cleanup: checks 4 to 9 changed both thresholds; this types the defaults back. Nothing to log.'
  intro: Run these checks on a character with the default thresholds; the checks change thresholds and set them back to the defaults. Use |cff99ccff/cvn choice ask|r. Press Skip on a check your class cannot do.
- id: s24
  title: Zone changes, hearth, partial merchants and standing
  intro: Run these checks on a character with the default thresholds; the checks change thresholds and
    set them back to the defaults (check 9). Use the question mode Ask.
  steps:
  - id: cv.s24.1
    title: With the sell question open, enter a dungeon
    setup: Have at least 3 free bag slots. Stand at a dungeon entrance.
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn bags 200|r) so the sell question shows. Leave it open and enter
        the dungeon.
      commands:
      - /cvn bags 200
    expect: The question closes and nothing is asked inside.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question shown: sell, '
      - contains: 'question withdrawn: the player changed zone'
      - contains: 'trigger held in an instance: sell'
      scope: attempt
      label: The question was withdrawn at the zone change, and the warning waits inside
    notes: 'A real warning, not a test command: a test question is never withdrawn.'
  - id: cv.s24.2
    title: Leave that dungeon
    setup: You are inside the dungeon from check 1, with the sell warning still due.
    action:
      kind: manual
      text: Leave the dungeon.
    expect: The sell question is asked again.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - pattern: 'instance: %a+ %-> none'
      - contains: 'question shown: sell, '
      scope: attempt
      label: Outside again, the sell question was asked
  - id: cv.s24.3
    title: With the repair question open, ride into the next zone
    setup: Wear an item between 21% and 99% durability, so check 9 can end the repair warning. Stand near
      a zone border.
    action:
      kind: manual
      text: 'Press Run: |cff99ccff/cvn bags 2|r ends the sell warning and |cff99ccff/cvn dur 100|r asks
        the repair question. Leave it open and ride into the next zone.'
      commands:
      - /cvn bags 2
      - /cvn dur 100
    expect: The question is asked again from where you are now.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question shown: repair, '
      - contains: 'question withdrawn: the player changed zone'
      - contains: 'question shown: repair, '
      scope: attempt
      label: The repair question was withdrawn at the border and asked again
    notes: The new question searches from the new zone. The durability threshold stays at 100 until check
      9.
  - id: cv.s24.4
    title: With a question open, start combat, then click Yes
    setup: The repair question from check 3 is open.
    action:
      kind: manual
      text: Start a fight, then click |cffffd100Yes|r (|cffffd100This map|r or |cffffd100Closest|r when
        it names two vendors).
    expect: The question stays in the fight and Yes still sets the waypoint. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'accepted: '
      scope: attempt
      label: Yes set a waypoint
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the waypoint
    notes: 'Player step. Drawing: the question stays on screen in the fight; no line records the start
      of a fight.'
  - id: cv.s24.5
    title: Set your hearthstone at an innkeeper, then walk into a dungeon
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn anchor hearth|r, the default). Bind your hearthstone at an innkeeper,
        walk into a dungeon and click a status window row.
      commands:
      - /cvn anchor hearth
    expect: The row searches near the inn. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'hearthstone point learned: '
      - contains: 'direct pin: the search started from your hearthstone point'
      scope: attempt
      label: The inn was learned, then the row click searched from it
    notes: Player step. The walk to a dungeon takes longer than an automatic check waits. The chat line
      also says the search started from your hearthstone point.
  - id: cv.s24.6
    title: Decline an innkeeper bind, bind elsewhere, then click a row
    action:
      kind: manual
      text: Optional. Talk to an innkeeper and decline the bind. Then bind at another inn while the addon
        is turned off, or log out between. Enter a dungeon and click a status window row.
    expect: Dungeon searches use your last position outside. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'direct pin: the search started from your last position outside'
      scope: attempt
      label: The row click searched from the last position outside
    notes: Player step. The binds and the walk take longer than an automatic check waits. The new hearthstone
      point is known by name only, so the search falls back to the last position outside.
  - id: cv.s24.7
    title: After a fresh login, open a known ammo vendor straight away
    action:
      kind: manual
      text: Log in, then open a known ammo vendor straight away.
    expect: The vendor still counts as an ammo vendor. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: merchant window opened
      scope: attempt
      label: The merchant window opened
    - kind: log
      source: debug
      contains: not fully loaded
      scope: attempt
      diagnostic: true
      label: The list was read before the game loaded every item
    notes: Player step. The game decides whether the list is partly loaded, so the "not fully loaded"
      line is diagnostic. The status window ammo row or the next ammo question shows the vendor still
      counts.
  - id: cv.s24.8
    title: Unfriendly with Steamwheedle, click a reagent row near Booty Bay
    setup: Unfriendly or Hostile with the Steamwheedle Cartel, with a class reagent row in the status
      window, only; press Skip otherwise. Stand in the Booty Bay auction house right next to Auctioneer
      Kresky, so the auction house is closer than any vendor of that reagent. Turn nameplates off, and
      do not target or mouse over another auctioneer.
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn ah on|r). Target Auctioneer Kresky, then click the reagent row.
      commands:
      - /cvn ah on
    expect: It routes to another auctioneer, not to Kresky.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'standing: npc 9858 will not trade'
      - contains: 'direct pin: reagent'
      - pattern: 'direct pin: auctioneer .+ %(npc %d+%) is closer'
      - contains: 'accepted: '
      scope: attempt
      label: Kresky was seen refusing, then the click searched and pinned another auctioneer
    - kind: log
      source: debug
      contains: (npc 9858)
      absent: true
      scope: attempt
      label: Kresky was not chosen
    notes: Auctioneer Kresky is npc 9858 (Data/Vendors.lua). Booty Bay has two more shipped auctioneers,
      Graves (15677) and O'reely (15681), that this character did not see refusing. Kresky stands closest, so another auctioneer winning the
      search proves the standing filter left him out; a vendor winning, or no search, fails the sequence.
      Check 9 turns the auction house routing back off.
  - id: cv.s24.9
    title: Type the defaults back
    action:
      kind: manual
      text: 'Press Run to type the defaults back: |cff99ccff/cvn dur 20|r and |cff99ccff/cvn ah off|r.'
      commands:
      - /cvn dur 20
      - /cvn ah off
    expect: Chat shows the durability threshold 20 and auction house routing off. Press Pass.
    verify:
    - player
    notes: 'Player step. Cleanup: check 3 set the durability threshold to 100 (check 3 typed the bag default
      back) and check 8 turned auction house routing on. Nothing to log.'

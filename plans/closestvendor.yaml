- id: s27
  title: Trainer tiers with NorgannonDB
  intro: WoW Forever with NorgannonDB installed. Use the question mode Ask with no question open and no
    warning due.
  steps:
  - id: cv.s27.1
    title: Turn NorgannonDB back on
    setup: With NorgannonDB installed only; press Skip otherwise. Earlier sections left it disabled.
    action:
      kind: manual
      text: Enable NorgannonDB in the AddOns list, then press Run (|cff99ccff/reload|r).
      commands:
      - /reload
    expect: The addon finds NorgannonDB and counts its trainers with a tier.
    verify:
    - assertions
    auto: true
    timeout: 120
    reload: after_action
    assertions:
    - kind: log
      source: debug
      pattern: 'NorgannonDB: found, schema .+ [1-9]%d* trainers with a tier'
      scope: attempt
      label: NorgannonDB was found, with trainers that have a tier
    - kind: log
      source: errors
      pattern: '%[ClosestVendor%]'
      absent: true
      scope: attempt
      label: No ClosestVendor Lua error
    notes: Replaces the external entry read, which could run before the reload. The login line has the
      same text as the external entry and the report. Checks 2 and 3 need trainers with a tier, so the
      pattern fails when there are none.
    clients:
    - forever-camelot
  - id: cv.s27.2
    title: At 145 of 150, change a skill near a Journeyman trainer
    setup: Blacksmithing at 140 to 150 of 150, level 20 or more. Stand near a Journeyman or Expert Blacksmith
      and further from an Artisan or Master Blacksmith. No other known profession is 10 points or fewer from
      its limit.
    action:
      kind: manual
      text: Craft one item or gain a point in it.
    expect: The question names the Artisan or Master Blacksmith, not the nearer one.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log
      source: debug
      pattern: 'trainer search: .+ needs tier 3; nearest .+ teaches tier [34]'
      scope: attempt
      label: The nearest trainer that teaches Expert was chosen
    - kind: log
      source: debug
      contains: 'question shown: trainer for '
      scope: attempt
      label: The trainer question was asked
    notes: 'Tiers: 2 Journeyman, 3 Expert, 4 Artisan. A Journeyman or Expert Blacksmith (the NPC title) can
      teach only up to tier 2, so the setup needs an Artisan or Master Blacksmith, which teaches tier 3 or
      4.'
    clients:
    - forever-camelot
  - id: cv.s27.3
    title: At 220 of 225 (level 35+), change a skill
    setup: A crafting profession at 215 to 225 of 225, level 35 or more. No other known profession is
      10 points or fewer from its limit.
    action:
      kind: manual
      text: Craft one item or gain a point in it.
    expect: The question names a Master trainer (for example Brikk Keencraft in Booty Bay for Blacksmithing).
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log
      source: debug
      pattern: 'trainer search: .+ needs tier 4; nearest .+ teaches tier 4'
      scope: attempt
      label: A trainer that teaches Artisan was chosen
    - kind: log
      source: debug
      contains: 'question shown: trainer for '
      scope: attempt
      label: The trainer question was asked
    clients:
    - forever-camelot
  - id: cv.s27.4
    title: Then click the profession row
    action:
      kind: manual
      text: Click |cffffd100No|r on the open question, then click the profession row.
    expect: The row is red and the click routes to that Master trainer. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'row click: '
      - contains: 'accepted: '
      scope: attempt
      label: The row click set a waypoint
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the waypoint
    notes: 'Player step. Drawing: the row colour and where the waypoint points.'
    clients:
    - forever-camelot
  - id: cv.s27.5
    title: 'Non-English client: trigger the trainer question'
    action:
      kind: manual
      text: 'Non-English client: trigger the trainer question.'
    expect: It uses the game's profession name and the trainer's localized name. Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: translated dialog text.'
    clients:
    - forever-camelot
  - id: cv.s27.6

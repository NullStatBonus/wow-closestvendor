    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: instanceAnchor hearth -> last'
      scope: attempt
      label: The anchor is last
    notes: 'Player step. Drawing: the dropdown on the settings page. The setting line proves the last
      command. Check 85 sets the anchor back to hearth.'
  - id: cv.s13.85
    title: On a fresh install, type /cvn ah on, then /cvn ah off
    action:
      kind: manual
      text: Press Run. It sets the anchor back to hearth, then turns routing on and off (|cff99ccff/cvn
        ah on|r, |cff99ccff/cvn ah off|r).

ct: 1
kind: plan
addon: ClosestVendor
title: ClosestVendor in-game test plan
preamble: 'These checks cover what the automated tests cannot check: the real game.


  Run these checks on a character with the default thresholds; the checks change thresholds and set them back to the defaults.


  Run them on WoW Forever. Run them on Classic Era when you can.


  Run them before a release. Run them after a change to |cff99ccffAdapter.lua|r, |cff99ccffCore.lua|r,
  |cff99ccffReport.lua|r or |cff99ccffOptions.lua|r. Run them when a new game build comes out.


  Tick each item. Write down the client build. Wait 30 seconds before you repeat a check that failed:
  the addon writes a repeated profession or standing line again only after 30 seconds.


  Each check has one player action, a |cff99ccffCheck:|r line with the result a player sees, and a |cff99ccffLog:|r
  line the reviewer reads in the debug log or |cff99ccffClosestVendorCharDB|r. A line that starts with
  "Note" asks you to record what the game does. Those items are unknown: verify them in game.'
logs:
  debug:
    global: ClosestVendorCharDB
    path: log.entries
    format: entries
    cap: 1000
  facts:
    global: CheckThatDB
    path: global.facts
    format: strings
    cap: 300
  errors:
    global: CheckThatDB
    path: global.errors
    format: strings
    quiet: true
    cap: 100
requirements:
  addon-loaded:
    text: ClosestVendor is loaded
    probe: addon-loaded
    name: ClosestVendor
offline:
  toc: wow-closest-vendor/ClosestVendor/ClosestVendor_Vanilla.toc
  steps:
  - event:
      name: ADDON_LOADED
      args:
      - ClosestVendor
  - event:
      name: PLAYER_LOGIN
  - label: The fake client gives no version, so the version entry returns nothing
    call:
      addon: ClosestVendor
      entry: version
    returns: []
  - label: The bag threshold is 2 by default
    call:
      addon: ClosestVendor
      entry: setting
      args:
      - bags.threshold
    returns:
    - '2'
  - label: The CheckThat integration is working
    call:
      addon: ClosestVendor
      entry: integration
    returns:
    - working
  - label: An unknown setting key returns nothing
    call:
      addon: ClosestVendor
      entry: setting
      args:
      - no.such.key
    returns: []
  - label: No warning request is open after login, so the active entry returns nothing
    call:
      addon: ClosestVendor
      entry: active
    returns: []
  - label: A fresh account has learned no vendor yet
    call:
      addon: ClosestVendor
      entry: learned
      args:
      - vendors
    returns:
    - 0
  - label: An npc id that is not learned returns nothing
    call:
      addon: ClosestVendor
      entry: learned
      args:
      - vendors
      - 999999
    returns: []
  - label: An unknown kind returns nothing
    call:
      addon: ClosestVendor
      entry: learned
      args:
      - bankers
    returns: []
  - label: An npc this character never saw has no standing
    call:
      addon: ClosestVendor
      entry: standing
      args:
      - 999999
    returns: []
  - label: The fake client has no TomTom, WaypointUI or game waypoint, so the waypoint is a chat line
    call:
      addon: ClosestVendor
      entry: nav
    returns:
    - chat
  - label: The fake client has no NorgannonDB
    call:
      addon: ClosestVendor
      entry: external
    returns:
    - not found
  - label: The status window scale is 100 by default
    call:
      addon: ClosestVendor
      entry: config
      args:
      - hudScale
    returns:
    - '100'
  - label: A row group nobody changed shows only while low
    call:
      addon: ClosestVendor
      entry: config
      args:
      - hudRow.bags
    returns:
    - low
  - label: A name that is not a setting returns nothing
    call:
      addon: ClosestVendor
      entry: config
      args:
      - no.such.setting
    returns: []
  - label: The status window has not drawn yet (its redraw waits for a timer), so the window entry returns nothing
    call:
      addon: ClosestVendor
      entry: window
    returns: []
  - label: The window entry for one row group returns nothing before the first draw too
    call:
      addon: ClosestVendor
      entry: window
      args:
      - supplies
    returns: []
  - label: No warning check has run yet, so the reagents entry returns nothing
    call:
      addon: ClosestVendor
      entry: reagents
    returns: []
sections:
- id: s0
  title: Setup
  steps:
  - id: cv.s0.1
    title: Check the ClosestVendor version
    auto: true
    action:
      kind: manual
      text: CheckThat reads the ClosestVendor version.
    expect: The ClosestVendor version is 1.11.3 or newer. If the step fails, copy ClosestVendor 1.11.3
      into the game again.
    verify:
    - assertions
    call:
      addon: ClosestVendor
      entry: version
    timeout: 30
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.version
      op: ge
      value: 11103
      label: ClosestVendor is 1.11.3 or newer
    notes: The entry returns major*10000 + minor*100 + patch, so 1.11.3 is 11103. It reads a fact, not
      the debug log, so it runs before debug logging is on. CheckThat too old to offer entries leaves
      this step unverified.
  - id: cv.s0.2
    title: Turn on Lua errors and reload
    action:
      kind: manual
      text: Type |cff99ccff/console scriptErrors 1|r, then |cff99ccff/reload|r.
      commands:
      - /console scriptErrors 1
      - /reload
    expect: No Lua error popup appears, and ClosestVendor is in the AddOns list (Esc, AddOns). Press Pass.
    verify:
    - player
    reload: after_action
  - id: cv.s0.3
    title: 'Optional: install TomTom, and WaypointUI (WoW Forever only)'
    action:
      kind: manual
      text: 'Optional: install TomTom, and WaypointUI (WoW Forever only). The Navigation and Waypoint
        choice sections use them.'
    expect: Both show in the AddOns list. Press Pass.
    verify:
    - player
    clients:
    - forever-camelot
  - id: cv.s0.4
    title: 'Ammo sections: use a ranged class with ammo equipped'
    action:
      kind: manual
      text: 'Ammo sections only: use a hunter, warrior or rogue with a bow, crossbow or gun equipped and
        some ammo in the ammo slot.'
    expect: The ammo shows in the ammo slot. Press Pass.
    verify:
    - player
  - id: cv.s0.5
    title: Turn debug logging on
    action:
      kind: manual
      text: Type |cff99ccff/cvn debug on|r, then |cff99ccff/reload|r.
      commands:
      - /cvn debug on
      - /reload
    expect: After the reload, the debug log still records that it turned on.
    verify:
    - assertions
    reload: after_action
    auto: true
    timeout: 120
    assertions:
    - kind: log
      source: debug
      contains: debug log turned on
      scope: attempt
      label: The debug log records that it turned on
  intro: 'Install: copy |cff99ccffClosestVendor/|r into the AddOns folder and start the game. Every item
    is pass/fail. The tester checks the expected result. The reviewer checks the log lines. After the
    last check, type |cff99ccff/reload|r again so the game saves the log. The reviewer reads |cff99ccffClosestVendorCharDB|r
    in |cff99ccffWTF/Account/<account>/<realm>/<character>/SavedVariables/ClosestVendor.lua|r and |cff99ccffClosestVendorDB|r
    in |cff99ccffWTF/Account/<account>/SavedVariables/ClosestVendor.lua|r.
    A section that says "Setup" lists what only that section needs, such as a class, a profession or an
    addon.'
- id: s1
  title: Settings page and commands
  steps:
  - id: cv.s1.1
    title: Open Esc, Options, AddOns, Closest Vendor and look at Home
    action:
      kind: manual
      text: Open Esc, Options, AddOns, |cffffd100Closest Vendor|r and look at Home.
    expect: 'Home lists the Warnings in order: Bag space, Durability and Professions (each a checkbox
      and a slider), then Ammo, Reagents and Supplies (a checkbox only). Press Pass.'
    verify:
    - player
    notes: 'Player step. Drawing: the order and controls of the Home page.'
  - id: cv.s1.2
    title: Look at the pages below Home
    action:
      kind: manual
      text: Look at the pages below Home.
    expect: The pages are Restock, Navigation, Appearance, Advanced and About. Restock holds Ammo, Reagents
      and Supplies. Appearance holds the Notifications, Status window and Sound tabs. Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: the page list in the AddOns tree.'
  - id: cv.s1.3
    title: Open the Ammo page as a Hunter
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Open the Ammo page.
    expect: Below the ammo slider are Buy ammo, Ask before buying and the arrow and bullet dropdowns.
      Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: the layout of the Ammo page. No line proves it. Hunter only.'
  - id: cv.s1.4
    title: Open the Reagents page as a reagent class (for example a Mage)
    action:
      kind: manual
      text: Reagent class only (for example a Mage); press Skip otherwise. Open the Reagents page.
    expect: Under the slider is one checkbox for each reagent of your class. Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: the layout of the Reagents page. No line proves it. Reagent class only.'
  - id: cv.s1.5
    title: Move a slider, then enter /cvn status
    action:
      kind: manual
      text: Move a slider on Home (any one), then press Run (|cff99ccff/cvn status|r).
      commands:
      - /cvn status
    expect: '|cff99ccff/cvn status|r shows the new slider number. Press Pass.'
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      pattern: 'setting changed: %a+Threshold %d+ %-> %d+'
      scope: attempt
      label: The slider change was saved as a threshold
    notes: Player step. Chat wording of /cvn status is the point. The setting changed line proves the slider
      moved and was saved (the page writes it about a second after the last change). Move the slider,
      then wait a second.
  - id: cv.s1.6
    title: Enter /cvn ammo 500 and reopen the page
    action:
      kind: manual
      text: Enter |cff99ccff/cvn ammo 500|r and reopen the page.
      commands:
      - /cvn ammo 500
    expect: The ammo slider is at 500. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      pattern: 'setting changed: ammoThreshold %d+ %-> 500'
      scope: attempt
      label: The ammo threshold became 500
    notes: Player step. The slider position after reopening is drawing. The setting changed line is written
      by the typed command and proves the saved value.
  - id: cv.s1.7
    title: Clear a checkbox
    action:
      kind: manual
      text: Clear a checkbox on Home (for example Ammo).
    expect: Its slider is greyed out and that trigger stops asking. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      pattern: 'setting changed: %a+Enabled true %-> false'
      scope: attempt
      label: A feature switch was turned off
    notes: 'Player step. Drawing: the grey slider. The setting changed line proves the switch was saved
      as off. Check 13 turns it back on. That trigger stops asking is a unit-test result; no line proves
      it here.'
  - id: cv.s1.8
    title: Enter /cvn config
    action:
      kind: manual
      text: Enter |cff99ccff/cvn config|r.
      commands:
      - /cvn config
    expect: The settings page opens. Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: the settings page opening. No line proves it.'
  - id: cv.s1.9
    title: Enter /cvn status
    action:
      kind: manual
      text: Enter |cff99ccff/cvn status|r.
      commands:
      - /cvn status
    expect: It prints readable lines with no stray symbols or missing text. Press Pass.
    verify:
    - player
    notes: 'Player step. Chat wording: no line proves it.'
  - id: cv.s1.10
    title: Enter /cvn help
    action:
      kind: manual
      text: Enter |cff99ccff/cvn help|r.
      commands:
      - /cvn help
    expect: It prints readable lines with no stray symbols or missing text. Press Pass.
    verify:
    - player
    notes: 'Player step. Chat wording: no line proves it.'
  - id: cv.s1.11
    title: Change settings with /cvn and on the page, then reload
    action:
      kind: manual
      text: Change one setting on a settings page and one with |cff99ccff/cvn bags 3|r. Wait a second,
        then press Run (|cff99ccff/reload|r).
      commands:
      - /cvn bags 3
      - /reload
    expect: The settings stay after the reload. Press Pass.
    verify:
    - player
    - assertions
    reload: after_action
    assertions:
    - kind: log
      source: debug
      pattern: 'setting changed: bagThreshold %d+ %-> 3'
      scope: attempt
      label: The slash command changed the bag threshold
    - kind: log
      source: debug
      contains: 'setting changed: '
      scope: attempt
      label: Two settings changed before the reload
      count:
        min: 2
    notes: Player step. Whether the values survive the reload is read from the settings pages. The setting
      changed lines prove both changes were saved before the reload. Check 13 sets the bag threshold back.
  - id: cv.s1.12
    title: Change settings again and restart the game
    action:
      kind: manual
      text: Change one setting on a settings page and restart the game (a full restart, not a reload).
    expect: The setting stays after the restart. Press Pass.
    verify:
    - player
    notes: Player step. A game restart ends the CheckThat session, so no line after it can be read. Check
      13 sets it back.
  - id: cv.s1.13
    title: Set the default thresholds back
    action:
      kind: manual
      text: 'Press Run to type the default thresholds back: |cff99ccff/cvn bags 2|r, |cff99ccff/cvn dur
        20|r, |cff99ccff/cvn ammo 200|r and |cff99ccff/cvn trade 10|r. Then turn back on the checkbox
        you cleared in check 7 and set back any other setting you changed in checks 5, 11 and 12.'
      commands:
      - /cvn bags 2
      - /cvn dur 20
      - /cvn ammo 200
      - /cvn trade 10
    expect: Chat shows the default thresholds. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      pattern: 'setting changed: ammoThreshold %d+ %-> 200'
      scope: attempt
      label: The ammo threshold is back at 200
    - kind: log
      source: debug
      pattern: 'setting changed: bagThreshold %d+ %-> 2'
      scope: attempt
      label: The bag threshold is back at 2
      diagnostic: true
    - kind: log
      source: debug
      pattern: 'setting changed: durThreshold %d+ %-> 20'
      scope: attempt
      label: The durability threshold is back at 20
      diagnostic: true
    - kind: log
      source: debug
      pattern: 'setting changed: tradeThreshold %d+ %-> 10'
      scope: attempt
      label: The profession threshold is back at 10
      diagnostic: true
    notes: 'Player step. Cleanup. The ammo line is required because check 6 set 500. The others are diagnostic:
      they are written only when the value differed. The chat wording is the player part.'
  intro: Start with the default thresholds (bags 2, durability 20, ammo 200, professions 10). Check 3
    needs a Hunter and check 4 a reagent class; press Skip otherwise. Debug logging is on. Check 13 sets
    the thresholds back.
- id: s2
  title: The question
  steps:
  - id: cv.s2.1
    title: Enter /cvn test sell
    action:
      kind: manual
      text: Enter |cff99ccff/cvn test sell|r.
      commands:
      - /cvn test sell
    expect: A question shows a vendor name and a zone. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'test command: sell'
      scope: attempt
      label: The sell test ran
    - kind: log
      source: debug
      contains: 'question shown: sell, '
      scope: attempt
      label: The sell question was asked
    notes: 'Player step. Drawing: the dialog text (vendor name and zone). The log proves the test ran and found a vendor. The original plan also expected "reminder: test", but Controller.lua logs that line only for /cvn test remind, so it is not asserted.'
  - id: cv.s2.2
    title: Enter /cvn test repair
    action:
      kind: manual
      text: Enter |cff99ccff/cvn test repair|r.
      commands:
      - /cvn test repair
    expect: A question shows a vendor name and a zone. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'test command: repair'
      scope: attempt
      label: The repair test ran
    - kind: log
      source: debug
      contains: 'question shown: repair, '
      scope: attempt
      label: The repair question was asked
    notes: 'Player step. Drawing: the dialog text (vendor name and zone).'
  - id: cv.s2.3
    title: As a Hunter, type /cvn test arrows, then /cvn test bullets
    action:
      kind: manual
      text: As a Hunter, type |cff99ccff/cvn test arrows|r, then |cff99ccff/cvn test bullets|r.
      commands:
      - /cvn test arrows
      - /cvn test bullets
    expect: The last question shows a vendor name and a zone. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'test command: arrow'
      - contains: 'question shown: arrow, '
      - contains: 'test command: bullet'
      - contains: 'question shown: bullet, '
      scope: attempt
      label: Both tests ran and asked, arrows first
    notes: 'Player step. Drawing: the dialog text (vendor name and zone). The commands say arrows and bullets; the log names the kinds arrow and bullet.'
  - id: cv.s2.4
    title: Enter /cvn test sell and click Yes
    action:
      kind: manual
      text: Enter |cff99ccff/cvn test sell|r and click |cffffd100Yes|r. When the question names two vendors, click |cffffd100This map|r or |cffffd100Closest|r.
      commands:
      - /cvn test sell
    expect: A waypoint to the vendor is set (see the Navigation section). Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'accepted: '
      scope: attempt
      label: Yes set a waypoint
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the waypoint
    notes: 'Player step. Drawing: the waypoint arrow. The log proves Yes was taken and a provider set the waypoint; the test command alone proves neither.'
  - id: cv.s2.5
    title: Enter /cvn test sell, click No, then enter it again and press Esc
    action:
      kind: manual
      text: Enter |cff99ccff/cvn test sell|r and click |cffffd100No|r (|cffffd100Cancel|r when the question names two vendors). Then enter it again and press Esc.
      commands:
      - /cvn test sell
    expect: Nothing happens after either answer.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log
      source: debug
      contains: 'question declined: sell'
      count:
        min: 2
      scope: attempt
      label: Both answers were taken as No
    - kind: log
      source: debug
      contains: 'accepted: '
      absent: true
      scope: attempt
      label: No waypoint was set
  - id: cv.s2.6
    title: Make the sell warning due, then change your bags again
    setup: Have at least 3 free bag slots. Wear at least one item between 21% and 99% durability and nothing at 20% or below.
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn bags 200|r) so the sell warning is due. Leave the question open. Then move an item in your bags.
      commands:
      - /cvn bags 200
    expect: The sell question appears once and does not repeat after the bag move.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: trigger go sell
      - contains: event BAG_UPDATE_DELAYED
      scope: attempt
      label: The sell request went out, then your bag move was checked
    - kind: log
      source: debug
      contains: 'question shown: sell, '
      count:
        exactly: 1
      scope: attempt
      label: The sell question was asked only once
    notes: The bag move must come after the question, so Run alone cannot pass the step. The count proves the check after the move asked nothing again. With 3 or more free slots the default threshold 2 leaves the sell warning off before the step, so its latch is clear.
  - id: cv.s2.7
    title: End the sell warning, then make the repair warning due
    setup: The sell question from check 6 is open. Wear at least one item between 21% and 99% durability, so the default 20 ends the repair warning in check 9.
    action:
      kind: manual
      text: Press Run. It types |cff99ccff/cvn bags 0|r, which ends the sell warning, then |cff99ccff/cvn dur 100|r, which makes the repair warning due. Leave the repair question open.
      commands:
      - /cvn bags 0
      - /cvn dur 100
    expect: The sell question closes and the repair question appears once.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: trigger clear sell
      - contains: trigger go repair
      scope: attempt
      label: The sell request ended, then the repair request went out
    - kind: log
      source: debug
      contains: 'question shown: repair, '
      count:
        exactly: 1
      scope: attempt
      label: The repair question was asked once
    notes: The threshold 0 ends the sell warning while any bag slot is free. The durability threshold stays at 100 until check 9 types the default back.
  - id: cv.s2.8
    title: Click Yes on the repair question
    action:
      kind: manual
      text: Click |cffffd100Yes|r on the repair question. When it names two vendors, click |cffffd100This map|r or |cffffd100Closest|r.
    expect: Navigation starts to the vendor named in the question. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'accepted: '
      scope: attempt
      label: Yes set a waypoint
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the waypoint
    notes: 'Player step. Drawing: the waypoint arrow and the vendor it points to.'
  - id: cv.s2.9
    title: End the repair request, then click No on the sell question
    action:
      kind: manual
      text: Press Run. It types the default |cff99ccff/cvn dur 20|r, which ends the repair request, then |cff99ccff/cvn bags 200|r. Click |cffffd100No|r on the sell question (|cffffd100Cancel|r when it names two vendors).
      commands:
      - /cvn dur 20
      - /cvn bags 200
    expect: After No, the sell question does not come back while the warning stays due.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: trigger clear repair
      - contains: trigger go sell
      - contains: 'question declined: sell'
      scope: attempt
      label: The repair request ended, the sell request went out, and No was taken
    - kind: log
      source: debug
      contains: 'question shown: sell, '
      count:
        exactly: 1
      scope: attempt
      label: The sell question was not asked again after No
    notes: After No the addon checks again (Controller release), so a second sell question in the step window fails the count. Check 10 makes the warning due again.
  - id: cv.s2.10
    title: Make the sell warning due again, then open a vendor window
    action:
      kind: manual
      text: 'Press Run. It types |cff99ccff/cvn bags 0|r, which ends the sell warning, then |cff99ccff/cvn bags 200|r, which makes it due again. With the new sell question open, open a vendor''s window.'
      commands:
      - /cvn bags 0
      - /cvn bags 200
    expect: The sell question comes back. Opening the vendor window closes it.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question shown: sell, '
      - contains: merchant window opened
      - contains: 'question closed: merchant opened (sell)'
      scope: attempt
      label: The sell question came back, and the vendor window closed it
    notes: The threshold going to 0 and back up ends the No from check 9, so the question comes back. Opening any vendor window closes a vendor question (Controller OnMerchantShow) and logs which one. A trainer question stays open and writes no closed line.
  - id: cv.s2.11
    title: Make the sell and then the repair warning due
    action:
      kind: manual
      text: Press Run. It types |cff99ccff/cvn bags 0|r and |cff99ccff/cvn bags 200|r, so the sell question shows, then |cff99ccff/cvn dur 100|r. Leave the repair question open and move an item in your bags.
      commands:
      - /cvn bags 0
      - /cvn bags 200
      - /cvn dur 100
    expect: The sell question shows, then the repair question replaces it. No sell question comes back while the repair question is open.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: trigger go sell
      - contains: trigger go repair
      - contains: 'question shown: repair, '
      - contains: event BAG_UPDATE_DELAYED
      scope: attempt
      label: Sell went out, repair replaced it, and your bag move was checked
    - kind: log
      source: debug
      contains: 'question shown: sell, '
      count:
        exactly: 1
      scope: attempt
      label: No second sell question while repair was open
    notes: 'Run fixes the order: each command checks at once (Core evaluate), so sell is asked first and repair, the higher warning, replaces it. The bag move makes the addon check again while repair is open; the count proves that check asked no sell question.'
  - id: cv.s2.12
    title: Make the sell warning due during combat
    setup: Start a fight first. The Run button hides in combat, so copy each line from its box into chat, in order.
    action:
      kind: manual
      text: During the fight, enter |cff99ccff/cvn dur 20|r (the default), |cff99ccff/cvn bags 0|r and |cff99ccff/cvn bags 200|r from their boxes, in that order.
      commands:
      - /cvn dur 20
      - /cvn bags 0
      - /cvn bags 200
    expect: No question appears in combat.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: trigger clear repair
      - contains: 'trigger held in combat: sell'
      scope: attempt
      label: The repair request ended, and the sell warning waited for the fight
    - kind: log
      source: debug
      contains: 'question shown: sell, '
      absent: true
      diagnostic: true
      scope: attempt
      label: No sell question during the fight
    notes: 'The commands belong in the fight: run before it, they ask the sell question at once and the hold line is missing, so the step fails. The default 20 ends the repair request from check 11; the threshold 0 ends the sell warning that the repair trip covered. The absent check is diagnostic: the fight may end inside the step and the question then comes.'
  - id: cv.s2.13
    title: End combat with the condition still true
    action:
      kind: manual
      text: End combat with the condition still true.
    expect: The question appears after combat ends.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: event PLAYER_REGEN_ENABLED
      - contains: 'question shown: sell, '
      scope: attempt
      label: The sell question came after the fight ended
  - id: cv.s2.14
    title: Type the default bag threshold back
    action:
      kind: manual
      text: Press Run to type the default bag threshold back (|cff99ccff/cvn bags 2|r).
      commands:
      - /cvn bags 2
    expect: Chat shows the bag threshold 2 and the sell question closes. Press Pass.
    verify:
    - player
    notes: 'Player step. Cleanup: checks 6 to 13 changed the bag and durability thresholds; check 12 typed the durability default back and this types the bag default back. Nothing to log.'
  intro: 'Run these checks on a character with the default thresholds; the checks change thresholds and set them back to the defaults. Use |cff99ccff/cvn choice ask|r so questions show. No ammo, reagent, food, water or pet food warning may be due.'
- id: s3
  title: Navigation
  intro: Start with the default waypoint choice, Automatic, and the question mode Ask. A check for one
    navigation setup says so in its first words; press Skip when your setup differs.
  steps:
  - id: cv.s3.1
    title: With TomTom, trigger a question and click Yes
    action:
      kind: manual
      text: TomTom only; press Skip otherwise. Press Run (|cff99ccff/cvn test sell|r) and click |cffffd100Yes|r
        (|cffffd100This map|r or |cffffd100Closest|r when it names two vendors).
      commands:
      - /cvn test sell
    expect: The TomTom arrow points at the vendor. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      pattern: 'accepted: .+ via tomtom'
      scope: attempt
      label: TomTom took the waypoint
    notes: 'Player step. Drawing: the TomTom arrow. The log proves Yes was taken and TomTom set the waypoint.'
  - id: cv.s3.2
    title: On WoW Forever with WaypointUI, trigger a question and click Yes
    action:
      kind: manual
      text: WaypointUI without TomTom only (TomTom comes first); press Skip otherwise. Press Run (|cff99ccff/cvn
        test sell|r) and click |cffffd100Yes|r (|cffffd100This map|r or |cffffd100Closest|r when it names
        two vendors).
      commands:
      - /cvn test sell
    expect: The WaypointUI destination shows. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      pattern: 'accepted: .+ via waypointui'
      scope: attempt
      label: WaypointUI took the waypoint
    notes: 'Player step. Drawing: the WaypointUI destination.'
    clients:
    - forever-camelot
  - id: cv.s3.3
    title: On WoW Forever with neither addon, trigger a question and click Yes
    action:
      kind: manual
      text: Neither TomTom nor WaypointUI only; press Skip otherwise. Press Run (|cff99ccff/cvn test sell|r)
        and click |cffffd100Yes|r (|cffffd100This map|r or |cffffd100Closest|r when it names two vendors).
      commands:
      - /cvn test sell
    expect: The map waypoint shows and is tracked. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      pattern: 'accepted: .+ via native'
      scope: attempt
      label: The game waypoint took it
    notes: 'Player step. Drawing: the game waypoint and its tracking.'
    clients:
    - forever-camelot
  - id: cv.s3.4
    title: On Classic Era with neither addon, trigger a question and click Yes
    action:
      kind: manual
      text: Neither TomTom nor WaypointUI only; press Skip otherwise. Press Run (|cff99ccff/cvn test sell|r)
        and click |cffffd100Yes|r (|cffffd100This map|r or |cffffd100Closest|r when it names two vendors).
      commands:
      - /cvn test sell
    expect: A chat line shows the vendor, the zone and the coordinates. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      pattern: 'accepted: .+ via chat'
      scope: attempt
      label: The chat line took the waypoint
    notes: 'Player step. Drawing: the chat line text. Classic Era has no game waypoint, so the chat line
      is the waypoint.'
    clients:
    - classic-era
  - id: cv.s3.5
    title: With TomTom, set a waypoint and open any vendor window
    action:
      kind: manual
      text: TomTom only; press Skip otherwise. Press Run (|cff99ccff/cvn test sell|r) and click |cffffd100Yes|r
        (|cffffd100This map|r or |cffffd100Closest|r when it names two vendors). Then open any vendor's
        window.
      commands:
      - /cvn test sell
    expect: The TomTom arrow goes away when the window opens. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - pattern: 'accepted: .+ via tomtom'
      - contains: merchant window opened
      - contains: 'waypoint cleared: a merchant window opened'
      scope: attempt
      label: TomTom set the waypoint, then the merchant window cleared it
    notes: 'Player step. Drawing: the arrow going away. The log proves the clear happened after the window
      opened.'
  - id: cv.s3.6
    title: With WaypointUI, set a waypoint and open the vendor window
    action:
      kind: manual
      text: WaypointUI without TomTom only; press Skip otherwise. Press Run (|cff99ccff/cvn test sell|r)
        and click |cffffd100Yes|r (|cffffd100This map|r or |cffffd100Closest|r when it names two vendors).
        Then open any vendor's window.
      commands:
      - /cvn test sell
    expect: The WaypointUI destination goes away when the window opens. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - pattern: 'accepted: .+ via waypointui'
      - contains: merchant window opened
      - contains: 'waypoint cleared: a merchant window opened'
      scope: attempt
      label: WaypointUI set the waypoint, then the merchant window cleared it
    notes: 'Player step. Drawing: the destination going away.'
    clients:
    - forever-camelot
  - id: cv.s3.7
    title: Read the waypoint method the addon uses
    setup: TomTom installed and enabled, with the Waypoint choice Automatic (the setup of check 1); press
      Skip otherwise.
    action:
      kind: manual
      text: CheckThat reads the waypoint method the addon uses now.
    expect: The method is TomTom.
    verify:
    - assertions
    auto: true
    timeout: 30
    call:
      addon: ClosestVendor
      entry: nav
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.nav
      op: eq
      value: tomtom
      label: The addon uses TomTom
    notes: Replaces the report line "navigation:", which is not in the debug log. The entry returns the
      value Core keeps (login, world entry, slash command, settings page, addon load), so the call reads
      nothing from the game. With TomTom loaded and the choice Automatic, TomTom comes first.
- id: s4
  title: Vendors and learning
  intro: 'Each check needs a vendor no character on this account has opened, so it is learned as new.
    Open its window first, close it, then press Run: Run before the window would let the window close
    the test question. Use the question mode Ask.'
  steps:
  - id: cv.s4.1
    title: Open a repair vendor the addon does not know, then test repair
    setup: Stand at a repair vendor no character on this account has opened (a new WoW Forever zone, for
      example Mount Hyjal or Zephras Isle).
    action:
      kind: manual
      text: Open the vendor's window and close it. Then press Run (|cff99ccff/cvn test repair|r).
      commands:
      - /cvn test repair
    expect: The question names that vendor. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - pattern: 'vendor learned: .+ %(npc %d+%), [nu][ep]'
      - contains: 'test command: repair'
      - contains: 'question shown: repair, '
      scope: attempt
      label: The vendor was learned as new or updated, then the repair question was asked
    - kind: log
      source: debug
      contains: it was not in the search pool
      diagnostic: true
      scope: attempt
      label: The vendor was new to the search (not shipped, not from NorgannonDB, not learned before)
    notes: 'Player step. Drawing: the dialog names the vendor you opened. The vendor stands next to you,
      so it is the closest repairer. The learned line says new or updated (a vendor already learned
      and unchanged fails: choose one the addon does not know). "it was not in the search pool", a
      diagnostic, means the vendor was neither shipped, nor from NorgannonDB, nor learned before; a shipped
      or NorgannonDB vendor rightly lacks it. The sequence fails when Run came first.'
  - id: cv.s4.2
    title: Open an ammo vendor the addon does not know, as a Hunter
    setup: Hunter only; press Skip on other classes. Stand at an ammo vendor no character on this account
      has opened.
    action:
      kind: manual
      text: Open the vendor's window and close it. Then press Run (|cff99ccff/cvn test arrows|r).
      commands:
      - /cvn test arrows
    expect: The question names that vendor. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - pattern: 'vendor learned: .+ %(npc %d+%), [nu][ep]'
      - contains: 'test command: arrow'
      - contains: 'question shown: arrow, '
      scope: attempt
      label: The vendor was learned as new or updated, then the arrow question was asked
    - kind: log
      source: debug
      contains: it was not in the search pool
      diagnostic: true
      scope: attempt
      label: The vendor was new to the search (not shipped, not from NorgannonDB, not learned before)
    notes: 'Player step. Drawing: the dialog names the vendor you opened. The command says arrows; the
      log names the kind arrow.'
  - id: cv.s4.3
    title: Open a general vendor the addon does not know
    setup: Stand at a vendor no character on this account has opened.
    action:
      kind: manual
      text: Open the vendor's window and close it. Then press Run (|cff99ccff/cvn test sell|r).
      commands:
      - /cvn test sell
    expect: The question names that vendor. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - pattern: 'vendor learned: .+ %(npc %d+%), [nu][ep]'
      - contains: 'test command: sell'
      - contains: 'question shown: sell, '
      scope: attempt
      label: The vendor was learned as new or updated, then the sell question was asked
    - kind: log
      source: debug
      contains: it was not in the search pool
      diagnostic: true
      scope: attempt
      label: The vendor was new to the search (not shipped, not from NorgannonDB, not learned before)
    notes: 'Player step. Drawing: the dialog names the vendor you opened.'
  - id: cv.s4.4
    title: Target a vendor that will not trade with you, then test sell
    setup: Stand near a vendor the addon knows that is Unfriendly or Hostile to you (its name shows red
      or orange), with other vendors further away.
    action:
      kind: manual
      text: Target that vendor. Then press Run (|cff99ccff/cvn test sell|r).
      commands:
      - /cvn test sell
    expect: The question does not name that vendor. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - pattern: 'standing: npc %d+ will not trade'
      - contains: 'test command: sell'
      - contains: 'question shown: sell, '
      scope: attempt
      label: The vendor was seen as refusing, then the sell question was asked
    notes: 'Player step. Drawing: the dialog names another vendor. A vendor that refuses cannot open its
      window, so the target gives the standing. A vendor this character already saw refusing writes the
      line again with ", already known". Sections 21 and 24 check named NPCs.'
- id: s5
  title: Ammo
  steps:
  - id: cv.s5.1
    title: As a Hunter, equip a bow with fewer arrows than the threshold
    setup: A Hunter with a bow and 3 to 2000 arrows in the ammo slot, and a gun in your bags. The ammo threshold goes up to 2000, so more arrows never count as low.
    action:
      kind: manual
      text: Hunter only; press Skip on other classes. Press Run. It types |cff99ccff/cvn ammo 0|r, which ends any ammo warning, then |cff99ccff/cvn ammo 2000|r, so your 3 to 2000 arrows are low. Leave the arrow question open for check 2.
      commands:
      - /cvn ammo 0
      - /cvn ammo 2000
    expect: The arrows question appears.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log
      source: debug
      contains: 'question shown: arrow, '
      scope: attempt
      label: The arrow question was asked
    notes: 'Class step: a run belongs to one character, so other classes skip it. The threshold 0 clears the ammo latch while you carry any arrows, so the threshold 2000 asks again. An answered question would hold the ammo warning until the count clears, so check 2 needs this one open.'
  - id: cv.s5.2
    title: As a Hunter, equip a gun with fewer bullets than the threshold
    setup: The arrow question from check 1 is still open.
    action:
      kind: manual
      text: Hunter only; press Skip on other classes. Equip the gun. Leave the bullet question open.
    expect: The arrow question closes and the bullets question appears.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'ammo request restarted: arrow -> bullet'
      - contains: 'question shown: bullet, '
      scope: attempt
      label: The arrow request ended and the bullet question was asked
    notes: Class step. The ammo threshold is still 2000, so any bullet count is low. Arrows in the ammo slot count as 0 bullets.
  - id: cv.s5.3
    title: As a Hunter, shoot ammo down to the threshold
    setup: Equip the bow with arrows again before you press Run, and count your arrows. The arrow question may show; leave it.
    action:
      kind: manual
      text: Hunter only; press Skip on other classes. Press Run (|cff99ccff/cvn ammo 0|r) to end the ammo request. Then enter |cff99ccff/cvn ammo|r, a space and a count 3 below your arrows (for example 197 with 200 arrows). Shoot a target until your arrows drop to that count.
      commands:
      - /cvn ammo 0
    expect: The arrow question appears when you cross the threshold, or as soon as the fight ends.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: trigger clear ammo
      - contains: trigger go ammo (
      - contains: 'question shown: arrow, '
      scope: attempt
      label: The ammo request ended, your shots crossed the threshold, and the arrow question came
    - kind: log
      source: debug
      contains: 'trigger held in combat: ammo'
      diagnostic: true
      scope: attempt
      label: The crossing was held until the fight ended
    - kind: log
      source: debug
      contains: 'gear events: '
      diagnostic: true
      scope: attempt
      label: Ammo changes were checked
    notes: 'Class step. The threshold you type by hand sits just below your count, so a few shots cross it. Shooting is combat, so the crossing is usually held until the fight ends; the hold line is diagnostic, because the crossing shot can kill the target and end the fight first. A threshold typed at or above your count asks at once, before any shot, so type a count below your arrows. The threshold goes up to 2000, so start with 3 to 2000 arrows. Equip the bow before Run: with the gun, 0 bullets stay low at threshold 0 and the request does not end. The game may report the count as a bag update instead of a gear event, so the "gear events: N folded into one check" line is diagnostic.'
  - id: cv.s5.4
    title: As a Hunter, equip a bow with only bullets in the ammo slot
    setup: 'Put bullets in the bow''s ammo slot instead of arrows before you press Run.'
    action:
      kind: manual
      text: Hunter only; press Skip on other classes. Press Run. It turns the ammo warning off, types the default threshold back (|cff99ccff/cvn ammo 200|r) and turns the warning on again.
      commands:
      - /cvn ammo off
      - /cvn ammo 200
      - /cvn ammo on
    expect: The addon counts it as no ammo and asks. Put the arrows back afterwards.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'ammo=arrow:0 '
      - contains: 'question shown: arrow, '
      scope: attempt
      label: Zero arrows counted, and the arrow question was asked
    - kind: log
      source: debug
      contains: 'ammo not watched: the ammo warning is off'
      diagnostic: true
      scope: attempt
      label: The ammo warning was off in between
    notes: Class step. Turning the warning off and on ends the ammo request from check 3, so the zero count asks again. Zero arrows are low at any threshold, so this check also types the default 200 back.
  - id: cv.s5.5
    title: As a Rogue or Warrior, equip a thrown weapon
    setup: A bow, crossbow or gun is equipped, and a thrown weapon is in your bags.
    action:
      kind: manual
      text: Rogue, Warrior, or a Hunter who has learned Thrown only; press Skip otherwise. Equip the thrown weapon.
    expect: The addon never asks about ammo.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'ammo not watched: no bow, crossbow or gun equipped, or its ammo cannot be read'
      scope: attempt
      label: The addon stopped watching ammo
    - kind: log
      source: debug
      contains: trigger go ammo
      absent: true
      scope: attempt
      label: No ammo request
    - kind: log
      source: debug
      contains: 'question shown: arrow'
      absent: true
      scope: attempt
      label: No arrow question
    - kind: log
      source: debug
      contains: 'question shown: bullet'
      absent: true
      scope: attempt
      label: No bullet question
    notes: 'Class step: it needs a thrown weapon and nothing from the checks before it.'
  - id: cv.s5.6
    title: As a Mage, Priest or Warlock, equip a wand
    setup: A wand is in your bags.
    action:
      kind: manual
      text: Mage, Priest or Warlock only; press Skip on other classes. Equip the wand.
    expect: The addon never asks about ammo.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: event PLAYER_EQUIPMENT_CHANGED
      scope: attempt
      label: The new weapon was checked
    - kind: log
      source: debug
      contains: 'ammo watched: '
      absent: true
      scope: attempt
      label: Ammo is not watched
    - kind: log
      source: debug
      contains: trigger go ammo
      absent: true
      scope: attempt
      label: No ammo request
    - kind: log
      source: debug
      contains: 'question shown: arrow'
      absent: true
      scope: attempt
      label: No arrow question
    - kind: log
      source: debug
      contains: 'question shown: bullet'
      absent: true
      scope: attempt
      label: No bullet question
    notes: 'Class step: it needs a wand user and nothing from the checks before it. A wand never needs ammo, so nothing changes and no ammo line is written; the equipment event proves the check ran.'
  intro: Run these checks on a character with the default thresholds; the checks change thresholds and set them back to the defaults. Use |cff99ccff/cvn choice ask|r. Press Skip on a check your class cannot do.
- id: s6
  title: Professions
  intro: Run these checks on a character with the default thresholds; the checks change thresholds and
    set them back to the defaults. Use the question mode Ask with no warning due. A profession counts
    once you opened its trainer or crafting window.
  steps:
  - id: cv.s6.1
    title: Open a profession trainer
    setup: Stand at a profession trainer.
    action:
      kind: manual
      text: Open the trainer's window.
    expect: The addon learns the trainer and the professions it teaches.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'trainer learned: '
      - contains: trainer window opened
      scope: attempt
      label: The trainer was learned when its window opened
    notes: 'The line names the trainer, its npc id, new or unchanged, and what it teaches. The report
      line "trainers: N learned" is not in the debug log, so it is not asserted.'
  - id: cv.s6.2
    title: Open a class trainer
    setup: Stand at a class trainer (the trainer that teaches your spells).
    action:
      kind: manual
      text: Open the trainer's window.
    expect: The addon learns nothing from it.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log
      source: debug
      contains: 'trainer window: nothing learned: not a profession trainer'
      scope: attempt
      label: The class trainer was recognised and not learned
    - kind: log
      source: debug
      contains: 'trainer learned: '
      absent: true
      scope: attempt
      label: No trainer was learned
  - id: cv.s6.3
    title: Reach the profession threshold and gather
    setup: No question is open, no warning is due and no trainer waypoint is set.
    action:
      kind: manual
      text: Gather or craft until a profession is 10 points or fewer from its limit (for example 65 of
        75 Mining).
    expect: The trainer question appears on that skill-up. It names the profession, the points left and
      the trainer. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'question shown: trainer for '
      scope: attempt
      label: The trainer question was asked
    notes: 'Player step. Drawing: the dialog text. Reaching the threshold can take longer than an automatic
      check waits.'
  - id: cv.s6.4
    title: Click Yes on the trainer question
    action:
      kind: manual
      text: Click |cffffd100Yes|r on the trainer question.
    expect: A waypoint to the trainer is set. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'accepted: '
      scope: attempt
      label: Yes set a waypoint
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the waypoint
    notes: 'Player step. Drawing: the waypoint. A trainer waypoint holds back new trainer questions, so
      check 5 replaces it first.'
  - id: cv.s6.5
    title: Craft near the limit with a tradeskill window open and no skill-up
    setup: The profession from check 3 is still 10 points or fewer from its limit.
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn test sell|r) and click |cffffd100Yes|r (|cffffd100This map|r or
        |cffffd100Closest|r when it names two vendors), so a vendor waypoint replaces the trainer waypoint.
        Then craft one item that gives no skill-up, with the crafting window open.
      commands:
      - /cvn test sell
    expect: The trainer question appears after the craft.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'accepted: '
      - contains: a craft finished
      - contains: 'question shown: trainer for '
      scope: attempt
      label: The trainer waypoint was replaced, then the craft asked
  - id: cv.s6.6
    title: Answer No to the trainer question, then craft again
    setup: The trainer question from check 5 is open.
    action:
      kind: manual
      text: Click |cffffd100No|r on the trainer question, then craft one item.
    expect: The question appears again after the craft.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question declined: trainer'
      - contains: a craft finished
      - contains: 'question shown: trainer for '
      scope: attempt
      label: No was taken, then the craft asked again
  - id: cv.s6.7
    title: Leave the trainer question open, then craft again
    setup: The trainer question from check 6 is open.
    action:
      kind: manual
      text: Leave the question open and craft one item.
    expect: The question does not show a second time.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: a craft finished
      - contains: 'profession check skipped: a question is open'
      scope: attempt
      label: The craft was checked and skipped for the open question
    - kind: log
      source: debug
      contains: 'question shown: trainer for '
      absent: true
      scope: attempt
      label: No trainer question
  - id: cv.s6.8
    title: Reach the tier limit (for example 75/75)
    setup: Click |cffffd100No|r on the open trainer question. The profession is 1 point below its limit
      (for example 74 of 75), at the level its next tier needs (10, 20 or 35).
    action:
      kind: manual
      text: Gain the last point (gather or craft).
    expect: The addon asks at the limit too.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log
      source: debug
      pattern: 'question shown: trainer for .+, 0 point%(s%) left'
      scope: attempt
      label: The trainer question was asked at the limit
  - id: cv.s6.9
    title: Reach the final tier (300/300)
    setup: 'Only with a profession at 290 to 300 of 300; press Skip otherwise. Leave the trainer question
      from check 8 open: the check still names what it leaves out, then skips for the open question.'
    action:
      kind: manual
      text: Open its crafting window and craft one item.
    expect: The addon does not ask.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: a craft finished
      - contains: the last tier
      scope: attempt
      label: The craft was checked and the last tier left out
    - kind: log
      source: debug
      contains: 'question shown: trainer for '
      absent: true
      scope: attempt
      label: No trainer question
    notes: The open question keeps this check from asking anything, so it proves only the left-out line.
      Check 19 proves that a profession at the last tier is never asked about.
  - id: cv.s6.10
    title: With a trainer waypoint set, open a vendor window
    setup: Click |cffffd100Yes|r on the trainer question from check 8, or click the profession row in
      the status window, so a trainer waypoint is set.
    action:
      kind: manual
      text: Open any vendor's window.
    expect: The trainer waypoint stays.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: merchant window opened
      - contains: 'waypoint kept: it leads to a '
      scope: attempt
      label: The merchant window kept the trainer waypoint
    - kind: log
      source: debug
      contains: 'trainer waypoint cleared: '
      absent: true
      scope: attempt
      label: The trainer waypoint was not cleared
  - id: cv.s6.11
    title: With a trainer waypoint set, open that profession's trainer window
    setup: The trainer waypoint from check 10 is set. Stand next to a trainer of that profession.
    action:
      kind: manual
      text: Open the trainer's window. Then learn the next tier, so no profession is at its limit for
        checks 12 to 14 and 19.
    expect: The trainer waypoint goes away.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: trainer window opened
      - contains: 'trainer waypoint cleared: the '
      scope: attempt
      label: The trainer window cleared the trainer waypoint
    notes: The cleared line is written only when the waypoint method confirms the removal; otherwise the
      line says "clear not confirmed" or FAILED.
  - id: cv.s6.12
    title: Use a profession whose trainer or crafting window you never opened
    setup: Only with a profession whose trainer or crafting window you never opened, 10 points or fewer
      from its limit (for example Skinning); press Skip otherwise. No other known profession is 10 points
      or fewer from its limit. No weapon skill is near its limit either.
    action:
      kind: manual
      text: Gain a point in it.
    expect: The addon stays silent.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log
      source: debug
      contains: no trainer or crafting window seen
      scope: attempt
      label: The skill was left out as never seen
    - kind: log
      source: debug
      contains: 'question shown: trainer for '
      absent: true
      scope: attempt
      label: No trainer question
    notes: A weapon skill near its limit writes the same reason, so the setup rules it out.
  - id: cv.s6.13
    title: Use a weapon skill near its limit
    setup: Below level 60 only, with a weapon skill 10 points or fewer from its limit; press Skip otherwise
      (at level 60 every weapon skill limit is 300, which the addon leaves out). No other known profession
      is 10 points or fewer from its limit.
    action:
      kind: manual
      text: Fight until that weapon skill rises; keep fighting until the check passes.
    expect: The addon stays silent.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log
      source: debug
      pattern: 'left out: .*%(no trainer or crafting window seen%)'
      scope: attempt
      label: The weapon skill was left out as never seen
    - kind: log
      source: debug
      contains: 'question shown: trainer for '
      absent: true
      scope: attempt
      label: No trainer question
    notes: A weapon skill is never a known profession, so it is left out with the same reason as a profession
      never seen. A skill-up alone writes the same left-out line again only after 30 seconds, so a rerun
      may need a second skill-up.
  - id: cv.s6.14
    title: Use a known profession that has no trainer on this continent
    setup: Log out and back in first. A known profession 10 points or fewer from its limit, with no trainer
      known on this continent. No other known profession is 10 points or fewer from its limit. No question
      is open.
    action:
      kind: manual
      text: With its crafting window open, craft two items.
    expect: One chat line says no trainer is known, once.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log
      source: debug
      contains: a craft finished
      count:
        min: 2
      scope: attempt
      label: Both crafts were checked
    - kind: log
      source: debug
      contains: 'no known trainer for '
      count:
        exactly: 1
      scope: attempt
      label: The no-trainer line came once
    notes: The line shows once per profession in a session, so the step starts from a fresh login.
  - id: cv.s6.15
    title: Open a tradeskill window. Enter /cvn log
    action:
      kind: manual
      text: Open a tradeskill window. Then enter |cff99ccff/cvn log|r.
      commands:
      - /cvn log
    expect: The report lists the profession under "professions seen". Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: event TRADE_SKILL_SHOW
      scope: attempt
      label: The crafting window opened
    notes: Player step. The report header is not in the debug log, so the player reads the report.
  - id: cv.s6.16
    title: Enter /cvn trade 25 and open the settings page
    action:
      kind: manual
      text: Enter |cff99ccff/cvn trade 25|r and open the settings page.
      commands:
      - /cvn trade 25
    expect: The Professions slider shows 25. Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: the settings page. Check 18 types the default back.'
  - id: cv.s6.17
    title: Enter /cvn trade off and open the settings page
    action:
      kind: manual
      text: Enter |cff99ccff/cvn trade off|r and open the settings page.
      commands:
      - /cvn trade off
    expect: The Professions checkbox is cleared. Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: the settings page. Check 18 turns the warning back on.'
  - id: cv.s6.18
    title: Turn the profession warning back on at the default threshold
    action:
      kind: manual
      text: Press Run. It types |cff99ccff/cvn trade on|r and the default |cff99ccff/cvn trade 10|r.
      commands:
      - /cvn trade on
      - /cvn trade 10
    expect: Chat shows the profession warning on at 10. Press Pass.
    verify:
    - player
    notes: 'Player step. Cleanup: checks 16 and 17 set the profession threshold to 25 and turned it off.
      Nothing to log.'
  - id: cv.s6.19
    title: Craft at the final tier with no other profession near its limit
    setup: Only with a profession at 290 to 298 of 300 and no other known profession 10 points or fewer
      from its limit (check 11 trained the profession from check 8); press Skip otherwise. Click |cffffd100No|r
      on any open question first.
    action:
      kind: manual
      text: Open its crafting window and craft one item. If the check has not passed after 30 seconds,
        craft one more.
    expect: The addon does not ask.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: a craft finished
      - contains: the last tier
      scope: attempt
      label: The craft was checked and the last tier left out
    - kind: log
      source: debug
      contains: 'profession check skipped: '
      absent: true
      scope: attempt
      label: Nothing suppressed the check
    - kind: log
      source: debug
      contains: 'question shown: trainer for '
      absent: true
      scope: attempt
      label: No trainer question
    notes: Unlike check 9, no question is open and no other profession is near its limit, so a trainer
      question here would be for the last tier. At 290 to 298 one craft leaves at least one point. The same
      left-out line is written again only after 30 seconds, hence the second craft.
- id: s7
  title: Report and debug log
  steps:
  - id: cv.s7.1
    title: Turn the log off, then type /cvn log
    action:
      kind: manual
      text: Type |cff99ccff/cvn debug off|r, then |cff99ccff/cvn log|r.
      commands:
      - /cvn debug off
      - /cvn log
    expect: A window opens with the version, game build, locale, navigation method, vendor counts and
      settings, and it says how to turn the log on. Press Pass.
    verify:
    - player
    notes: Player step. The report window and its header never reach the debug log, so no line proves
      it. Debug logging is off from here until check 2.
  - id: cv.s7.2
    title: Enter /cvn debug on, trigger a question, then enter /cvn log
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn debug on|r, |cff99ccff/cvn test sell|r and |cff99ccff/cvn log|r).
        Click |cffffd100Yes|r in the question, then type |cff99ccff/cvn log|r again.
      commands:
      - /cvn debug on
      - /cvn test sell
      - /cvn log
    expect: The log window lists the events, the question shown and the question accepted. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question shown: sell, '
      - contains: 'accepted: '
      scope: attempt
      label: The sell question was shown and then accepted
    - kind: log
      source: debug
      contains: debug log turned on
      scope: attempt
      label: The log was turned on
      diagnostic: true
    - kind: log
      source: debug
      contains: 'test command: sell'
      scope: attempt
      label: The test command ran
      diagnostic: true
    notes: Player step. The log window is drawing. Run turns the log on, asks a test question and opens
      the window at once, so type /cvn log again after clicking Yes. The question lines prove the log
      recorded a decision; debug log turned on and test command are written by the Run commands and are
      diagnostic only.
  - id: cv.s7.3
    title: With the log window open, press Ctrl+C
    action:
      kind: manual
      text: With the log window open, press Ctrl+C.
    expect: The text is selected and Ctrl+C copies all of it. Press Pass.
    verify:
    - player
    notes: 'Player step. Window behavior: no line proves it.'
  - id: cv.s7.4
    title: With the log window open, press Esc
    action:
      kind: manual
      text: With the log window open, press Esc.
    expect: The window closes. Press Pass.
    verify:
    - player
    notes: 'Player step. Window behavior: no line proves it.'
  - id: cv.s7.5
    title: 'Optional: type /cvn log clear and cancel'
    action:
      kind: manual
      text: Optional; press Skip during a CheckThat run, which needs the log. Press Run (|cff99ccff/cvn
        log clear|r) and cancel.
      commands:
      - /cvn log clear
    expect: The entries stay. Press Pass.
    verify:
    - player
    notes: 'Player step. Skip during a CheckThat run: clearing the log erases evidence for earlier steps.
      The confirm dialog is drawing.'
  - id: cv.s7.6
    title: 'Optional: type /cvn log clear and confirm'
    action:
      kind: manual
      text: Optional; press Skip during a CheckThat run, which needs the log. Press Run (|cff99ccff/cvn
        log clear|r) and confirm.
      commands:
      - /cvn log clear
    expect: The entries are gone. Press Pass.
    verify:
    - player
    notes: 'Player step. Skip during a CheckThat run: clearing the log erases evidence for earlier steps.
      The empty window is drawing.'
  - id: cv.s7.7
    title: Enter /cvn debug off
    action:
      kind: manual
      text: Enter |cff99ccff/cvn debug off|r.
      commands:
      - /cvn debug off
    expect: The log stops recording.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: debug log turned off
      scope: attempt
      label: The debug log recorded that it turned off
    notes: Auto. The line is written by the command that is the checked action, just before logging stops.
  - id: cv.s7.8
    title: Turn debug logging back on
    action:
      kind: manual
      text: Type |cff99ccff/cvn debug on|r, then |cff99ccff/reload|r.
      commands:
      - /cvn debug on
      - /reload
    expect: After the reload, the debug log is still recording.
    verify:
    - assertions
    auto: true
    timeout: 120
    reload: after_action
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: debug log turned on
      - contains: event PLAYER_ENTERING_WORLD
      scope: attempt
      label: 'The log kept recording after the reload: the world entry was logged after the turn-on line'
    notes: Auto. The turn-on line is written by the command itself, so it is not the proof. The world
      entry event after the reload shows the log kept recording. Later sections read the debug log.
- id: s8
  title: Safety
  steps:
  - id: cv.s8.1
    title: Enter a dungeon, then leave it
    setup: Stand at a dungeon entrance with at least 3 free bag slots.
    action:
      kind: manual
      text: Enter the dungeon. Inside, press Run (|cff99ccff/cvn bags 200|r) so the sell warning is due. Then leave the dungeon.
      commands:
      - /cvn bags 200
    expect: Inside, no error, no question and no waypoint. After leaving, the sell question appears.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'instance: none -> party'
      - contains: 'trigger held in an instance: sell'
      - contains: 'instance: party -> none'
      - contains: 'question shown: sell, '
      scope: attempt
      label: Held inside, asked after leaving
    - kind: log
      source: errors
      pattern: '%[ClosestVendor%]'
      absent: true
      scope: attempt
      label: ClosestVendor raised no Lua error
    notes: 'Compound step: entering and leaving is one trip, and the step id stays. Press Run inside the dungeon: before it, the sell question comes at once. With 3 or more free slots the default threshold leaves the sell latch clear. The bag threshold stays at 200 until check 6 types the default back.'
  - id: cv.s8.2
    title: Enter a battleground, then leave it
    action:
      kind: manual
      text: Enter a battleground. Inside, press Run. It types |cff99ccff/cvn bags 0|r, which ends the sell request from check 1, then |cff99ccff/cvn bags 200|r. Then leave the battleground.
      commands:
      - /cvn bags 0
      - /cvn bags 200
    expect: Inside, no error, no question and no waypoint. After leaving, the sell question appears. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'instance: none -> pvp'
      - contains: 'trigger held in an instance: sell'
      - contains: 'instance: pvp -> none'
      - contains: 'question shown: sell, '
      scope: attempt
      label: Held inside, asked after leaving
    - kind: log
      source: errors
      pattern: '%[ClosestVendor%]'
      absent: true
      scope: attempt
      label: ClosestVendor raised no Lua error
    notes: 'Player step. Timing: a battleground queue and match outlast the 300 seconds an automatic step can wait, so the player presses Pass; the log checks are required. Compound step: entering and leaving is one trip. Both commands run inside, so the sell warning is due only there; the threshold 0 clears the latch an answered question from check 1 left. The bag threshold stays at 200 until check 6.'
  - id: cv.s8.3
    title: Enable TomTom after a login without it, reload, and set a waypoint
    setup: Waypoints are on Automatic (the default) and TomTom was disabled at login.
    action:
      kind: manual
      text: Optional; press Skip without TomTom. Enable TomTom in the AddOns list and click Reload UI there. After the reload, press Run (|cff99ccff/cvn test sell|r) and click |cffffd100Yes|r (or |cffffd100This map|r or |cffffd100Closest|r).
      commands:
      - /cvn test sell
    expect: No error after the reload, and a TomTom arrow points to the vendor.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: '---- login ----'
      - contains: ' via tomtom'
      scope: attempt
      label: The addon started again, then TomTom took the waypoint
    - kind: state
      probe: addon-loaded
      name: TomTom
      op: eq
      value: true
      label: TomTom is loaded
      diagnostic: true
    - kind: log
      source: errors
      pattern: '%[ClosestVendor%]'
      absent: true
      scope: attempt
      label: ClosestVendor raised no Lua error
    notes: 'The accepted line names the waypoint provider, and the sequence puts it after the login, so a waypoint accepted before the reload, or a reload without TomTom, fails the step. Press Run only after the reload: the reload is a separate action. The state probe is diagnostic because the replay cannot write it. A ClosestVendor error at load, before CheckThat has loaded, is caught only with BugGrabber installed.'
  - id: cv.s8.4
    title: Enable WaypointUI after a login without it, reload, and set a waypoint
    setup: Waypoints are on Automatic (the default), WaypointUI was disabled at login, and TomTom is disabled, because TomTom comes first.
    action:
      kind: manual
      text: Optional; press Skip without WaypointUI. Enable WaypointUI in the AddOns list and click Reload UI there. After the reload, press Run (|cff99ccff/cvn test sell|r) and click |cffffd100Yes|r (or |cffffd100This map|r or |cffffd100Closest|r).
      commands:
      - /cvn test sell
    expect: No error after the reload, and WaypointUI shows the way to the vendor.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: '---- login ----'
      - contains: ' via waypointui'
      scope: attempt
      label: The addon started again, then WaypointUI took the waypoint
    - kind: state
      probe: global-value
      name: WaypointUIAPI
      op: exists
      label: WaypointUI is loaded
      diagnostic: true
    - kind: log
      source: errors
      pattern: '%[ClosestVendor%]'
      absent: true
      scope: attempt
      label: ClosestVendor raised no Lua error
    notes: The accepted line names the waypoint provider, and the sequence puts it after the login, so a waypoint accepted before the reload, or a reload without WaypointUI, fails the step. Press Run only after the reload. The state probe is diagnostic because the replay cannot write it. A ClosestVendor error at load, before CheckThat has loaded, is caught only with BugGrabber installed.
  - id: cv.s8.5
    title: Optional, on a client where a game function is missing
    action:
      kind: manual
      text: Optional, on a client where a game function is missing.
    expect: The addon keeps working. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'game call failed: '
      - contains: 'event '
      scope: session
      label: A game call failed and events were still handled after it
    notes: 'Player step. No action: the client, not the player, makes a game call fail, often at login, so the checks read the whole session. Skip the step on a client where nothing is known to be missing.'
  - id: cv.s8.6
    title: Type the default bag threshold back
    action:
      kind: manual
      text: Press Run to type the default bag threshold back (|cff99ccff/cvn bags 2|r).
      commands:
      - /cvn bags 2
    expect: Chat shows the bag threshold 2. Press Pass.
    verify:
    - player
    notes: 'Player step. Cleanup: checks 1 and 2 set the bag threshold to 200; this types the default back. Nothing to log.'
  intro: Run these checks on a character with the default thresholds; the checks change thresholds and set them back to the defaults. Use |cff99ccff/cvn choice ask|r so questions show.
- id: s9
  title: Languages
  steps:
  - id: cv.s9.1
    title: Use a non-English client
    action:
      kind: manual
      text: Use a non-English client.
    expect: The addon sentences are in English. Spell and zone names are the game's. Press Pass.
    verify:
    - player
  - id: cv.s9.2
    title: Install a translation file (see docs/localization.md). Enter /cvn status
    action:

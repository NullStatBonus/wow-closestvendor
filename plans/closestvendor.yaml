    - kind: log
      source: debug
      contains: 'accepted: '
      scope: attempt
      label: A waypoint was set
    - kind: log
      source: debug
      contains: 'direct pin: auctioneer'
      absent: true
      scope: attempt
      label: The auction house was not closer
    notes: The absent check waits the whole timeout.
  - id: cv.s13.88
    title: With routing on, click a row inside an instance

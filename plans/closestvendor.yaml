- id: s32
  title: Warning flow
  steps:
  - id: cv.s32.1
    title: With the repair question open, click a low reagent or food row
    setup: Wear at least one item below 100% durability. A reagent or food row is low in the status window. TomTom is installed; on WoW Forever, WaypointUI or the built-in map waypoint also works. Chat coordinates alone do not prove a pin.
    action:
      kind: manual
      text: Press Run. It types |cff99ccff/cvn dur 1|r, which ends any repair warning, then |cff99ccff/cvn dur 100|r, so the repair question shows. With it open, click a low reagent or food row in the status window.
      commands:
      - /cvn dur 1
      - /cvn dur 100
    expect: 'The repair question closes and the row''s vendor is pinned.'
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question shown: repair, '
      - contains: 'direct pin: '
      - contains: 'accepted: '
      scope: attempt
      label: 'The click pinned the row''s vendor'
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the waypoint
    - kind: log
      source: debug
      contains: ' via chat'
      absent: true
      scope: attempt
      label: The pin went to a map waypoint, not only to chat coordinates
    notes: A vendor pin writes "auto:" before "accepted:", an auctioneer pin (closer than the vendor) writes only "accepted:", so the check asserts "accepted:". The threshold 1 clears a repair latch that deaths in earlier sections may have left. The durability threshold stays at 100 until check 9.
  - id: cv.s32.2
    title: Open a vendor's window afterward, then move an item in your bags
    action:
      kind: manual
      text: Open a vendor's window, then close the window and move an item in your bags. Do not repair.
    expect: The repair question comes back after the bag move.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: merchant window opened
      - contains: event BAG_UPDATE_DELAYED
      - contains: 'question shown: repair, '
      scope: attempt
      label: The repair question came back at the bag check after the vendor
  - id: cv.s32.3
    title: With the repair question open, click a row that is not low
    setup: The waypoint setup from check 1 is still in place.
    action:
      kind: manual
      text: With the repair question open, click a row that is not low.
    expect: That vendor is pinned and the repair question comes back at the next check.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'direct pin: '
      - contains: 'accepted: '
      - contains: 'request put back: repair'
      scope: attempt
      label: The vendor was pinned and repair will be asked again
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the waypoint
    - kind: log
      source: debug
      contains: ' via chat'
      absent: true
      scope: attempt
      label: The pin went to a map waypoint, not only to chat coordinates
  - id: cv.s32.4
    title: Then make bags due and answer No to the repair question
    setup: Have at least 3 free bag slots. Apart from the row you clicked in check 1, no ammo, reagent, food, water or pet food warning is due.
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn bags 200|r). Move an item in your bags and answer |cffffd100No|r (or |cffffd100Cancel|r) to the repair question.
      commands:
      - /cvn bags 200
    expect: The sell question is asked next.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question declined: repair'
      - contains: 'request released: repair'
      - contains: 'question shown: sell, '
      scope: attempt
      label: No ended the repair request, then the sell question was asked
    notes: The repair question can come back during check 3, before this step opens, so this step does not assert it. The bag threshold 200 makes selling the next warning.
  - id: cv.s32.5
    title: 'Optional: with the trainer question open, walk into the next zone'
    setup: A profession that you can still raise, and a known trainer for it. Check 9 types the profession threshold back.
    action:
      kind: manual
      text: Optional. Type |cff99ccff/cvn bags 2|r (the default bag threshold) to end the sell question, then |cff99ccff/cvn trade 300|r. Craft once so the trainer question shows. With it open, walk across a zone border.
      commands:
      - /cvn bags 2
      - /cvn trade 300
    expect: The question closes when you enter the next zone.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question shown: trainer for '
      - contains: event ZONE_CHANGED_NEW_AREA
      - contains: 'question withdrawn: the player changed zone'
      scope: attempt
      label: The trainer question was withdrawn at the zone border
    notes: Walking keeps the question on screen; a loading screen may close it first and then nothing is withdrawn. The trainer question shows only with no warning request open, so the sell request ends first. The profession threshold 300 makes any profession near its cap.
  - id: cv.s32.6
    title: 'Hunter with ammo and repair questions open: answer No to both'
    setup: A bow with 201 to 2000 arrows (above the default 200, so the ammo latch is clear, and at most the highest threshold 2000, so they count as low), and at least one item below 100% durability. Pet food is not low, or no pet is out, because pet food comes before selling.
    action:
      kind: manual
      text: Hunter only; press Skip on other classes. Press Run. It types |cff99ccff/cvn dur 1|r, |cff99ccff/cvn bags 200|r, |cff99ccff/cvn ammo 2000|r and |cff99ccff/cvn dur 100|r, in that order. Answer |cffffd100No|r (or |cffffd100Cancel|r) to repair, then to ammo.
      commands:
      - /cvn dur 1
      - /cvn bags 200
      - /cvn ammo 2000
      - /cvn dur 100
    expect: The repair question replaces the ammo question; then the sell question comes.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question shown: arrow, '
      - contains: 'question shown: repair, '
      - contains: 'question declined: repair'
      - contains: 'request released: repair'
      - contains: 'question declined: arrow'
      - contains: 'request released: arrow'
      - contains: 'question shown: sell, '
      scope: attempt
      label: Repair replaced ammo; after both No answers the sell question came
    notes: 'Class step. Run fixes the order: sell, then ammo, then repair, each replacing the one before. The threshold 1 ends the No to repair from check 4 whatever the gear. Check 9 types the defaults back.'
  - id: cv.s32.7
    title: 'Hunter with low arrows and bullets: equip a gun'
    setup: The bow is equipped and a gun is in your bags, with 2000 or fewer bullets.
    action:
      kind: manual
      text: Hunter only; press Skip on other classes. Press Run (|cff99ccff/cvn ammo off|r, then |cff99ccff/cvn ammo on|r) so the arrow question shows again. Leave it open and equip the gun.
      commands:
      - /cvn ammo off
      - /cvn ammo on
    expect: The arrow question ends and the bullet question is asked.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'ammo request restarted: arrow -> bullet'
      - contains: 'question shown: bullet, '
      scope: attempt
      label: The arrow request ended and the bullet question was asked
    notes: Class step. Turning the warning off and on ends the No to ammo from check 6. The ammo threshold is still 2000, so both counts are low; arrows in the ammo slot count as 0 bullets.
  - id: cv.s32.8
    title: Call a pet that does not eat meat while a meat vendor is pinned
    setup: Call your pet that eats meat, and have low pet food for it. A pet that does not eat meat is in the stable list. Equip the bow again before you press Run. The waypoint setup from check 1 is still in place.
    action:
      kind: manual
      text: Hunter only; press Skip on other classes. Press Run. It types |cff99ccff/cvn ammo 0|r, which ends the ammo warning, and the default |cff99ccff/cvn bags 2|r. Click |cffffd100Yes|r on the pet food question so a meat vendor is pinned. Then call the pet that does not eat meat.
      commands:
      - /cvn ammo 0
      - /cvn bags 2
    expect: 'The meat pin ends and a vendor for the new pet''s food is asked.'
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question shown: supply '
      - contains: 'accepted: '
      - contains: 'pet request restarted: pet:'
      - contains: 'question shown: supply '
      scope: attempt
      label: 'The meat vendor was pinned, then the request restarted for the new pet''s food'
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the waypoint
    - kind: log
      source: debug
      contains: ' via chat'
      absent: true
      scope: attempt
      label: The pin went to a map waypoint, not only to chat coordinates
    notes: 'Class step. The ammo request from check 7 comes before pet food, so the bow goes back on first (with the gun, 0 bullets stay low at any threshold) and the threshold 0 ends it. The second command checks again, so the pet food question comes; it also ends the sell warning. The accepted line between the two questions proves Yes pinned the meat vendor before the pet changed. Check 9 types the default ammo threshold back. The question line names the food in the client''s language ("pet food (...)" on an English client), so the check matches only "question shown: supply ".'
  - id: cv.s32.9
    title: Type the default thresholds back
    action:
      kind: manual
      text: 'Press Run to type the default thresholds back: |cff99ccff/cvn bags 2|r, |cff99ccff/cvn dur 20|r, |cff99ccff/cvn ammo 200|r and |cff99ccff/cvn trade 10|r.'
      commands:
      - /cvn bags 2
      - /cvn dur 20
      - /cvn ammo 200
      - /cvn trade 10
    expect: Chat shows the default thresholds, and the sell, repair and ammo questions close. The pet food question from check 8 may stay open, because these thresholds do not cover pet food; answer No to it. Press Pass.
    verify:
    - player
    notes: 'Player step. Cleanup: checks 1 to 8 changed these thresholds; this types the defaults back. The pet food warning has its own threshold and stays due while the new pet''s food is low. Nothing to log.'
  intro: Run these checks on a character with the default thresholds; the checks change thresholds and set them back to the defaults. Use |cff99ccff/cvn choice ask|r. Checks 6 to 8 need a Hunter; press Skip on other classes.
- id: s33
  title: Places and waypoints
  steps:
  - id: cv.s33.1
    title: Bind your hearthstone again at your current inn
    action:
      kind: manual
      text: 'Classic Era and WoW Forever. Setup: your hearthstone is already bound to an inn; stand at
        that inn''s innkeeper. Bind your hearthstone there again.'
    expect: Nothing changes on screen. The reviewer confirms this from the log. Press Pass.
    verify:
    - player
    - reviewer
    - assertions
    reviewer: 'hearth has continent, x and y; log has "hearthstone point learned: <inn>".'
    assertions:
    - kind: log
      source: debug
      contains: hearth
      diagnostic: true
    - kind: log
      source: debug
      contains: continent
      diagnostic: true
  - id: cv.s33.2
    title: Put your own waypoint on the map and run the demo
    action:
      kind: manual
      text: 'WoW Forever only (Classic Era has no game waypoint). First put your own waypoint on the map.
        Then type |cff99ccff/cvn nav native|r (needed when TomTom or WaypointUI is installed) and |cff99ccff/cvn
        demo|r, and wait about a minute for the tour to end.'
      commands:
      - /cvn nav native
      - /cvn demo
    expect: Your waypoint is on the map again, where you put it. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"demo: your game waypoint restored, not tracked".'
    notes: After the check, set the waypoint method back to your usual choice.
    clients:
    - forever-camelot
  - id: cv.s33.3
    title: 'Optional: click a profession row, then unlearn the profession'
    action:
      kind: manual
      text: 'Optional, on an alt only (unlearning loses the skill). Setup: the alt has a profession and
        the addon knows a trainer for it; the status window shows the profession row (|cff99ccff/cvn hud
        row professions always|r). Click the profession row to set a waypoint to the trainer, then unlearn
        that profession.'
      commands:
      - /cvn hud row professions always
    expect: The trainer waypoint goes away. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"trainer waypoint cleared: <profession> was unlearned".'
  intro: 'The reviewer reads |cff99ccffClosestVendorCharDB|r in |cff99ccffWTF/Account/<account>/<realm>/<character>/SavedVariables/ClosestVendor.lua|r.
    No in-game check, unit tests only: the seller list that changes before you pick, a tracked game waypoint
    after the demo, a game waypoint the game refuses, and the failed timer.'
- id: s34
  title: Patches 1.9.4 and 1.9.5
  steps:
  - id: cv.s34.1
    title: Type /cvn settings status-window
    action:
      kind: manual
      text: Type |cff99ccff/cvn settings status-window|r.
      commands:
      - /cvn settings status-window
    expect: The settings window opens on Appearance, on the Status window tab. Press Pass.
    verify:
    - player
  - id: cv.s34.2
    title: Type /cvn settings notifications
    action:
      kind: manual
      text: Type |cff99ccff/cvn settings notifications|r.
      commands:
      - /cvn settings notifications
    expect: The settings window opens on Appearance, on the Notifications tab. Press Pass.
    verify:
    - player
  - id: cv.s34.3
    title: Play for two minutes with gear that wears, then show the log
    action:
      kind: manual
      text: Play for two minutes with gear that wears (fight or wait for a durability tick), then type
        |cff99ccff/cvn log|r.
      commands:
      - /cvn log
    expect: The report is short and readable, with no line for each durability event. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"gear events: N folded into one check" lines.'
  - id: cv.s34.4
    title: After the /reload at the end
    action:
      kind: manual
      text: After the |cff99ccff/reload|r at the end.
      commands:
      - /reload
    expect: Nothing to see in game. Press Pass.
    verify:
    - player
    - reviewer
    - assertions
    reload: after_action
    reviewer: ClosestVendorDB has no hearth, lastOutside, professions or log key.
    assertions:
    - kind: log
      source: debug
      contains: ClosestVendorDB
      diagnostic: true
    - kind: log
      source: debug
      contains: hearth
      diagnostic: true
    - kind: log
      source: debug
      contains: lastOutside
      diagnostic: true
    - kind: log
      source: debug
      contains: professions
      diagnostic: true
  - id: cv.s34.5
    title: Bind your hearthstone at a new inn, then reload at once
    action:
      kind: manual
      text: 'Classic Era only. Setup: bind your hearthstone at an inn you are not bound to, then type
        |cff99ccff/reload|r at once.'
      commands:
      - /reload
    expect: Nothing changes on screen. The reviewer confirms this from the saved file. Press Pass.
    verify:
    - player
    - reviewer
    - assertions
    reload: after_action
    reviewer: ClosestVendorCharDB.hearth has x and y for that inn.
    assertions:
    - kind: log
      source: debug
      contains: ClosestVendorCharDB.hearth
      diagnostic: true
    clients:
    - classic-era
  - id: cv.s34.6
    title: Open a merchant while low durability gear wears
    action:
      kind: manual
      text: Low durability on gear that wears (or wait for a tick). Open a merchant at the same moment.
    expect: No repair question stays on screen. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"merchant window opened" comes before any "trigger" line for repair.'
  intro: 'The reviewer reads |cff99ccffClosestVendorCharDB|r and |cff99ccffClosestVendorDB|r in |cff99ccffWTF/Account/<account>/<realm>/<character>/SavedVariables/ClosestVendor.lua|r.
    No in-game check, unit tests only: the demo with an unreadable waypoint or a waypoint near a demo
    pin, the reagent names in another game language, the Unfriendly NorgannonDB trainer, the vendor and
    auctioneer tie in whole yards, the player waypoint next to the addon''s, the demo with an unreadable
    waypoint or a failed timer, and Move (Done, Cancel, lock).'
- id: s35
  title: Find supplies
  steps:
  - id: cv.s35.1
    title: Type /cvn find zzzz
    action:
      kind: manual
      text: Type |cff99ccff/cvn find zzzz|r.
      commands:
      - /cvn find zzzz
    expect: Chat says no supply item matches zzzz, and no menu opens. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"find: no item matches".'
  - id: cv.s35.2
    title: Type /cvn find with part of a drink name and pick one
    action:
      kind: manual
      text: Type |cff99ccff/cvn find|r and part of a drink's name, for example |cff99ccff/cvn find juice|r.
        If a menu of items opens, pick one drink.
      commands:
      - /cvn find
      - /cvn find juice
    expect: Chat says the sellers sell drink in general. A list opens at the mouse with the nearest seller
      marked, each with zone and distance. Your waypoint has not changed. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"find: <item> looked up as drink" and "find: seller list for <item>".'
  - id: cv.s35.3
    title: In that list, pick a seller
    action:
      kind: manual
      text: In that list, pick a seller.
    expect: A waypoint is set to that seller and chat names it. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"accepted: <seller> via <provider>".'
  - id: cv.s35.4
    title: Repeat the search, then press Escape with the list open
    action:
      kind: manual
      text: Repeat the search, then press Escape with the list open.
    expect: The list closes and the waypoint stays where it was. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: no new "accepted:" line.
  - id: cv.s35.5
    title: Mage only. Type /cvn find rune of teleportation
    action:
      kind: manual
      text: Mage only. Type |cff99ccff/cvn find rune of teleportation|r.
      commands:
      - /cvn find rune of teleportation
    expect: Chat says the sellers of that rune are listed, and a list opens with no "sell drink in general"
      note. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"find: seller list for Rune of Teleportation".'
  - id: cv.s35.6
    title: Type a drink name in Find supplies at the end of Home
    action:
      kind: manual
      text: Type |cff99ccff/cvn settings|r, type a drink name in |cffffd100Find supplies|r at the end
        of Home, press Okay.
      commands:
      - /cvn settings
    expect: The same menu opens as for the command. Closing the settings window changes no setting. Press
      Pass.
    verify:
    - player
    - reviewer
    - assertions
    reviewer: '"find:" lines as for the command; ClosestVendorCharDB has no new setting.'
    assertions:
    - kind: log
      source: debug
      contains: ClosestVendorCharDB
      diagnostic: true
  intro: 'Use a character that knows a vendor that sells drink (any class) and, for the reagent check,
    a mage. No in-game check, unit tests only: more than 8 matching items (chat asks for more of the name;
    it needs nine cached names), a seller of the wrong pet diet leaving the pet warning open, a pick ending
    a running demo, a reagent found by its game-language name, no menu control on the client (chat names
    the nearest seller), the search from the hearthstone point in an instance, an item the client has
    not named yet found by link, and the other faction''s sellers.'

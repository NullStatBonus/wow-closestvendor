    reload: after_action
    notes: Check 119 reads the learned auctioneers after the reload.
    clients:
    - forever-camelot
  - id: cv.s13.119
    title: The learned auction house survives the reload
    action:
      kind: manual
      text: WoW Forever only; press Skip otherwise. Open the auction house from check 89 again.
    expect: The addon still knows that auction house.

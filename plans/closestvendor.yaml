      - contains: 'trigger held in an instance: repair'
      - contains: 'instance: party -> none'
      - contains: trigger go repair
      - contains: 'question shown: repair, '
      scope: attempt
      label: The repair warning was held in the dungeon, went off after you left and asked
    - kind: log
      source: debug
      contains: 'question shown: repair, '
      count:
        exactly: 1
      scope: attempt
      label: The repair question showed once
      diagnostic: true
    notes: 'Check 75 sets the repair threshold back to 20. The once-only count is diagnostic: ct replay-flow

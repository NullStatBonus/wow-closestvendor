    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      pattern: 'status window: shown, rows: .*bags low'
      scope: attempt
      label: The window shows the Bag space row as low
    - kind: log
      source: debug
      contains: 'status window: FAILED'
      absent: true
      scope: attempt
      label: The window state matches the rows
    notes: The row key "bags low" in the window line means the row is low. The bag threshold stays at
      200 until check 9. A sell question opens too; leave it. The red colour is a drawing check in check
      66.

      - /cvn anchor hearth
      - /cvn ah on
      - /cvn ah off
    expect: The "Route to the auction house" checkbox is cleared after both commands. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: instanceAnchor last -> hearth'
      scope: attempt
      label: The anchor is back to hearth
      diagnostic: true
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'setting changed: ahEnabled false -> true'
      - contains: 'setting changed: ahEnabled true -> false'
      scope: attempt
      label: Routing turned on, then off
    notes: 'Player step. Drawing: the checkbox. The setting lines prove both commands. The first command
      sets the anchor back to hearth (diagnostic).'
  - id: cv.s13.86
    title: With routing on, click a tradeable row near a city auction house
    setup: A class that uses reagents, outdoors near a city auction house.
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn ah on|r) and show every reagent row (|cff99ccff/cvn hud row reagents
        always|r). Stand near a major city auction house and click a reagent row.

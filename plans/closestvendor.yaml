      contains: 'reminder: food ('
      scope: attempt
      label: The Mage test reminder was a food reminder
    notes: 'Class step: a run belongs to one character, so other classes press Skip. A Mage gets "reminder:
      food (N)" from the test. The test also plays the sound; no line proves it, so listen for it. The
      command writes "test command: remind" itself and that line is not asserted.'
  - id: cv.s14.20
    title: As a Warlock, type /cvn test remind
    action:
      kind: manual
      text: Warlock only; press Skip otherwise. Press Run (|cff99ccff/cvn test remind|r).
      commands:
      - /cvn test remind
    expect: A healthstone reminder shows for the Warlock.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'reminder: healthstone (0)'
      scope: attempt
      label: The Warlock test reminder was a healthstone reminder
    notes: 'Class step: a run belongs to one character, so other classes press Skip. A Warlock gets "reminder:
      healthstone (0)" from the test. No line proves the sound.'
  - id: cv.s14.21
    title: As a Warrior, type /cvn test remind
    action:
      kind: manual
      text: Warrior only; press Skip otherwise. Press Run (|cff99ccff/cvn test remind|r).
      commands:
      - /cvn test remind
    expect: A plain test reminder shows, because only mages and warlocks get real ones.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'reminder: test'
      scope: attempt
      label: The plain test reminder was shown
    notes: 'Class step: a run belongs to one character, so other classes press Skip. Only a class other
      than Mage and Warlock writes "reminder: test". The chat sentence and the sound are not asserted.'
  - id: cv.s14.22
    title: In combat, type /cvn test remind
    action:
      kind: manual
      text: Get into combat (attack a target). Then press Run (|cff99ccff/cvn test remind|r).
      commands:
      - /cvn test remind
    expect: The sound plays in combat. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'reminder: '
      scope: attempt
      label: A test reminder was shown in combat
    notes: 'Player step. Sound: no line proves it. The line proves the reminder ran in combat for any
      class (Mage "reminder: food", Warlock "reminder: healthstone", others "reminder: test").'
  - id: cv.s14.23
    title: Start a reminder condition in combat or in an instance
    setup: Mage or Warlock with a reminder that is due.
    action:
      kind: manual
      text: Mage or Warlock only; press Skip otherwise. Start a reminder condition in combat or in an
        instance, then end the combat or leave the instance.
    expect: The reminder waits, then shows once when the combat or instance ends.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'reminder held '
      - contains: 'reminder: '
      scope: attempt
      label: Combat or the instance held the reminder back, then it showed
    - kind: log
      source: debug
      contains: 'reminder: '
      count:
        min: 1
      scope: attempt
      label: A reminder was shown after the wait
    - kind: log
      source: debug
      contains: 'reminder: food'
      count:
        max: 1
      scope: attempt
      label: The food reminder showed at most once
    - kind: log
      source: debug
      contains: 'reminder: water'
      count:
        max: 1
      scope: attempt
      label: The water reminder showed at most once
    - kind: log
      source: debug
      contains: 'reminder: healthstone'
      count:
        max: 1
      scope: attempt
      label: The healthstone reminder showed at most once
    notes: 'Class step: a run belongs to one character, so other classes press Skip. A Mage can have food
      and water due at once, so each reminder kind is counted on its own: at most one line each proves it
      showed once and not again while the condition held. The max checks wait the full timeout. The sound
      is not asserted. "reminder held in combat: <kind>" (or "in an instance", "while dead") is written
      once when a due reminder is held back; the reminder itself comes only once the hold ends, so a
      reminder shown during combat has no reminder line after the held line and fails.'
  - id: cv.s14.24
    title: Type /cvn sound
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn sound|r).
      commands:
      - /cvn sound
    expect: Chat lists the current sound and the choices whisper, ping, invite, ready and none. Press
      Pass.
    verify:
    - player
    notes: 'Player step. Chat wording: the command lists the sound and choices in chat. It changes no
      setting and writes no log line. The report line "supplies: ..., notification sound ..." never reaches
      the debug log.'
  - id: cv.s14.25
    title: Type /cvn sound ping, invite and ready
    setup: The sound is Whisper (the default). Check 58 sets it back.
    action:
      kind: manual
      text: Press Run. It types |cff99ccff/cvn sound ping|r, |cff99ccff/cvn sound invite|r and |cff99ccff/cvn
        sound ready|r.
      commands:
      - /cvn sound ping
      - /cvn sound invite
      - /cvn sound ready
    expect: The ready sound plays last, and |cff99ccff/cvn|r shows ready as the chosen name. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - pattern: 'setting changed: remindSound %S+ %-> ping'
      - pattern: 'setting changed: remindSound %S+ %-> invite'
      - pattern: 'setting changed: remindSound %S+ %-> ready'
      scope: attempt
      label: The sound changed to ping, then invite, then ready
    notes: 'Player step. Sound: no line proves what you hear. The setting lines prove the order. The sound
      is the character''s own choice: check 58 types whisper back.'
  - id: cv.s14.26
    title: Type /cvn sound none, then /cvn test remind
    setup: The sound is Ready (check 25).
    action:
      kind: manual
      text: Press Run. It types |cff99ccff/cvn sound none|r, then |cff99ccff/cvn test remind|r.
      commands:
      - /cvn sound none
      - /cvn test remind
    expect: Nothing plays, and the reminder still shows in chat. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      pattern: 'setting changed: remindSound %S+ %-> none'
      scope: attempt
      label: The sound changed to none
    - kind: log
      source: debug
      contains: 'reminder: '
      scope: attempt
      label: The reminder was shown
    notes: 'Player step. Sound: silence is not logged. The lines prove the reminder ran with the sound
      off. Check 58 sets the sound back.'
  - id: cv.s14.27
    title: As a Warrior, let a vendor question show for food, then say Yes
    setup: Target choice asks (the default). Food is above 5.
    action:
      kind: manual
      text: Warrior only; press Skip otherwise. Let food drop to 5 or fewer. When the question shows,
        click |cffffd100Yes|r.
    expect: No notification sound plays when the question shows. The map pin makes its own sound when
      you say Yes. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question shown: supply food, '
      - contains: 'accepted: '
      scope: attempt
      label: The question was shown, then Yes pinned a vendor
    notes: 'Player step. Sound: no line proves silence. The lines prove the question and the Yes. Class
      step.'
  - id: cv.s14.28
    title: As a Warlock, open the settings page, Supplies
    action:
      kind: manual
      text: Warlock only; press Skip otherwise. Open the settings page, Supplies.
    expect: Supplies sits after Reagents. It shows |cffffd100Healthstone reminder|r and the rows your
      class can use. It has no sound control. Press Pass.
    verify:
    - player
    notes: 'Player step. Settings page look: no line proves it. Class step.'
  - id: cv.s14.29
    title: As a Warrior, open the settings page, Supplies
    action:
      kind: manual
      text: Warrior only; press Skip otherwise. Open the settings page, Supplies.
    expect: It shows only rows a Warrior can use, and no |cffffd100Healthstone reminder|r. Press Pass.
    verify:
    - player
    notes: 'Player step. Settings page look: no line proves it. Class step.'
  - id: cv.s14.30
    title: Pick each choice in the Notification sound dropdown
    action:
      kind: manual
      text: Open Appearance, Sound tab, and pick each choice in the |cffffd100Notification sound|r dropdown.
        Pick |cffffd100Group invite|r last.
    expect: The dropdown offers Whisper ping, Minimap ping, Group invite, Ready check and None. Each choice
      plays at once. Press Pass.
    verify:
    - player
    notes: 'Player step. Menu and sound: no line proves them. The last pick leaves Group invite saved;
      check 58 types Whisper ping, the default, back.'
  - id: cv.s14.31
    title: Type /cvn ammo off, then lower food
    setup: Not for a Mage who knows Conjure Food (press Skip). Food is above 5.
    action:
      kind: manual
      text: Press Run. It types |cff99ccff/cvn choice ask|r (back from check 6) and |cff99ccff/cvn ammo
        off|r. Then lower food to 5 or fewer.
      commands:
      - /cvn choice ask
      - /cvn ammo off
    expect: The food question still shows with the ammo warning off.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: ammoEnabled true -> false'
      scope: attempt
      label: The ammo warning went off
    - kind: log
      source: debug
      contains: 'question shown: supply food, '
      scope: attempt
      label: The food question was asked
    notes: The Supplies controls staying enabled is settings page look and is not asserted. Check 56 turns
      the ammo warning on again. A Mage with the spell gets a reminder instead of a question.
  - id: cv.s14.32
    title: Clear the Supplies checkbox in Warnings
    action:
      kind: manual
      text: Clear the |cffffd100Supplies|r checkbox in Warnings, or press Run (|cff99ccff/cvn supplies
        off|r).
      commands:
      - /cvn supplies off
    expect: The addon turns all supply warnings off.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: suppliesEnabled true -> false'
      scope: attempt
      label: The supply warnings went off
    notes: 'The checkbox look and the chat line "Supply warnings: off" are not asserted. The settings
      page writes the same line about a second after the change. The report header line "supplies: ..."
      never reaches the debug log.'
  - id: cv.s14.33
    title: Type /cvn supplies on
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn supplies on|r).
      commands:
      - /cvn supplies on
    expect: The addon turns all supply warnings on again, with the thresholds you had.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: suppliesEnabled false -> true'
      scope: attempt
      label: The supply warnings went on
    notes: The thresholds are not asserted here; checks 34 to 37 use them.
  - id: cv.s14.34
    title: Type /cvn food off, then lower food and water
    setup: A class that uses water and has no conjure spell. Food and drinks are above 5.
    action:
      kind: manual
      text: Not for Warrior, Rogue or Mage; press Skip. Press Run (|cff99ccff/cvn food off|r). Then lower
        food and drinks to 5 or fewer.
      commands:
      - /cvn food off
    expect: No food question shows. The water question still shows.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: foodEnabled true -> false'
      scope: attempt
      label: The food warning went off
    - kind: log
      source: debug
      contains: 'question shown: supply water, '
      scope: attempt
      label: The water question was asked
    - kind: log
      source: debug
      contains: 'question shown: supply food, '
      absent: true
      scope: attempt
      label: No food question was asked
    notes: The step waits its whole timeout for the absent check. Check 56 turns the food warning on again.
  - id: cv.s14.35
    title: Type /cvn water off, then lower food and water
    setup: Same character as check 34. Food and drinks are above 5.
    action:
      kind: manual
      text: Not for Warrior, Rogue or Mage; press Skip. Press Run. It types |cff99ccff/cvn food on|r (back
        from check 34) and |cff99ccff/cvn water off|r. Then lower food and drinks to 5 or fewer.
      commands:
      - /cvn food on
      - /cvn water off
    expect: No water question shows. The food question still shows.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: waterEnabled true -> false'
      scope: attempt
      label: The water warning went off
    - kind: log
      source: debug
      contains: 'question shown: supply food, '
      scope: attempt
      label: The food question was asked
    - kind: log
      source: debug
      contains: 'question shown: supply water, '
      absent: true
      scope: attempt
      label: No water question was asked
    notes: The step waits its whole timeout for the absent check. Check 56 turns the water warning on
      again.
  - id: cv.s14.36
    title: As a Hunter, type /cvn petfood off, then lower pet food and food
    setup: A pet is out. Pet food and food are above 5.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Press Run (|cff99ccff/cvn petfood off|r). Then lower pet
        food and food to 5 or fewer.
      commands:
      - /cvn petfood off
    expect: No pet food question shows. The food question still shows.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: petFoodEnabled true -> false'
      scope: attempt
      label: The pet food warning went off
    - kind: log
      source: debug
      contains: 'question shown: supply food, '
      scope: attempt
      label: The food question was asked
    - kind: log
      source: debug
      contains: 'question shown: supply pet'
      absent: true
      scope: attempt
      label: No pet food question was asked
    notes: 'Class step: a run belongs to one character, so other classes press Skip. The step waits its
      whole timeout for the absent check. Check 56 turns the pet food warning on again.'
  - id: cv.s14.37
    title: Type /cvn food 10 and carry 10 food items, then 11
    setup: Food is above 10. Check 57 types the default threshold back.
    action:
      kind: manual
      text: A Mage who knows Conjure Food gets a reminder instead; press Skip. Press Run (|cff99ccff/cvn
        food 10|r). Carry 10 food items, then 11.
      commands:
      - /cvn food 10
    expect: The addon asks at 10 and clears at 11.
    verify:
    - assertions
    auto: true
    timeout: 240
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: foodThreshold 5 -> 10'
      scope: attempt
      label: The food threshold became 10
    - kind: log-sequence
      source: debug
      sequence:
      - contains: trigger go food
      - contains: 'question shown: supply food, '
      - contains: trigger clear food
      scope: attempt
      label: The question came at 10 and the request cleared at 11
    notes: 'Not for a Mage who knows Conjure Food (press Skip): the Mage gets a reminder, not a question.'
  - id: cv.s14.38
    title: Move a slider on the Supplies page
    action:
      kind: manual
      text: Move a slider on the Supplies page. Check 57 sets the thresholds back.
    expect: The setting changes to the new value.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log
      source: debug
      pattern: 'setting changed: %a+Threshold '
      scope: attempt
      label: A threshold changed
    notes: Check 48 types the food threshold 10 again, so any slider may move. The settings page writes the line about a second after the last change. The slider look and
      the chat value are not asserted.
  - id: cv.s14.39
    title: Carry plenty of food, then type /cvn test food
    setup: Target choice asks (the default). Food is above 5.
    action:
      kind: manual
      text: Carry plenty of food, then press Run (|cff99ccff/cvn test food|r).
      commands:
      - /cvn test food
    expect: The food question shows now, whatever the count.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log
      source: debug
      contains: 'question shown: supply '
      scope: attempt
      label: The food question was asked
    notes: 'The command writes "test command: food" itself, so only the question line is required.'
  - id: cv.s14.40
    title: Open a baker or a water vendor that the addon does not ship
    action:
      kind: manual
      text: Open a baker or a water vendor that the addon does not ship.
    expect: The addon learns the new vendor.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log
      source: debug
      pattern: 'vendor learned: .*, new'
      scope: attempt
      label: A new vendor was learned
    notes: The line names the vendor and says new. That the vendor is now a target for food or water has
      no line; the learned vendor is saved in ClosestVendorDB.
  - id: cv.s14.41
    title: With reagents and food both low, answer the questions
    setup: Target choice asks (the default). A class with a reagent. Reagents and food are both at or
      below their thresholds.
    action:
      kind: manual
      text: Classes without class reagents press Skip. A Mage who knows Conjure Food presses Skip too. Answer the questions one by one.
    expect: The reagent question comes before the food question.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question shown: reagent '
      - contains: 'question shown: supply food, '
      scope: attempt
      label: The reagent question came before the food question
    notes: The full order is repair, ammo, reagent, food, water, pet food, sell, trainer; this step checks
      reagent before food, the pair a player can set up most easily. A Mage who knows Conjure Food gets a food reminder, not
      a food question, so that Mage cannot show the order.
  - id: cv.s14.42
    title: Open a merchant while food is low
    setup: Food is 5 or fewer. Reagent buying is off (the default). Ammo buying is on by default, so a
      Hunter uses a merchant that sells no ammo.
    action:
      kind: manual
      text: Open a merchant that is not an ammo vendor.
    expect: The addon buys nothing. It does not buy food, water or pet food in this version.
    verify:
    - assertions
    auto: true
    timeout: 90
    assertions:
    - kind: log
      source: debug
      contains: merchant window opened
      scope: attempt
      label: The merchant window opened
    - kind: log
      source: debug
      contains: 'buy: bought'
      absent: true
      scope: attempt
      label: Nothing was bought
    notes: No purchase line exists for food, water or pet food. The step waits its whole timeout for the
      absent check.
  - id: cv.s14.43
    title: Open the status window settings and set supplies to always
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn hud row supplies always|r). Open the status window settings.
      commands:
      - /cvn hud row supplies always
    expect: 'A |cffffd100Show: Supplies|r dropdown sits between Reagents and Bag space and shows Always.
      Press Pass.'
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: hudRow.supplies low -> always'
      scope: attempt
      label: The Supplies rows are set to Always
    notes: 'Player step. Settings page look: no line proves the dropdown. Check 58 sets the rows back
      to Only when low.'
  - id: cv.s14.44
    title: As a Warrior, look at the status window with Supplies set to Always
    setup: Supplies rows are set to Always (check 43).
    action:
      kind: manual
      text: Warrior only; press Skip otherwise. Look at the status window.
    expect: A Food row shows. A Warrior has no Water row.
    verify:
    - assertions
    auto: true
    timeout: 60
    call:
      addon: ClosestVendor
      entry: window
      args:
      - supplies
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.window
      op: in
      value:
      - supply:food
      - supply:food low
      label: The Supplies rows are only the Food row, with no Water row
    notes: 'Class step: a run belongs to one character, so other classes press Skip. The window entry
      with the group supplies reads the row keys of that group when the step opens: only supply:food (low
      or not) passes, so a Water or pet food row fails.'
  - id: cv.s14.45
    title: As a Priest, look at the status window with Supplies set to Always
    setup: Supplies rows are set to Always (check 43).
    action:
      kind: manual
      text: Priest only; press Skip otherwise. Look at the status window.
    expect: A Food row and a Water row show.
    verify:
    - assertions
    auto: true
    timeout: 60
    call:
      addon: ClosestVendor
      entry: window
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.window
      op: matches
      value: supply:food.*supply:water
      label: The window has a Food row and a Water row
    notes: 'Class step: a run belongs to one character, so other classes press Skip. The window entry
      reads the row keys when the step opens.'
  - id: cv.s14.46
    title: As a Hunter with a pet out, show Supplies set to Always
    setup: Supplies rows are set to Always (check 43). A pet is out.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Look at the status window.
    expect: A Pet food row shows.
    verify:
    - assertions
    auto: true
    timeout: 60
    call:
      addon: ClosestVendor
      entry: window
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.window
      op: contains
      value: supply:pet
      label: The window has a Pet food row
    notes: 'Class step: a run belongs to one character, so other classes press Skip. The window entry
      reads the row keys when the step opens.'
  - id: cv.s14.47
    title: Set Supplies to Only when low and carry plenty of food
    setup: Food and drinks are above their thresholds.
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn hud row supplies low|r). Carry plenty of food and drinks.
      commands:
      - /cvn hud row supplies low
    expect: No supply row shows.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: hudRow.supplies always -> low'
      scope: attempt
      label: The Supplies rows are set to Only when low
    - kind: log
      source: debug
      contains: 'status window: '
      scope: attempt
      label: The window was drawn again
    - kind: log
      source: debug
      pattern: 'status window: shown, rows: .*supply:'
      absent: true
      scope: attempt
      label: No supply row shows
    notes: 'The window line is written when the row set changes: the supply rows go away. The step waits
      its whole timeout for the absent check.'
  - id: cv.s14.48
    title: Drop food to 10 or fewer
    setup: Supplies rows are Only when low (check 47). Food is above 10. No question is open.
    action:
      kind: manual
      text: A Mage who knows Conjure Food gets a reminder instead; press Skip. Press Run. It types |cff99ccff/cvn
        food 10|r, the threshold from check 37. Then drop food to 10 or fewer.
      commands:
      - /cvn food 10
    expect: The Food row shows in red at the same time as the warning. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: trigger go food
      scope: attempt
      label: The low food started a request
    - kind: log
      source: debug
      pattern: 'status window: shown, rows: .*supply:food low'
      scope: attempt
      label: The Food row is low
    notes: 'Player step. Colour: no line proves red. The row line ends the key with " low" when the row
      is low, and the request line shows the warning. Run sets the food threshold to 10 again, so a slider
      moved in check 38 does not matter; it may change nothing, so no setting line is asserted.'
  - id: cv.s14.49
    title: Type /cvn food off, then keep food at 5 or fewer
    setup: Food is still 10 or fewer (check 48).
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn food off|r). Keep food at 10 or fewer.
      commands:
      - /cvn food off
    expect: The Food row is no longer low.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: foodEnabled true -> false'
      scope: attempt
      label: The food warning went off
    - kind: log
      source: debug
      contains: 'status window: '
      scope: attempt
      label: The window was drawn again
    - kind: log
      source: debug
      pattern: supply:food low
      absent: true
      scope: attempt
      label: The Food row is not low
    notes: The row line has no " low" after the key. Colour is not asserted. The step waits its whole
      timeout for the absent check. Check 50 turns the food warning on again.
  - id: cv.s14.50
    title: Type /cvn ammo off instead, then keep food at 10 or fewer
    setup: Food is still 10 or fewer, and the food warning is off (check 49).
    action:
      kind: manual
      text: Press Run. It types |cff99ccff/cvn food on|r (back from check 49) and |cff99ccff/cvn ammo
        off|r. Keep food at 10 or fewer.
      commands:
      - /cvn food on
      - /cvn ammo off
    expect: The Food row is low again with the ammo warning off.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: ammoEnabled true -> false'
      diagnostic: true
      scope: attempt
      label: The ammo warning went off
    - kind: log
      source: debug
      pattern: 'status window: shown, rows: .*supply:food low'
      scope: attempt
      label: The Food row is low
    notes: The ammo switch does not affect the supply rows. Check 56 turns the ammo warning on again. The
      ammo warning is already off since check 31, so its setting line shows only for a player who skipped
      check 31; it is diagnostic.
  - id: cv.s14.51
    title: As a Hunter, call a pet, then dismiss it, then call a different pet
    setup: A pet is out.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Press Run (|cff99ccff/cvn hud row supplies always|r). Dismiss
        the pet, then call a different pet.
      commands:
      - /cvn hud row supplies always
    expect: The Pet food row appears, goes away, and appears again.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - pattern: 'status window: shown, rows: .*supply:pet'
      - contains: 'status window: '
      - pattern: 'status window: shown, rows: .*supply:pet'
      scope: attempt
      label: The Pet food row appeared, went away and came back
    notes: 'Class step: a run belongs to one character, so other classes press Skip. The count change
      to the new pet''s food is not logged. Check 58 sets the rows back to Only when low.'
  - id: cv.s14.52
    title: Click the Food row
    setup: The Food row shows (food is 5 or fewer). No question is open. A waypoint method is in use (TomTom, WaypointUI or the game waypoint).
    action:
      kind: manual
      text: Click the Food row.
    expect: The closest food seller is pinned at once with no question.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'direct pin: supply food'
      - pattern: 'accepted: .+ via '
      scope: attempt
      label: The row click pinned a seller
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the pin
    - kind: log
      source: debug
      contains: via chat
      absent: true
      scope: attempt
      label: The waypoint is on the map, not only a chat line
    - kind: log
      source: debug
      contains: 'question shown: supply'
      absent: true
      scope: attempt
      label: No question was shown
    notes: 'The click writes "row click: supply:food (...)" and then "direct pin: supply food"; the direct
      pin line names what was routed. The step waits its whole timeout for the absent checks.'
  - id: cv.s14.53
    title: Click the Food row in combat
    setup: The Food row shows (food is 5 or fewer). No question is open. A waypoint method is in use (TomTom, WaypointUI or the game waypoint).
    action:
      kind: manual
      text: Get into combat, then click the Food row.
    expect: The closest food seller is pinned at once with no question.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'direct pin: supply food'
      - pattern: 'accepted: .+ via '
      scope: attempt
      label: The row click pinned a seller in combat
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the pin
    - kind: log
      source: debug
      contains: via chat
      absent: true
      scope: attempt
      label: The waypoint is on the map, not only a chat line
    - kind: log
      source: debug
      contains: 'question shown: supply'
      absent: true
      scope: attempt
      label: No question was shown
    notes: Combat does not hold a row click back. The step waits its whole timeout for the absent checks.
  - id: cv.s14.54
    title: As a Mage, set Reagents to Always and look at the window
    setup: Food and drinks are known to the bags.
    action:
      kind: manual
      text: Mage only; press Skip otherwise. Press Run. It sets Reagents and Supplies to Always. Look
        at the status window.
      commands:
      - /cvn hud row reagents always
      - /cvn hud row supplies always
    expect: The Conjured Food and Conjured Water rows and the Food and Water rows are separate and do
      not conflict. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      pattern: 'status window: shown, rows: .*reagent:5349'
      scope: attempt
      label: The window has a Conjured Food row
    - kind: log
      source: debug
      pattern: 'status window: shown, rows: .*reagent:5350'
      scope: attempt
      label: The window has a Conjured Water row
    - kind: log
      source: debug
      pattern: 'status window: shown, rows: .*supply:food'
      scope: attempt
      label: The window has a Food row
    - kind: log
      source: debug
      pattern: 'status window: shown, rows: .*supply:water'
      scope: attempt
      label: The window has a Water row
    notes: 'Player step. Layout: whether the four rows look separate is for the player. The lines prove
      all four rows are present. Check 55 sets Reagents back to Only when low.'
  - id: cv.s14.55
    title: Set Supplies to Never
    setup: Food is still 5 or fewer.
    action:
      kind: manual
      text: Press Run. It types |cff99ccff/cvn hud row supplies never|r and |cff99ccff/cvn hud row reagents
        low|r (back from check 54).
      commands:
      - /cvn hud row supplies never
      - /cvn hud row reagents low
    expect: No supply row shows.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      pattern: 'setting changed: hudRow.supplies %S+ %-> never'
      scope: attempt
      label: The Supplies rows are set to Never
    - kind: log
      source: debug
      contains: 'status window: '
      scope: attempt
      label: The window redrew with a new row set
    - kind: log
      source: debug
      contains: 'status window: FAILED'
      absent: true
      scope: attempt
      label: The window matched its rows
    - kind: log
      source: debug
      contains: 'status window: visibility unknown'
      absent: true
      scope: attempt
      label: The window state was known
    - kind: log
      source: debug
      pattern: 'status window: shown, rows: .*supply:'
      absent: true
      scope: attempt
      label: No supply row shows
    notes: 'Reagents low is a restore that only a Mage changed: it writes no line for other classes, so
      it is not asserted. The step waits its whole timeout for the absent check. Check 58 sets the Supplies
      rows back. The window writes a line only when its rows change, so a line in this step proves a
      redraw with a new row set; a stuck supply row writes none, or a line that names it.'
  - id: cv.s14.56
    title: Turn the ammo and supply warnings back on
    action:
      kind: manual
      text: Press Run. It types |cff99ccff/cvn ammo on|r, |cff99ccff/cvn food on|r, |cff99ccff/cvn water
        on|r and |cff99ccff/cvn petfood on|r.
      commands:
      - /cvn ammo on
      - /cvn food on
      - /cvn water on
      - /cvn petfood on
    expect: The ammo warning and the supply warnings are on again.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: ammoEnabled false -> true'
      scope: attempt
      label: The ammo warning went on
    notes: 'Cleanup: checks 31 and 50 turned the ammo warning off. The ammo line is the only one every
      class writes; the food, water and pet food lines appear only for a switch that was off.'
  - id: cv.s14.57
    title: Type the default food threshold back
    action:
      kind: manual
      text: Press Run. It types the default thresholds |cff99ccff/cvn food 5|r, |cff99ccff/cvn water 5|r
        and |cff99ccff/cvn petfood 5|r. This also undoes the slider you moved in check 38.
      commands:
      - /cvn food 5
      - /cvn water 5
      - /cvn petfood 5
    expect: The supply thresholds are 5 again.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      pattern: 'setting changed: %a+Threshold %S+ %-> 5'
      scope: attempt
      label: A supply threshold is back to 5
    notes: 'Cleanup: checks 37 and 48 set the food threshold to 10. The water and pet food thresholds
      change only if the slider moved them. A Mage who knows Conjure Food skips 37 and 48, so the line
      may name any supply threshold the slider in check 38 moved.'
  - id: cv.s14.58
    title: Set the sound, rows and choice back
    action:
      kind: manual
      text: Press Run. It types |cff99ccff/cvn choice ask|r, |cff99ccff/cvn sound whisper|r and |cff99ccff/cvn
        hud row supplies low|r.
      commands:
      - /cvn choice ask
      - /cvn sound whisper
      - /cvn hud row supplies low
    expect: The target choice asks, the sound is Whisper and the supply rows show only when low.
    verify:
    - assertions
    auto: true
    timeout: 60
    call:
      addon: ClosestVendor
      entry: config
      args:
      - vendorMode
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.config
      op: eq
      value: ask
      label: The target choice was ask when the step opened
    - kind: log
      source: debug
      pattern: 'setting changed: remindSound .+ %-> whisper'
      scope: attempt
      label: The sound is Whisper again
    - kind: log
      source: debug
      pattern: 'setting changed: hudRow.supplies %S+ %-> low'
      scope: attempt
      label: The Supplies rows are Only when low again
    notes: 'Cleanup: checks 6, 25, 26, 30, 43, 51, 54 and 55 changed these; check 30 leaves Group invite,
      so the sound line is always written. The entry reads the target choice
      when the step opens; check 31 set it back to ask, so the guard proves that.'
  intro: 'Use a character with the default settings: Supplies on, thresholds 5, sound Whisper, choice
    ask. Class steps name the class; press Skip on other classes. The last checks set everything back.'
- id: s15
  title: Settings per character
  steps:
  - id: cv.s15.1
    title: On character A, change bags and sound, then log in character B
    setup: On character A, enter |cff99ccff/cvn sound|r first and note the sound it shows; check 4 types
      it back.
    action:
      kind: manual
      text: On character A, press Run (|cff99ccff/cvn bags 30|r and |cff99ccff/cvn sound ping|r), then
        move the status window. Log in character B on the same account, look, then log back in on A.
      commands:
      - /cvn bags 30
      - /cvn sound ping
    expect: B showed its own values and window position, not 30, ping or the position of A. Back on A,
      press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: bagThreshold 2 -> 30'
      scope: attempt
      label: The bag threshold on A became 30
    notes: 'Player step. Two characters: the debug log belongs to each character, so only A''s log is
      read. What B shows is for the player. The sound line is not asserted because it does not appear
      when A already used ping.'
  - id: cv.s15.2
    title: On A, open a merchant the addon does not know
    action:
      kind: manual
      text: On A, open a merchant the addon does not know. Log in B, trigger a sell warning near it, then
        log back in on A.
    expect: B was directed to that merchant. Back on A, press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'vendor learned: '
      scope: attempt
      label: A learned the merchant
    notes: 'Player step. Two characters: the learned vendors are shared by the account, but B''s own log
      is not read. The line proves A learned the merchant; the player checks that B is directed to it.'
  - id: cv.s15.3
    title: Log in a character that never used the addon, with earlier settings
    action:
      kind: manual
      text: Log in a character that never used the addon, on an account with earlier settings. Then log
        back in on A.
    expect: It starts with those earlier settings. Back on A, press Pass.
    verify:
    - player
    notes: 'Player step. Two characters: the new character writes its own log, which this run does not
      read, and its start values are for the player to judge.'
  - id: cv.s15.4
    title: On character A, type the default bag threshold and your sound back
    action:
      kind: manual
      text: On character A, press Run. It types the default |cff99ccff/cvn bags 2|r and |cff99ccff/cvn hud
        reset|r (check 1 moved the window). Then set the sound you noted before check 1 back, typed the way
        check 1 typed ping.
      commands:
      - /cvn bags 2
      - /cvn hud reset
    expect: Chat shows the bag threshold 2 and the sound you noted. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: bagThreshold 30 -> 2'
      scope: attempt
      label: The bag threshold on A is 2 again
    - kind: log
      source: debug
      contains: status window position reset
      scope: attempt
      label: The window on A is back at its default position
    notes: 'Player step. Cleanup: check 1 set the bag threshold to 30, the sound to ping and moved the window on A. The
      sound is the character''s own choice, not a default, so the tester notes it first and types it back;
      its line is not asserted.'
  intro: Use two characters on one account, A and B, with the default settings on A. Always return to
    A, the character of this run, before you press Pass. The last check sets A back.
- id: s16
  title: Profession level gate
  intro: Use a character below level 20 with a profession at 140 to 150 of 150 whose crafting window it
    opened. Use the question mode Ask with no question open and no warning due.
  steps:
  - id: cv.s16.1
    title: Below level 20 with a profession at 150/150, change a skill or craft
    action:
      kind: manual
      text: Only below level 20 with a profession at 140 to 150 of 150 whose crafting window you opened;
        press Skip otherwise. Craft one item with that profession, or gain a point in it.
    expect: No trainer question shows.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log
      source: debug
      contains: level 20 needed
      scope: attempt
      label: The profession was left out until level 20
    - kind: log
      source: debug
      contains: 'question shown: trainer for '
      absent: true
      scope: attempt
      label: No trainer question
    setup: No other known profession is 10 points or fewer from its limit.
  - id: cv.s16.2
    title: Below level 20, set Professions to Always in the status window
    action:
      kind: manual
      text: Only below level 20 with a profession at 140 to 150 of 150; press Skip otherwise. Press Run
        (|cff99ccff/cvn hud row professions always|r) and look at the profession row.
      commands:
      - /cvn hud row professions always
    expect: The profession row shows but is not red. Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: the row colour. Check 4 sets the row back.'
  - id: cv.s16.3
    title: Reach level 20 and change a skill or craft
    action:
      kind: manual
      text: Optional, and only with that profession still at 140 to 150 of 150; press Skip otherwise. Reach
        level 20, then craft one item with that profession or gain a point in it.
    expect: The trainer question appears. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'question shown: trainer for '
      scope: attempt
      label: The trainer question was asked
    notes: Player step. Reaching a level takes longer than an automatic check waits.
  - id: cv.s16.4
    title: Set the profession row back to its default
    action:
      kind: manual
      text: 'Only if check 2 ran; press Skip otherwise. Press Run to type the default back: |cff99ccff/cvn
        hud row professions low|r.'
      commands:
      - /cvn hud row professions low
    expect: The profession row shows only when a profession is near its limit. Press Pass.
    verify:
    - player
    notes: 'Player step. Cleanup: check 2 set the row to always. Nothing to log.'
- id: s17
  title: Waypoint choice
  intro: Start with the default waypoint choice, Automatic. Check 6 sets it back.
  steps:
  - id: cv.s17.1
    title: Type /cvn nav
    action:
      kind: manual
      text: Type |cff99ccff/cvn nav|r.
      commands:
      - /cvn nav
    expect: 'Chat shows Waypoint: Automatic and the choices. Press Pass.'
    verify:
    - player
    notes: 'Player step. Drawing: the chat text.'
  - id: cv.s17.2
    title: With TomTom, type /cvn nav native, then test sell, answer Yes
    action:
      kind: manual
      text: TomTom only; press Skip otherwise. Press Run (|cff99ccff/cvn nav native|r, then |cff99ccff/cvn
        test sell|r) and click |cffffd100Yes|r (|cffffd100This map|r or |cffffd100Closest|r when it names
        two vendors).
      commands:
      - /cvn nav native
      - /cvn test sell
    expect: The game's own waypoint shows, with no TomTom arrow. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      pattern: 'accepted: .+ via native'
      scope: attempt
      label: The game waypoint took it
    notes: 'Player step. Drawing: the game waypoint and no arrow. Classic Era has no game waypoint.'
    clients:
    - forever-camelot
  - id: cv.s17.3
    title: With TomTom, type /cvn nav tomtom, then test sell, answer Yes
    action:
      kind: manual
      text: TomTom only; press Skip otherwise. Press Run (|cff99ccff/cvn nav tomtom|r, then |cff99ccff/cvn
        test sell|r) and click |cffffd100Yes|r (|cffffd100This map|r or |cffffd100Closest|r when it names
        two vendors).
      commands:
      - /cvn nav tomtom
      - /cvn test sell
    expect: A TomTom arrow shows. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      pattern: 'accepted: .+ via tomtom'
      scope: attempt
      label: TomTom took the waypoint
    notes: 'Player step. Drawing: the TomTom arrow.'
  - id: cv.s17.4
    title: Without WaypointUI, type /cvn nav waypointui, then test sell
    action:
      kind: manual
      text: Without WaypointUI only; press Skip otherwise. Press Run (|cff99ccff/cvn nav waypointui|r,
        then |cff99ccff/cvn test sell|r) and click |cffffd100Yes|r (|cffffd100This map|r or |cffffd100Closest|r
        when it names two vendors).
      commands:
      - /cvn nav waypointui
      - /cvn test sell
    expect: A waypoint still appears, using the usual order. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'accepted: '
      scope: attempt
      label: Yes set a waypoint
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the waypoint
    - kind: log
      source: debug
      contains: via waypointui
      absent: true
      scope: attempt
      label: WaypointUI was not used
    notes: 'Player step. Drawing: the waypoint of the next method in the usual order.'
  - id: cv.s17.5
    title: Open the settings page
    action:
      kind: manual
      text: Open the settings page.
    expect: A Waypoint dropdown under Navigation has the same four choices. Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: the settings page.'
  - id: cv.s17.6
    title: Set the waypoint choice back to Automatic
    action:
      kind: manual
      text: 'Press Run to type the default back: |cff99ccff/cvn nav auto|r.'
      commands:
      - /cvn nav auto
    expect: 'Chat shows Waypoint: Automatic. Press Pass.'
    verify:
    - player
    notes: 'Player step. Cleanup: checks 2 to 4 changed the waypoint choice. Nothing to log.'
- id: s18
  title: Fewer reads and late item data
  intro: Class and group checks; press Skip when yours does not apply. Check 4 sets the supply reminders
    back and check 5 sets reagent buying back.
  steps:
  - id: cv.s18.1
    title: In a group, dismiss and summon pets with another hunter or warlock
    setup: A group with another Hunter or Warlock, and you have a pet too.
    action:
      kind: manual
      text: In a group with another hunter or warlock, have them dismiss and summon their pet several
        times. Then dismiss and summon your own pet twice. Press Skip if you are not in a group.
    expect: The log has no lines for their pet and lines for your own pet.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log
      source: debug
      contains: event UNIT_PET party
      absent: true
      scope: attempt
      label: No line for a party pet
    - kind: log
      source: debug
      contains: event UNIT_PET raid
      absent: true
      scope: attempt
      label: No line for a raid pet
    - kind: log
      source: debug
      contains: event UNIT_PET player
      count:
        min: 2
      scope: attempt
      label: Your own pet changes were seen
    notes: 'The addon drops pet events of other units before it logs. The absent checks wait the full
      timeout. Class step: a hunter or warlock with a pet.'
  - id: cv.s18.2
    title: Turn off four supply reminders, then change your bags
    setup: A Mage or Warlock. Supplies on. Food, water and pet food on.
    action:
      kind: manual
      text: 'Mage or Warlock only; press Skip otherwise. Press Run. It types |cff99ccff/cvn food off|r,
        |cff99ccff/cvn water off|r and |cff99ccff/cvn petfood off|r. Warlock: also clear the Healthstone
        reminder box on the Supplies page. Then move an item to another bag slot. Check 4 turns them back
        on.'
      commands:
      - /cvn food off
      - /cvn water off
      - /cvn petfood off
    expect: No supply reminder is asked or shown.
    verify:
    - assertions
    auto: true
    timeout: 90
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: foodEnabled true -> false'
      scope: attempt
      label: Food was switched off
    - kind: log
      source: debug
      contains: event BAG_UPDATE_DELAYED
      scope: attempt
      label: Your bags changed
    - kind: log
      source: debug
      contains: 'reminder: '
      absent: true
      scope: attempt
      label: No reminder line
    - kind: log
      source: debug
      contains: 'setting changed: healthstoneRemind true -> false'
      diagnostic: true
      scope: attempt
      label: The healthstone reminder was switched off
    notes: 'The reminder lines are the Mage and Warlock reminders, "reminder: food (N)" and "reminder:
      healthstone (0)". The absent check waits the full timeout. The Healthstone box exists only for a
      Warlock, so that line is diagnostic. Other warnings are not checked here. Class step.'
  - id: cv.s18.3
    title: Open a reagent merchant right after a fresh login
    setup: Reagent class with a merchant that sells your reagent close by. Carry fewer than 20 (the target)
      of a watched reagent, so there is something to buy.
    action:
      kind: manual
      text: Optional (hard to cause). A class with reagents only (Mage, Rogue, Priest, Paladin, Shaman
        or Druid); press Skip otherwise. Press Run. It turns reagent buying on and asking on (|cff99ccff/cvn
        reagentbuy on|r, |cff99ccff/cvn reagentbuy ask|r). Log out and in again, then open a merchant
        that sells your reagent. Check 5 turns reagent buying off.
      commands:
      - /cvn reagentbuy on
      - /cvn reagentbuy ask
    expect: The purchase question appears once, possibly a moment after the window opens.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log
      source: debug
      contains: merchant window opened
      scope: attempt
      label: The merchant window opened
    - kind: log
      source: debug
      contains: 'reagent buy: asked'
      count:
        exactly: 1
      scope: attempt
      label: The purchase question appeared once
    - kind: log
      source: debug
      contains: 'reagent buy: FAILED'
      absent: true
      scope: attempt
      label: The purchase question showed
    notes: 'The purchase dialog writes "reagent buy: asked", not "question shown". The exactly check waits
      the full timeout. Needs something to buy: fewer reagents than the target of 20. Class step.'
  - id: cv.s18.4
    title: Turn the supply reminders back on
    setup: Press Skip if you skipped check 2.
    action:
      kind: manual
      text: 'Press Run to type |cff99ccff/cvn food on|r, |cff99ccff/cvn water on|r and |cff99ccff/cvn
        petfood on|r. Warlock: also set the Healthstone reminder box on the Supplies page.'
      commands:
      - /cvn food on
      - /cvn water on
      - /cvn petfood on
    expect: Food, water and pet food are on again.
    verify:
    - assertions
    auto: true
    timeout: 30
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: foodEnabled false -> true'
      scope: attempt
      label: Food was switched on
    - kind: log
      source: debug
      contains: 'setting changed: waterEnabled false -> true'
      scope: attempt
      label: Water was switched on
    - kind: log
      source: debug
      contains: 'setting changed: petFoodEnabled false -> true'
      scope: attempt
      label: Pet food was switched on
    notes: Cleanup for check 2. The setting lines come from the commands themselves, which are the action

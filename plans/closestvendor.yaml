      contains: 'setting changed: hudRow.durability always -> low'
      scope: attempt
      label: Durability is back to Only when low
      diagnostic: true
    - kind: log
      source: debug
      contains: 'setting changed: ahEnabled true -> false'
      scope: attempt
      label: Routing is off again
      diagnostic: true
    notes: Restores the defaults changed in checks 75 to 91. Setting lines appear only for values that
      changed, so they are diagnostic.
  - id: cv.s13.117
    title: Put the status window look back to its default
    action:
      kind: manual
      text: Press Run. It sets opacity 80, text opacity 100 and the color to black (|cff99ccff/cvn hud
        opacity 80|r, |cff99ccff/cvn hud textopacity 100|r, |cff99ccff/cvn hud color black|r).

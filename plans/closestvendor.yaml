      source: facts
      addon: ClosestVendor
      key: entry.learned
      op: ge
      value: 1
      label: The auctioneer survived the reload
    - kind: log
      source: debug
      pattern: 'auctioneer learned: .+ %(npc %d+%), u'
      scope: attempt
      label: The auction house was already known (unchanged or updated, not new)
    notes: The entry runs when the step opens, after the reload in check 118. The learned line ends in
      unchanged, or updated when you stand somewhere else; both start with u, and new does not.
    clients:
    - forever-camelot
  intro: Debug logging is on and every setting is at its default. Use a Mage who knows Teleport and Arcane
    Brilliance, near a reagent vendor. Class steps say so; press Skip otherwise.

ct: 1
kind: plan
addon: ClosestVendor
title: 'ClosestVendor in-game test plan: core'
preamble: |-
  These checks cover what the automated tests cannot: the real game. ClosestVendor has three plans, and all three run before each release, on WoW Forever and on Classic Era:
  |cff99ccffplans/closestvendor.yaml|r (this one: warnings, routes, holds, learning, buying, the report and find), |cff99ccffplans/closestvendor.ui.yaml|r (status window, visuals and settings) and |cff99ccffplans/closestvendor.addons.yaml|r (TomTom, WaypointUI, NorgannonDB and sound packs).
  Import one plan, finish it and export it (|cff99ccff/ct export|r, optionally |cff99ccff/cvn debug off|r, then |cff99ccff/reload|r) before you import the next: a run uses the last plan imported.

  Have at least 3 free bag slots. The setup step turns on test settings, so the plan runs on the default settings whatever yours are. The last step turns them off and your own settings come back. The steps that change a setting type the default back later.
  Each step starts with one sentence that says what to expect: a question to answer, nothing (CheckThat checks by itself), or something to look at. CheckThat records the result of most steps from the debug log or a CheckThat entry. Only the steps that ask you to look wait for Pass or Fail.
  A step that needs a class, a profession, a damaged item or fewer than 2000 ammo says Needs: first and waits for you. Press Skip when you cannot do it.
logs:
  debug:
    global: ClosestVendorCharDB
    path: log.entries
    format: entries
    cap: 1000
  facts:
    global: CheckThatDB
    path: global.facts
    format: strings
    cap: 300
  errors:
    global: CheckThatDB
    path: global.errors
    format: strings
    quiet: true
    cap: 100
requirements:
  addon-loaded:
    text: ClosestVendor is loaded
    probe: addon-loaded
    name: ClosestVendor
offline:
  level: 6
  toc: wow-closest-vendor/ClosestVendor/ClosestVendor_Vanilla.toc
  tocs:
    era: wow-closest-vendor/ClosestVendor/ClosestVendor_Vanilla.toc
    forever: wow-closest-vendor/ClosestVendor/ClosestVendor_Camelot.toc
  steps:
  - label: The CheckThat integration is working after a real load
    call:
      addon: ClosestVendor
      entry: integration
    returns:
    - working
  - label: The saved bag threshold is 2 on a new character
    call:
      addon: ClosestVendor
      entry: setting
      args:
      - bags.threshold
    returns:
    - '2'
  - label: A fresh account has learned no vendor yet
    call:
      addon: ClosestVendor
      entry: learned
      args:
      - vendors
    returns:
    - 0
  - label: The warning check at login opened no warning request
    call:
      addon: ClosestVendor
      entry: active
    returns: []
sections:
- id: s0
  title: Setup
  intro: Copy ClosestVendor/ into the AddOns folder and log in. The reviewer reads ClosestVendorCharDB (character) and ClosestVendorDB (account) in the SavedVariables folder.
  steps:
  - id: cv.s0.1
    title: Check the ClosestVendor version
    auto: true
    action:
      kind: manual
      text: Nothing appears. CheckThat checks by itself. CheckThat reads the ClosestVendor version.
    expect: The ClosestVendor version is 1.12.0 or newer. If the step fails, copy ClosestVendor 1.12.0 into the game again.
    verify:
    - assertions
    call:
      addon: ClosestVendor
      entry: version
    timeout: 30
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.version
      op: ge
      value: 11200
      label: ClosestVendor is 1.12.0 or newer
    notes: The entry returns major*10000 + minor*100 + patch, so 1.12.0 is 11200. It reads a fact, not the debug log, so it runs before debug logging is on. CheckThat too old to offer entries leaves this step unverified.
  - id: cv.s0.2
    title: Turn on Lua errors, debug logging and test settings, then reload
    action:
      kind: manual
      text: Nothing appears. CheckThat checks by itself. Press Run. It turns on Lua error popups (|cff99ccff/console scriptErrors 1|r), the debug log (|cff99ccff/cvn debug on|r) and test settings (|cff99ccff/cvn testsettings on|r, which puts your own settings aside and uses the defaults), then reloads (|cff99ccff/reload|r).
      commands:
      - "/console scriptErrors 1"
      - "/cvn debug on"
      - "/cvn testsettings on"
      - "/reload"
    expect: The game reloads with no Lua error popup, the debug log keeps recording and chat says test settings are on.
    verify:
    - assertions
    auto: true
    reload: after_action
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: debug log turned on
      - contains: "---- login ----"
      - contains: "test settings: on at login"
      scope: attempt
      label: The debug log turned on, and test settings were still on after the reload
    notes: The login marker and the test settings line come after the reload, so the Run commands alone cannot pass the step. Test settings put the tester's own settings aside for the whole plan, so every step sees the defaults it assumes; the last step turns them off. A Lua error popup is also caught by the last step of the plan, which reads CheckThat's error list.
- id: s1
  title: 'Selling: warning, waypoint and vendor'
  intro: One real sell warning from the question to the vendor. Have at least 3 free bag slots, and stand where a vendor is in reach.
  steps:
  - id: cv.s1.1
    title: "WoW Forever: make the sell warning due and click Yes"
    clients:
    - forever-camelot
    setup: "Needs: at least 3 free bag slots, so the default bag threshold 2 leaves the sell warning off before the step. No question is open."
    action:
      kind: manual
      text: "A question appears. Click Yes. Look, then press Pass or Fail. Press Run. It picks the game waypoint (|cff99ccff/cvn nav native|r) and makes the sell warning due (|cff99ccff/cvn bags 200|r). On the sell question click |cffffd100Yes|r (|cffffd100This map|r or |cffffd100Closest|r when it names two vendors)."
      commands:
      - "/cvn nav native"
      - "/cvn bags 200"
    expect: "The game waypoint to the vendor shows on the map and is tracked. Press Pass."
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "trigger go sell"
      - contains: "question shown: sell, "
      - pattern: "accepted: .+ via native"
      scope: attempt
      label: "The sell warning asked, and Yes set the game waypoint"
    notes: "Player step. Drawing: the map waypoint. A real warning, not a test command. The game waypoint is picked even with TomTom or WaypointUI installed; the addons plan checks those. Check 1.3 types the bag default back, and check 6.1 sets the waypoint choice back to Automatic."
  - id: cv.s1.2
    title: "Classic Era: make the sell warning due and click Yes"
    clients:
    - classic-era
    setup: "Needs: at least 3 free bag slots, so the default bag threshold 2 leaves the sell warning off before the step. No question is open."
    auto: true
    action:
      kind: manual
      text: "A question appears. Click Yes. Press Run. It picks the chat line (|cff99ccff/cvn nav chat|r) and makes the sell warning due (|cff99ccff/cvn bags 200|r). On the sell question click |cffffd100Yes|r (|cffffd100This map|r or |cffffd100Closest|r when it names two vendors)."
      commands:
      - "/cvn nav chat"
      - "/cvn bags 200"
    expect: "A chat line names the vendor, its zone and its coordinates."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "trigger go sell"
      - contains: "question shown: sell, "
      - pattern: "accepted: .+ via chat"
      scope: attempt
      label: "The sell warning asked, and Yes gave the chat line"
    notes: "Classic Era has no game waypoint, so the chat line is the waypoint. The choice makes the chat line win even with TomTom installed (the addons plan checks TomTom). Check 1.3 types the bag default back, and check 6.1 sets the waypoint choice back to Automatic."
  - id: cv.s1.3
    title: "Open a vendor: the waypoint goes away and the vendor is learned"
    setup: "Needs: a vendor you can open. The step sets its own waypoint, so it does not depend on check 1.1 or 1.2."
    auto: true
    action:
      kind: manual
      text: "A question appears. Click Yes. Press Run. It types the bag default back (|cff99ccff/cvn bags 2|r) and asks for a sell vendor (|cff99ccff/cvn test sell|r). Click |cffffd100Yes|r (|cffffd100This map|r or |cffffd100Closest|r when it names two vendors). Then open any vendor's window and close it."
      commands:
      - "/cvn bags 2"
      - "/cvn test sell"
    expect: "The waypoint goes away when the window opens, and the addon logs the vendor it learned."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "test command: sell"
      - pattern: "accepted: .+ via %a+"
      - contains: "merchant window opened"
      - contains: "waypoint cleared: a merchant window opened"
      scope: attempt
      label: "The test pin set a waypoint, and opening the vendor window cleared it"
    - kind: log
      source: debug
      pattern: "vendor learned: .+ %(npc %d+%), %a+"
      scope: attempt
      label: "The vendor window opened and the vendor was learned (new, updated or unchanged)"
    - kind: log
      source: debug
      contains: "it was not in the search pool"
      diagnostic: true
      scope: attempt
      label: "The vendor was new to the search (not shipped, not from NorgannonDB, not learned before)"
    notes: "Any vendor works: the learned line ends with new, updated or unchanged, and the plan accepts all three. A new vendor is unit tested. Check 6.2 asks for this vendor after a reload without opening it."
- id: s2
  title: Other warnings
  intro: Each warning once, from a real threshold. A step that needs a class or a profession says so in Needs and waits for you, so press Skip when you do not have it. Each step types back the thresholds the steps before it changed.
  steps:
  - id: cv.s2.1
    title: "Make the repair warning due and click No"
    setup: "Needs: one worn item between 21% and 99% durability and none at 20% or below; otherwise press Skip. No question is open."
    auto: true
    action:
      kind: manual
      text: "A question appears. Click No. Press Run. It types the bag default back (|cff99ccff/cvn bags 2|r) and makes the repair warning due (|cff99ccff/cvn dur 100|r). On the repair question click |cffffd100No|r."
      commands:
      - "/cvn bags 2"
      - "/cvn dur 100"
    expect: "The repair question appears."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "trigger go repair"
      - contains: "question shown: repair, "
      - contains: "question declined: repair"
      scope: attempt
      label: "The repair warning went out, asked and was answered"
    notes: "Any item below 100% durability is below the threshold 100 (the highest). Check 2.2 types the default 20 back, and with nothing at 20% or below that ends the warning."
  - id: cv.s2.2
    title: "Hunter: make the ammo warning due and click No"
    setup: "Needs: a Hunter with a bow, crossbow or gun equipped and fewer than 2000 arrows or bullets (the highest threshold) and more than 200 (the default); otherwise press Skip."
    auto: true
    action:
      kind: manual
      text: "A question appears. Click No. Press Run. It types the default durability threshold back (|cff99ccff/cvn dur 20|r) and raises the ammo threshold (|cff99ccff/cvn ammo 2000|r). On the arrow or bullet question click |cffffd100No|r."
      commands:
      - "/cvn dur 20"
      - "/cvn ammo 2000"
    expect: "The arrow or bullet question appears."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "trigger go ammo ("
      - pattern: "question shown: [ab]%a+, "
      - pattern: "question declined: [ab]%a+"
      scope: attempt
      label: "The ammo warning went out, asked and was answered"
    notes: "Class step. The question kind is arrow or bullet, after the ammo equipped; no other question kind starts with a or b. Check 2.3 types the ammo default 200 back, and with more than 200 ammo that ends the warning."
  - id: cv.s2.3
    title: "Reagent class: make a reagent warning due and click No"
    setup: "Needs: a class with reagents (for example a Mage) that knows a spell using one and carries 6 to 39 of that reagent (40 is the highest threshold); otherwise press Skip."
    auto: true
    action:
      kind: manual
      text: "A question appears. Click No. Press Run. It types the durability and ammo defaults back (|cff99ccff/cvn dur 20|r, |cff99ccff/cvn ammo 200|r) and raises the reagent threshold (|cff99ccff/cvn reagent 40|r). On the reagent question click |cffffd100No|r."
      commands:
      - "/cvn dur 20"
      - "/cvn ammo 200"
      - "/cvn reagent 40"
    expect: "The reagent question appears and names the reagent and the count left."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "trigger go reagent "
      - contains: "question shown: reagent "
      - contains: "question declined: reagent"
      scope: attempt
      label: "The reagent warning went out, asked and was answered"
    notes: "Class step. With 6 or more, the default 5 typed back in the next step ends the warning."
  - id: cv.s2.4
    title: "Make the food warning due and click No"
    setup: "Needs: 6 to 40 food items (cooked, looted or conjured all count; 40 is the highest threshold), and not a Mage who knows Conjure Food (that class gets a reminder, not a question); otherwise press Skip."
    auto: true
    action:
      kind: manual
      text: "A question appears. Click No. Press Run. It types the durability, ammo and reagent defaults back (|cff99ccff/cvn dur 20|r, |cff99ccff/cvn ammo 200|r, |cff99ccff/cvn reagent 5|r) and raises the food threshold (|cff99ccff/cvn food 40|r). On the food question click |cffffd100No|r."
      commands:
      - "/cvn dur 20"
      - "/cvn ammo 200"
      - "/cvn reagent 5"
      - "/cvn food 40"
    expect: "A question about the closest food vendor appears."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "question shown: supply food, "
      - contains: "question declined: supply"
      scope: attempt
      label: "The food question was asked and answered"
    - kind: log
      source: debug
      contains: "reminder: food ("
      diagnostic: true
      scope: attempt
      label: "A Mage who knows Conjure Food was reminded instead"
    notes: "A Mage who knows Conjure Food gets a reminder instead of a question, so that class presses Skip (the reminder line is diagnostic). Check 2.6 types the food default back."
  - id: cv.s2.5
    title: "Open a profession trainer"
    setup: "Needs: a character with a crafting or gathering profession, standing at a trainer of that profession; otherwise press Skip."
    auto: true
    action:
      kind: manual
      text: "Nothing appears. CheckThat checks by itself. Open the trainer's window and close it."
    expect: "The addon learns the trainer and the professions it teaches, and logs the services the window lists."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "trainer window opened"
      - contains: "trainer learned: "
      scope: attempt
      label: "The trainer was learned when its window opened"
    - kind: log
      source: debug
      pattern: "trainer services: %d+ listed; filters "
      scope: attempt
      label: "The trainer probe logged the services the window lists"
    - kind: log
      source: debug
      pattern: "trainer learned: .+ %(npc %d+%), new"
      diagnostic: true
      scope: attempt
      label: "The trainer was new to this account"
    notes: "The line names the trainer, its npc id, new, updated or unchanged, and what it teaches. Opening the window also makes the profession known, so check 2.6 can ask about it. The services line is the trainer probe (spec diagnostics); it is written once per window with the debug log on."
  - id: cv.s2.6
    title: "Make the trainer warning due, craft or gather, and click No"
    setup: "Builds on check 2.5: the profession whose trainer you opened. Needs: that profession below its current cap, at the level the next tier needs; otherwise press Skip."
    auto: true
    action:
      kind: manual
      text: "A question appears. Click No. Press Run. It types the food default back (|cff99ccff/cvn food 5|r) and raises the profession threshold (|cff99ccff/cvn trade 300|r). Then craft one item or gather once with that profession. On the trainer question click |cffffd100No|r."
      commands:
      - "/cvn food 5"
      - "/cvn trade 300"
    expect: "The trainer question names the profession, the points left and a trainer."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "question shown: trainer for "
      - contains: "question declined: trainer"
      scope: attempt
      label: "The trainer question was asked and answered"
    notes: "With threshold 300 every profession below its cap is near it, so the next skill change or craft asks (Professions.lua). The food default ends the food request from check 2.4, which would hold the profession check back. Check 3.1 types the profession default back."
- id: s3
  title: Waiting for combat and dungeons
  intro: Do this section near a dungeon entrance with a monster to fight. A warning that comes due in a fight or a dungeon waits, and asks after it.
  steps:
  - id: cv.s3.1
    title: "Make the sell warning due in a fight, then answer it after the fight"
    setup: "Needs: a monster to fight near a dungeon entrance; otherwise press Skip. The Run button hides in combat, so press Run (or copy each line from its box into chat, in order) during the fight."
    auto: true
    action:
      kind: manual
      text: "A question appears. Click No. Start a fight. During the fight, press Run: it types |cff99ccff/cvn food 5|r, |cff99ccff/cvn trade 10|r, |cff99ccff/cvn bags 2|r and |cff99ccff/cvn bags 200|r. Finish the fight. When the sell question appears, click |cffffd100No|r."
      commands:
      - "/cvn food 5"
      - "/cvn trade 10"
      - "/cvn bags 2"
      - "/cvn bags 200"
    expect: "No question appears during the fight. The sell question appears after the fight ends."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "trigger held in combat: sell"
      - contains: "event PLAYER_REGEN_ENABLED"
      - contains: "question shown: sell, "
      - contains: "question declined: sell"
      scope: attempt
      label: "The sell warning waited for the fight, asked after it and was answered"
    notes: "The first three lines type the food, profession and bag defaults back, and the last raises the bag threshold. Pressed outside a fight, Run asks at once and the hold line is missing, so the step does not pass. A second Run in the fight works, because the bag default typed back ends the answered request first. Check 1.3 typed the bag default back, so the sell warning starts from off. Check 3.2 was merged into this step and its id is retired."
  - id: cv.s3.3
    title: "Leave the sell question open, enter the dungeon, come out and click No"
    setup: "Needs: a dungeon entrance close by; otherwise press Skip."
    auto: true
    action:
      kind: manual
      text: "A question appears. Click No. Press Run. It types the bag default back and raises it again (|cff99ccff/cvn bags 2|r, |cff99ccff/cvn bags 200|r), so the sell question appears. Leave it open and walk into the dungeon: the question closes. Walk out: the question comes again. Click |cffffd100No|r."
      commands:
      - "/cvn bags 2"
      - "/cvn bags 200"
    expect: "The question closes when you enter the dungeon, nothing is asked inside, and the question is asked again outside."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "trigger go sell"
      - contains: "question shown: sell, "
      - contains: "question withdrawn: the player changed zone"
      - contains: "trigger held in an instance: sell"
      - pattern: "instance: %a+ %-> none"
      - contains: "question shown: sell, "
      - contains: "question declined: sell"
      scope: attempt
      label: "The question was withdrawn at the zone change, the warning waited inside, and it asked again outside"
    notes: "A real warning, not a test command: a test question is never withdrawn. The first Run command ends the sell request check 3.1 left, and the second makes it due again. Checks 3.3 and 3.4 are one step now; id cv.s3.4 is retired. The bag threshold stays at 200 until check 5.1 types it back (checks 4.1 and 4.2 type it back too)."
- id: s4
  title: Buying at a merchant
  intro: A Hunter buys ammo at once (the default); a class with reagents (for example a Mage) answers the reagent question. Each step says what it needs and waits for you, so press Skip when you do not have it.
  steps:
  - id: cv.s4.1
    title: "Reagent class: open a vendor, click Yes, then open it again"
    setup: "Needs: a class with reagents (for example a Mage), fewer than 20 of a watched reagent, enough gold and room in your bags for at least one full purchase (one stack); otherwise press Skip. Stand at a vendor that sells your reagent."
    auto: true
    action:
      kind: manual
      text: "A question appears. Click Yes. Press Run. It types the bag default back (|cff99ccff/cvn bags 2|r) and turns reagent buying on (|cff99ccff/cvn reagentbuy on|r). Open the vendor and click |cffffd100Yes|r on the purchase question. Close the window and open it again."
      commands:
      - "/cvn bags 2"
      - "/cvn reagentbuy on"
    expect: "Yes buys the reagents. The second time the vendor opens, nothing more is bought."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "reagent buy: asked"
      - contains: "reagent buy: bought "
      - pattern: "reagent buy: target %d+, money %d+, plan: nothing, cost 0, short: nil"
      scope: attempt
      label: "The reagent question asked, Yes bought, and the second visit found every watched reagent at the target"
    - kind: log
      source: debug
      contains: "reagent buy: FAILED"
      absent: true
      diagnostic: true
      scope: attempt
      label: "No purchase failed"
    notes: "Class step (reagents). Reagent buying asks first by default. The plan line is computed from the reagents in your bags, so an empty plan on the second visit proves the count rose to the target (20 by default). Ids cv.s4.3 and cv.s4.4 are retired. Closing the purchase question with the merchant window is covered by the unit tests (tests/test_core.lua), so no step checks it in the game."
  - id: cv.s4.2
    title: "Hunter: open a vendor, ammo buys at once, then open it again"
    setup: "Needs: a Hunter with a bow, crossbow or gun, enough gold and room in the quiver or ammo pouch for at least one full purchase (one stack); otherwise press Skip. Stand at a vendor that sells your ammo."
    auto: true
    action:
      kind: manual
      text: "Nothing appears. CheckThat checks by itself. Press Run. It types the bag default back (|cff99ccff/cvn bags 2|r) and keeps ammo buying at its default, buying at once (|cff99ccff/cvn buy auto|r). Open the vendor. Close the window and open it again."
      commands:
      - "/cvn bags 2"
      - "/cvn buy auto"
    expect: "The addon buys ammo as the window opens, with no question. The second time the vendor opens, nothing more is bought: the quiver or ammo pouch is full."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "ammo buy: bought "
      - contains: "ammo buy: less than one purchase of room"
      scope: attempt
      label: "Ammo was bought at once, and the second visit found the storage full"
    - kind: log
      source: debug
      contains: "ammo buy: asked"
      absent: true
      diagnostic: true
      scope: attempt
      label: "Ammo buying did not ask first (the default buys at once)"
    - kind: log
      source: debug
      contains: " buy: FAILED"
      absent: true
      diagnostic: true
      scope: attempt
      label: "No purchase failed"
    notes: "Class step (Hunter). A bought line counts the purchases the game took; the game can still refuse one without an error. The room line is computed from the ammo you carry, so with room for a full purchase before the step it proves the count rose. Id cv.s4.3 is retired."
- id: s5
  title: Report and find
  steps:
  - id: cv.s5.1
    title: "Open the debug report"
    action:
      kind: manual
      text: "Look, then press Pass or Fail. Press Run. It types the bag default back (|cff99ccff/cvn bags 2|r) and opens the debug report (|cff99ccff/cvn log|r)."
      commands:
      - "/cvn bags 2"
      - "/cvn log"
    expect: "A window opens with the report selected for copying. Its first lines name the addon version and the game, and lines further down say \"color picker: available, settings button: available\" and \"CheckThat: working\". The newest log lines follow. Press Pass."
    verify:
    - player
    notes: "Player step. Drawing: the copyable report window and its header, read on the real client: the color picker and settings button lines say what this client has. /cvn log writes no log line, so no assertion can prove it; the \"CheckThat:\" header line is the same text as the integration entry, which the offline block checks. /cvn bags 2 ends the sell warning from section 3 for every class."
  - id: cv.s5.2
    title: "Find a drink seller and pick one"
    action:
      kind: manual
      text: "Look, then press Pass or Fail. Press Run (|cff99ccff/cvn find juice|r). If a menu of items opens, pick one drink. In the seller list that opens, pick a seller."
      commands:
      - "/cvn find juice"
    expect: "Chat says the sellers sell drink in general. A list opens at the mouse with the nearest seller marked, each with its zone and distance. After the pick, a waypoint is set to that seller. Press Pass."
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "find: \"juice\", "
      - pattern: "find: .+ looked up as "
      - contains: "find: seller list for "
      - contains: "find: chosen "
      - pattern: "accepted: .+ via "
      scope: attempt
      label: "The search found drinks, listed sellers, and the pick got a waypoint"
    - kind: log
      source: debug
      contains: "via nothing available"
      absent: true
      scope: attempt
      label: "A waypoint provider took the waypoint"
    notes: "Player step. Drawing: the menus at the mouse and the marked nearest seller. The menus come from the find command itself, so the picks are part of its action."
- id: s6
  title: Finish
  steps:
  - id: cv.s6.1
    title: "Put the buying and waypoint settings back, then reload"
    auto: true
    action:
      kind: manual
      text: "Nothing appears. CheckThat checks by itself. Press Run. It turns reagent buying off (|cff99ccff/cvn reagentbuy off|r), sets the waypoint choice back to Automatic (|cff99ccff/cvn nav auto|r) and reloads (|cff99ccff/reload|r)."
      commands:
      - "/cvn reagentbuy off"
      - "/cvn nav auto"
      - "/reload"
    expect: "The game reloads."
    verify:
    - assertions
    reload: after_action
    assertions:
    - kind: log
      source: debug
      contains: "---- login ----"
      scope: attempt
      label: "The game reloaded"
    notes: "Cleanup the player sees: sections 1 and 4 changed these settings. Each command is harmless when the setting is already at its default."
  - id: cv.s6.2
    title: "After the reload, ask for a sell vendor without opening the vendor from check 1.3"
    setup: "Do not open the vendor. Needs: the vendor you opened in check 1.3 stands next to you; otherwise press Skip."
    auto: true
    action:
      kind: manual
      text: "A question appears. Click No. Press Run (|cff99ccff/cvn test sell|r). The question names the vendor next to you. Click |cffffd100No|r."
      commands:
      - "/cvn test sell"
    expect: "The test question names the vendor from check 1.3, which stands next to you."
    verify:
    - assertions
    timeout: 90
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "test command: sell"
      - contains: "question shown: sell, "
      - contains: "question declined: sell"
      scope: attempt
      label: "The sell question was asked after the reload and answered"
    - kind: log
      source: debug
      contains: "merchant window opened"
      absent: true
      scope: attempt
      label: "No merchant window opened, so the search used the vendors loaded at login"
    notes: "The step waits its whole timeout, because the check that no vendor window opened can only hold at the end. The vendor stands next to you, so it is the closest one. Opening a merchant window adds that vendor to the search again, so the step asks without opening it. The question proves the vendor saved before the reload only when check 1.3 learned it as new; for a vendor the addon already knew, it proves the reload path (the vendors load again at login)."
  - id: cv.s6.3
    title: Turn test settings off, then check for Lua errors
    action:
      kind: manual
      text: Nothing appears. CheckThat checks by itself. Press Run. It turns test settings off (|cff99ccff/cvn testsettings off|r) and your own settings come back. CheckThat then reads its list of Lua errors for this run.
      commands:
      - "/cvn testsettings off"
    expect: Chat says your own settings are back, and ClosestVendor raised no Lua error during this plan.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log
      source: debug
      contains: 'test settings: off (own settings restored)'
      scope: attempt
      label: Test settings are off and your own settings are back
    - kind: log
      source: errors
      pattern: "%[ClosestVendor%]"
      absent: true
      scope: session
      label: ClosestVendor raised no Lua error in this run
    notes: 'Scope session reads CheckThat''s whole error list. CheckThat keeps an error only while a run is open, across /reload, up to the last 100, so the check covers every step of this run. CheckThat 0.21.0 has no scope for one run, and starting a run keeps the list: a ClosestVendor error from an earlier run (also of another ClosestVendor plan) fails this step too. When it fails, compare the error time with the start of this run. It passes when the list has no ClosestVendor error after Run has finished. Press Run first: it turns test settings off and writes the line the first assertion reads. After this step, export the run (/ct export), optionally turn the debug log off (/cvn debug off), and type /reload so the game saves the log.'

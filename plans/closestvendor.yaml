    expect: The trainer question appears on the skill-up. It names the profession, the points left and
      the trainer. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"question shown: trainer for <profession>".'
  - id: cv.s6.4
    title: Click Yes on the trainer question
    action:
      kind: manual
      text: Click |cffffd100Yes|r on the trainer question.
    expect: A waypoint to the trainer is set. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"accepted: <trainer> via <provider>".'
  - id: cv.s6.5
    title: Craft near the limit with a tradeskill window open and no skill-up
    action:
      kind: manual
      text: Craft near the limit with a tradeskill window open, with no skill-up.
    expect: The trainer question still appears after the craft. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"a craft finished".'
  - id: cv.s6.6
    title: Answer No to the trainer question, then craft again
    action:
      kind: manual
      text: Answer |cffffd100No|r to the trainer question, then craft again.
    expect: The question appears again. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"question declined: trainer".'
  - id: cv.s6.7
    title: Leave the trainer question open, then craft again
    action:
      kind: manual
      text: Leave the trainer question open, then craft again.
    expect: The question does not show a second time. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: 'one "question shown: trainer" line.'
  - id: cv.s6.8
    title: Reach the tier limit (for example 75/75)
    action:
      kind: manual
      text: Reach the tier limit (for example 75/75).
    expect: The addon still asks. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"question shown: trainer" at the tier limit.'
  - id: cv.s6.9
    title: Reach the final tier (300/300)
    action:
      kind: manual
      text: Reach the final tier (300/300).
    expect: The addon never asks. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: 'no "question shown: trainer" line.'
  - id: cv.s6.10
    title: With a trainer waypoint set, open a vendor window
    action:
      kind: manual
      text: With a trainer waypoint set, open a vendor window.
    expect: The waypoint stays. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: no "trainer waypoint cleared:" line.
  - id: cv.s6.11
    title: With a trainer waypoint set, open that profession's trainer window
    action:
      kind: manual
      text: With a trainer waypoint set, open that profession's trainer window.
    expect: The waypoint goes away. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"trainer waypoint cleared:".'
  - id: cv.s6.12
    title: Use a profession whose trainer or crafting window you never opened
    action:
      kind: manual
      text: Use a profession whose trainer or crafting window you never opened.
    expect: The addon stays silent. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: no "question shown:" line.
  - id: cv.s6.13
    title: Use a weapon skill near its limit
    action:
      kind: manual
      text: Use a weapon skill near its limit.
    expect: The addon stays silent. Press Pass.
    verify:

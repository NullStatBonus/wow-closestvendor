- id: s5
  title: Ammo
  steps:
  - id: cv.s5.1
    title: As a Hunter, equip a bow with fewer arrows than the threshold
    setup: A Hunter with a bow and 3 to 2000 arrows in the ammo slot, and a gun in your bags. The ammo threshold goes up to 2000, so more arrows never count as low.
    action:
      kind: manual
      text: Hunter only; press Skip on other classes. Press Run. It types |cff99ccff/cvn ammo 0|r, which ends any ammo warning, then |cff99ccff/cvn ammo 2000|r, so your 3 to 2000 arrows are low. Leave the arrow question open for check 2.
      commands:
      - /cvn ammo 0
      - /cvn ammo 2000
    expect: The arrows question appears.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log
      source: debug
      contains: 'question shown: arrow, '
      scope: attempt
      label: The arrow question was asked
    notes: 'Class step: a run belongs to one character, so other classes skip it. The threshold 0 clears the ammo latch while you carry any arrows, so the threshold 2000 asks again. An answered question would hold the ammo warning until the count clears, so check 2 needs this one open.'
  - id: cv.s5.2
    title: As a Hunter, equip a gun with fewer bullets than the threshold
    setup: The arrow question from check 1 is still open.
    action:
      kind: manual
      text: Hunter only; press Skip on other classes. Equip the gun. Leave the bullet question open.
    expect: The arrow question closes and the bullets question appears.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'ammo request restarted: arrow -> bullet'
      - contains: 'question shown: bullet, '
      scope: attempt
      label: The arrow request ended and the bullet question was asked
    notes: Class step. The ammo threshold is still 2000, so any bullet count is low. Arrows in the ammo slot count as 0 bullets.
  - id: cv.s5.3
    title: As a Hunter, shoot ammo down to the threshold
    setup: Equip the bow with arrows again before you press Run, and count your arrows. The arrow question may show; leave it.
    action:
      kind: manual
      text: Hunter only; press Skip on other classes. Press Run (|cff99ccff/cvn ammo 0|r) to end the ammo request. Then enter |cff99ccff/cvn ammo|r, a space and a count 3 below your arrows (for example 197 with 200 arrows). Shoot a target until your arrows drop to that count.
      commands:
      - /cvn ammo 0
    expect: The arrow question appears when you cross the threshold, or as soon as the fight ends.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: trigger clear ammo
      - contains: trigger go ammo (
      - contains: 'question shown: arrow, '
      scope: attempt
      label: The ammo request ended, your shots crossed the threshold, and the arrow question came
    - kind: log
      source: debug
      contains: 'trigger held in combat: ammo'
      diagnostic: true
      scope: attempt
      label: The crossing was held until the fight ended
    - kind: log
      source: debug
      contains: 'gear events: '
      diagnostic: true
      scope: attempt
      label: Ammo changes were checked
    notes: 'Class step. The threshold you type by hand sits just below your count, so a few shots cross it. Shooting is combat, so the crossing is usually held until the fight ends; the hold line is diagnostic, because the crossing shot can kill the target and end the fight first. A threshold typed at or above your count asks at once, before any shot, so type a count below your arrows. The threshold goes up to 2000, so start with 3 to 2000 arrows. Equip the bow before Run: with the gun, 0 bullets stay low at threshold 0 and the request does not end. The game may report the count as a bag update instead of a gear event, so the "gear events: N folded into one check" line is diagnostic.'
  - id: cv.s5.4
    title: As a Hunter, equip a bow with only bullets in the ammo slot
    setup: 'Put bullets in the bow''s ammo slot instead of arrows before you press Run.'
    action:
      kind: manual
      text: Hunter only; press Skip on other classes. Press Run. It turns the ammo warning off, types the default threshold back (|cff99ccff/cvn ammo 200|r) and turns the warning on again.
      commands:
      - /cvn ammo off
      - /cvn ammo 200
      - /cvn ammo on
    expect: The addon counts it as no ammo and asks. Put the arrows back afterwards.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'ammo=arrow:0 '
      - contains: 'question shown: arrow, '
      scope: attempt
      label: Zero arrows counted, and the arrow question was asked
    - kind: log
      source: debug
      contains: 'ammo not watched: the ammo warning is off'
      diagnostic: true
      scope: attempt
      label: The ammo warning was off in between
    notes: Class step. Turning the warning off and on ends the ammo request from check 3, so the zero count asks again. Zero arrows are low at any threshold, so this check also types the default 200 back.
  - id: cv.s5.5
    title: As a Rogue or Warrior, equip a thrown weapon
    setup: A bow, crossbow or gun is equipped, and a thrown weapon is in your bags.
    action:
      kind: manual
      text: Rogue, Warrior, or a Hunter who has learned Thrown only; press Skip otherwise. Equip the thrown weapon.
    expect: The addon never asks about ammo.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'ammo not watched: no bow, crossbow or gun equipped, or its ammo cannot be read'
      scope: attempt
      label: The addon stopped watching ammo
    - kind: log
      source: debug
      contains: trigger go ammo
      absent: true
      scope: attempt
      label: No ammo request
    - kind: log
      source: debug
      contains: 'question shown: arrow'
      absent: true
      scope: attempt
      label: No arrow question
    - kind: log
      source: debug
      contains: 'question shown: bullet'
      absent: true
      scope: attempt
      label: No bullet question
    notes: 'Class step: it needs a thrown weapon and nothing from the checks before it.'
  - id: cv.s5.6
    title: As a Mage, Priest or Warlock, equip a wand
    setup: A wand is in your bags.
    action:
      kind: manual
      text: Mage, Priest or Warlock only; press Skip on other classes. Equip the wand.
    expect: The addon never asks about ammo.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: event PLAYER_EQUIPMENT_CHANGED
      scope: attempt
      label: The new weapon was checked
    - kind: log
      source: debug
      contains: 'ammo watched: '
      absent: true
      scope: attempt
      label: Ammo is not watched
    - kind: log
      source: debug
      contains: trigger go ammo
      absent: true
      scope: attempt
      label: No ammo request
    - kind: log
      source: debug
      contains: 'question shown: arrow'
      absent: true
      scope: attempt
      label: No arrow question
    - kind: log
      source: debug
      contains: 'question shown: bullet'
      absent: true
      scope: attempt
      label: No bullet question
    notes: 'Class step: it needs a wand user and nothing from the checks before it. A wand never needs ammo, so nothing changes and no ammo line is written; the equipment event proves the check ran.'
  intro: Run these checks on a character with the default thresholds; the checks change thresholds and set them back to the defaults. Use |cff99ccff/cvn choice ask|r. Press Skip on a check your class cannot do.

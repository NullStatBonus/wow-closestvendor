- id: s19
  title: NorgannonDB
  intro: Check 1 is for a client without NorgannonDB. Checks 2 to 5 are for WoW Forever with NorgannonDB
    installed. Press Skip on the checks that do not fit your setup.
  steps:
  - id: cv.s19.1
    title: Without NorgannonDB, the addon finds none
    action:
      kind: manual
      text: Without NorgannonDB only; press Skip otherwise. CheckThat reads the NorgannonDB line the addon
        wrote at login.
    expect: The addon found no NorgannonDB at login.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'NorgannonDB: not found'
      scope: session
      label: No NorgannonDB at login
    notes: 'The line is written at each login, after the login marker, so it comes from the reload of
      check 0.2. Vendors then work as before: the other sections cover them.'
  - id: cv.s19.2
    title: On WoW Forever with NorgannonDB, the addon reads it
    action:
      kind: manual
      text: With NorgannonDB installed only; press Skip otherwise. CheckThat reads the NorgannonDB line
        the addon wrote at login.
    expect: The addon found NorgannonDB at login and names its schema.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log
      source: debug
      contains: 'NorgannonDB: found, schema '
      scope: session
      label: NorgannonDB was found at login
    notes: Replaces the report line, which is not in the debug log. The same text is the external entry
      (section 27 calls it).
    clients:
    - forever-camelot
  - id: cv.s19.3
    title: On WoW Forever, test sell in Riverglades and Zephras Isle
    action:
      kind: manual
      text: Stand in Riverglades and press Run (|cff99ccff/cvn test sell|r). Then stand in Zephras Isle
        and enter |cff99ccff/cvn test sell|r from its box.
      commands:
      - /cvn test sell
    expect: Each time a vendor in that zone is named and the pin points to a real vendor. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'question shown: sell, '
      count:
        min: 2
      scope: attempt
      label: The question was asked in both zones
    notes: 'Player step. Map knowledge: the vendor stands where the pin is.'
    clients:
    - forever-camelot
  - id: cv.s19.4
    title: Open the vendor you were sent to
    setup: Stand next to the vendor the last question in check 3 named.
    action:
      kind: manual
      text: Open the vendor's window.
    expect: The addon records whether the vendor stands where NorgannonDB says.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log
      source: debug
      contains: 'vendor learned: '
      scope: attempt
      label: The vendor was learned
    - kind: log
      source: debug
      contains: NorgannonDB position
      scope: attempt
      label: The addon decided whose position to use
    notes: The line ends with "replaces the NorgannonDB position" (another map, or more than 0.03 of the
      map away) or "the NorgannonDB position is kept". The next pin uses the position named.
    clients:
    - forever-camelot
  - id: cv.s19.5
    title: Disable NorgannonDB and type /reload
    action:
      kind: manual
      text: With NorgannonDB installed only; press Skip otherwise. Disable NorgannonDB in the AddOns list,
        then press Run (|cff99ccff/reload|r).
      commands:
      - /reload
    expect: No errors show and the addon finds no NorgannonDB.
    verify:
    - assertions
    auto: true
    timeout: 120
    reload: after_action
    assertions:
    - kind: log
      source: debug
      contains: 'NorgannonDB: not found'
      scope: attempt
      label: The addon loaded without NorgannonDB
    - kind: log
      source: errors
      pattern: '%[ClosestVendor%]'
      absent: true
      scope: attempt
      label: No ClosestVendor Lua error
    clients:
    - forever-camelot

- id: s23
  title: Safe questions
  steps:
  - id: cv.s23.1
    title: Leave the ammo question open and close the merchant
    setup: Buy ammo and Ask before buying ammo are on, and your quiver or ammo pouch has room for more ammo.
    action:
      kind: manual
      text: Hunter only; press Skip on other classes. Open an ammo merchant, leave the purchase question open and close the merchant.
    expect: The question closes and nothing is bought.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: merchant window opened
      - contains: 'purchase question closed with the merchant: ammo'
      scope: attempt
      label: The ammo question closed with the merchant
    - kind: log
      source: debug
      contains: 'ammo buy: bought'
      absent: true
      scope: attempt
      label: Nothing was bought
    notes: 'Class step: a run belongs to one character, so other classes skip it. It needs nothing from another check.'
  - id: cv.s23.2
    title: Leave the reagent question open and close the merchant
    setup: Buy reagents and Ask before buying reagents are on, and a watched reagent is below its buy target.
    action:
      kind: manual
      text: Reagent class only (for example a Mage); press Skip on other classes. Open a reagent merchant, leave the purchase question open and close the merchant.
    expect: The question closes and nothing is bought.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: merchant window opened
      - contains: 'purchase question closed with the merchant: reagents'
      scope: attempt
      label: The reagent question closed with the merchant
    - kind: log
      source: debug
      contains: 'reagent buy: bought'
      absent: true
      scope: attempt
      label: Nothing was bought
    notes: 'Class step: it needs a class with watched reagents and nothing from another check.'
  - id: cv.s23.3
    title: With the ammo question open, cause a route question
    setup: Buy ammo and Ask before buying ammo are on. Open an ammo merchant and leave the purchase question open.
    action:
      kind: manual
      text: Hunter only; press Skip on other classes. With the purchase question open, press Run (|cff99ccff/cvn test sell|r) so a route question shows.
      commands:
      - /cvn test sell
    expect: The route question does not replace the ammo question. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: merchant window opened
      - contains: 'question shown: sell, '
      scope: attempt
      label: The merchant opened, then a route question was asked
    notes: 'Player step. Drawing: the purchase and route questions are separate dialogs side by side. No decision point chooses between them, so only the screen shows that both stay. Class step: it opens its own purchase question, so it does not need check 1.'
  - id: cv.s23.4
    title: With gear below the threshold and full bags, answer No to repair
    setup: Have at least 3 free bag slots. Wear at least one item between 21% and 99% durability and nothing at 20% or below. No ammo, reagent, food, water or pet food warning is due, because those come before selling.
    action:
      kind: manual
      text: Press Run. It types |cff99ccff/cvn dur 100|r, then |cff99ccff/cvn bags 200|r. Click |cffffd100No|r (or |cffffd100Cancel|r) on the repair question, or press Escape on it. Leave the sell question open.
      commands:
      - /cvn dur 100
      - /cvn bags 200
    expect: The sell question appears within a moment.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question shown: repair, '
      - contains: 'question declined: repair'
      - contains: 'request released: repair'
      - contains: 'question shown: sell, '
      scope: attempt
      label: No ended the repair request, then the sell question came
    notes: Durability first, then bags, so the repair question comes first. Both thresholds stay changed until check 10 types the defaults back.
  - id: cv.s23.5
    title: After that, wait a minute without repairing
    setup: The sell question from check 4 is still open.
    action:
      kind: manual
      text: Leave the sell question open. Move an item in your bags, then wait a minute without repairing.
    expect: The repair question is not asked again until you repair.
    verify:
    - assertions
    auto: true
    timeout: 90
    call:
      addon: ClosestVendor
      entry: active
    assertions:
    - kind: log
      source: debug
      contains: event BAG_UPDATE_DELAYED
      scope: attempt
      label: The addon checked again
    - kind: log
      source: debug
      contains: trigger go repair
      absent: true
      scope: attempt
      label: No new repair request
    - kind: log
      source: debug
      contains: 'question shown: repair'
      absent: true
      scope: attempt
      label: No repair question
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.active
      op: eq
      value: sell
      label: Sell, not repair, is the open request
    notes: The latch that holds repair back (handled in Triggers) has no entry. After No on repair the sell question from check 4 is the open request, so the active entry must return sell when the step opens. The bag move makes the addon check again inside the step; the step waits its 90 seconds for the absent checks.
  - id: cv.s23.6
    title: 'Optional: need repair with full bags where no repairer is known'
    setup: 'WoW Forever only. Go to a new zone on its own continent (for example Zephras Isle) where you opened a vendor that does not repair and know no repairer, before you press Run.'
    action:
      kind: manual
      text: Optional; press Skip if no such zone is at hand. Press Run. It types |cff99ccff/cvn dur 1|r, which ends the repair warning, then |cff99ccff/cvn dur 100|r.
      commands:
      - /cvn dur 1
      - /cvn dur 100
    expect: The sell question is asked.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: no known vendor for repair on this continent
      - contains: 'request released: repair'
      - contains: 'question shown: sell, '
      scope: attempt
      label: No repairer known, so the sell question came
    notes: 'Optional, WoW Forever only: the shipped Classic Era list has repairers on both outdoor continents, so only a new WoW Forever zone without shipped vendors can lack one, and only when NorgannonDB adds no repairer there. The threshold 1 ends the repair warning unless an item is broken, so the No from check 4 is cleared and the threshold 100 sends the repair warning out again. The bag threshold is still 200. Check 7 starts by going back to a continent with a known repairer.'
    clients:
    - forever-camelot
  - id: cv.s23.7
    title: Make the repair warning due while dead, then resurrect
    setup: Go back to a continent with a known repairer. Then die, for example to a much stronger enemy.
    action:
      kind: manual
      text: While dead or a ghost, press Run. It types |cff99ccff/cvn dur 1|r, then |cff99ccff/cvn dur 100|r. Then resurrect at the corpse or a spirit healer.
      commands:
      - /cvn dur 1
      - /cvn dur 100
    expect: No question while dead or a ghost; the repair question appears once alive.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'trigger held while dead: repair'
      - contains: 'question shown: repair, '
      scope: attempt
      label: Held while dead, asked once alive
    notes: 'Run shows while dead, out of combat. Both commands run while dead: the threshold 1 clears the repair latch, and 100 makes the warning due while dead only. A repair question needs a known repairer, so the check starts on such a continent.'
  - id: cv.s23.8
    title: Repeat, but accept a resurrection from another player before releasing
    setup: Another player who can resurrect you is with you. Die near them.
    action:
      kind: manual
      text: While dead, before you release, press Run. It types |cff99ccff/cvn dur 1|r, then |cff99ccff/cvn dur 100|r. Then accept the resurrection from the other player.
      commands:
      - /cvn dur 1
      - /cvn dur 100
    expect: The repair question appears once alive.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'trigger held while dead: repair'
      - contains: 'question shown: repair, '
      scope: attempt
      label: Held while dead, asked once alive
    notes: The threshold 1 ends the repair request from check 7, so no repair at a vendor is needed in between. You are still on the continent with a known repairer from check 7.
  - id: cv.s23.9
    title: With the sell question showing, drop gear below the threshold
    action:
      kind: manual
      text: Press Run. It ends the repair and sell warnings (|cff99ccff/cvn dur 1|r, |cff99ccff/cvn bags 0|r), makes the sell warning due (|cff99ccff/cvn bags 200|r), then the repair warning (|cff99ccff/cvn dur 100|r). Answer |cffffd100No|r (or |cffffd100Cancel|r) to the repair question.
      commands:
      - /cvn dur 1
      - /cvn bags 0
      - /cvn bags 200
      - /cvn dur 100
    expect: The repair question replaces the sell question. After No, the sell question is asked again.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question shown: sell, '
      - contains: 'question shown: repair, '
      - contains: 'question declined: repair'
      - contains: 'question shown: sell, '
      scope: attempt
      label: Repair replaced sell, then sell came back after No
    notes: 'Run fixes the order: each command checks at once, so the sell question comes first, then repair replaces it. The thresholds 1 and 0 clear both latches whatever the gear and bags are.'
  - id: cv.s23.10
    title: Type the default bag and durability thresholds back
    action:
      kind: manual
      text: 'Press Run to type the default thresholds back: |cff99ccff/cvn bags 2|r and |cff99ccff/cvn dur 20|r.'
      commands:
      - /cvn bags 2
      - /cvn dur 20
    expect: Chat shows the bag threshold 2 and the durability threshold 20. Repair your gear if the deaths took it to 20% or below. Press Pass.
    verify:
    - player
    notes: 'Player step. Cleanup: checks 4 to 9 changed both thresholds; this types the defaults back. Nothing to log.'
  intro: Run these checks on a character with the default thresholds; the checks change thresholds and set them back to the defaults. Use |cff99ccff/cvn choice ask|r. Press Skip on a check your class cannot do.

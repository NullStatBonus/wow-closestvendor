    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: reagentBuyEnabled false -> true'
      scope: attempt
      label: Buying is on
    - kind: log
      source: debug
      contains: 'setting changed: reagentBuyTarget 20 -> 35'
      scope: attempt
      label: The amount is 35
    notes: 'Player step. Drawing: the checkboxes and the slider. The setting lines prove the values. Check
      98 puts the amount back to 20.'
  - id: cv.s13.96
    title: As a Hunter, Warrior or Warlock, open the settings page, Reagents
    action:
      kind: manual
      text: Hunter, Warrior or Warlock only; press Skip otherwise. Open the settings page, Reagents.
    expect: All three controls are greyed out with "Your class does not use reagents." Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: greyed controls and their text. No debug line proves it.'
  - id: cv.s13.97
    title: As a Hunter, Warrior or Warlock, type /cvn reagentbuy on
    action:
      kind: manual
      text: Hunter, Warrior or Warlock only; press Skip otherwise. Press Run (|cff99ccff/cvn reagentbuy
        on|r).
      commands:
      - /cvn reagentbuy on
    expect: Chat says "Your class does not use reagents." Press Pass.
    verify:
    - player
    notes: Player step. The chat text is not in the debug log, and a command that changes nothing writes
      no line.
  - id: cv.s13.98
    title: Type /cvn reagentbuy on and /cvn reagentbuy auto
    setup: Carry fewer than 20 of each reagent you use (Arcane Powder, Rune of Teleportation). Enough
      gold and bag space for the purchase.
    action:
      kind: manual
      text: Mage only; press Skip otherwise. Press Run. It sets buying on, at once, up to 20 (|cff99ccff/cvn
        reagentbuy on|r, |cff99ccff/cvn reagentbuy auto|r, |cff99ccff/cvn reagentbuy 20|r). Open the vendor.
      commands:
      - /cvn reagentbuy on
      - /cvn reagentbuy auto
      - /cvn reagentbuy 20
    expect: The addon brings each watched reagent to 20 in one purchase.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: reagentBuyTarget 35 -> 20'
      scope: attempt
      label: The amount is back to 20
      diagnostic: true
    - kind: log
      source: debug
      pattern: 'reagent buy: target 20, money %d+, plan: 17020x%d+ 17031x%d+'
      scope: attempt
      label: The plan tops up Arcane Powder and Rune of Teleportation to 20
    - kind: log
      source: debug
      scope: attempt
      label: Both reagents were bought
      pattern: 'reagent buy: bought 17020x%d+ 17031x%d+'
    - kind: log
      source: debug
      contains: 'reagent buy: FAILED'
      absent: true
      scope: attempt
      label: No purchase failed
    notes: 'Item ids: 17020 Arcane Powder, 17031 Rune of Teleportation (Reagents.lua); a Mage who knows
      Portals also tops up 17032, which the plan line lists after them. The amounts depend on what you
      carry; check 100 reads that each is 20 afterwards. Check 99 repeats it on Classic Era.'
    clients:
    - forever-camelot
  - id: cv.s13.99
    title: Repeat the same purchase on Classic Era
    setup: Classic Era. Carry fewer than 20 of each reagent you use (Arcane Powder, Rune of Teleportation).
      Enough gold and bag space for the purchase.
    action:
      kind: manual
      text: Mage only; press Skip otherwise. Press Run. It sets buying on, at once, up to 20 (|cff99ccff/cvn
        reagentbuy on|r, |cff99ccff/cvn reagentbuy auto|r, |cff99ccff/cvn reagentbuy 20|r), the same as
        check 98. Open the vendor.
      commands:
      - /cvn reagentbuy on
      - /cvn reagentbuy auto
      - /cvn reagentbuy 20
    expect: The addon brings each watched reagent to 20, the same as on WoW Forever.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: reagentBuyTarget 35 -> 20'
      scope: attempt
      label: The amount is back to 20
      diagnostic: true
    - kind: log
      source: debug
      pattern: 'reagent buy: target 20, money %d+, plan: 17020x%d+ 17031x%d+'
      scope: attempt
      label: The plan tops up Arcane Powder and Rune of Teleportation to 20
    - kind: log
      source: debug
      scope: attempt
      label: Both reagents were bought
      pattern: 'reagent buy: bought 17020x%d+ 17031x%d+'
    - kind: log
      source: debug
      contains: 'reagent buy: FAILED'
      absent: true
      scope: attempt
      label: No purchase failed
    notes: Check 98 runs only on WoW Forever, so this step types the same commands. On Classic Era check
      95 left asking on and the amount at 35; the diagnostic line shows the amount change.
    clients:
    - classic-era
  - id: cv.s13.100
    title: After that purchase, close the vendor and open it again
    setup: You carry 20 of each reagent from check 98 or 99.
    action:
      kind: manual
      text: Close the vendor and open it again.
    expect: The addon buys nothing.
    verify:
    - assertions
    auto: true
    timeout: 120
    call:
      addon: ClosestVendor
      entry: reagents
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.reagents
      op: contains
      value: 17020:20,17031:20
      label: Arcane Powder and Rune of Teleportation are both at 20
    - kind: log
      source: debug
      contains: 'plan: nothing'
      scope: attempt
      label: The new plan is empty
    - kind: log
      source: debug
      contains: 'reagent buy: bought'
      absent: true
      scope: attempt
      label: Nothing was bought
    notes: 'The entry lists the watched reagents and counts when the step opens: after the purchase. Rune
      of Portals (17032), when known, sorts after the two and does not break the check. The absent check
      waits the whole timeout.'
  - id: cv.s13.101
    title: Type /cvn reagentbuy ask, open the vendor and do not click
    setup: Carry fewer than 20 of a reagent you use (use or sell some after check 100).
    action:
      kind: manual
      text: Mage only; press Skip otherwise. Press Run (|cff99ccff/cvn reagentbuy ask|r). Open the vendor
        and do not click.
      commands:
      - /cvn reagentbuy ask
    expect: A dialog lists the reagents, the counts and the total price. Nothing is bought.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'reagent buy: target '
      - contains: 'reagent buy: asked'
      scope: attempt
      label: The purchase question was asked
    - kind: log
      source: debug
      contains: 'reagent buy: bought'
      absent: true
      scope: attempt
      label: Nothing was bought
    - kind: log
      source: debug
      contains: 'reagent buy: FAILED: the question did not show'
      absent: true
      scope: attempt
      label: The dialog showed
    notes: 'The line "reagent buy: asked" is written after the game confirms the dialog is on screen.'
  - id: cv.s13.102
    title: With the dialog showing, click No or press Esc
    action:
      kind: manual
      text: With the dialog showing, click |cffffd100No|r or press Esc.
    expect: The addon buys nothing.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log
      source: debug
      contains: 'reagent buy: declined'
      scope: attempt
      label: The question was declined
    - kind: log
      source: debug
      contains: 'reagent buy: bought'
      absent: true
      scope: attempt
      label: Nothing was bought
  - id: cv.s13.103
    title: Open the vendor again and click Yes
    action:
      kind: manual
      text: Close the vendor, open it again and click |cffffd100Yes|r.
    expect: The addon buys the listed reagents.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'reagent buy: asked'
      - contains: 'reagent buy: bought '
      scope: attempt
      label: Yes bought the reagents
  - id: cv.s13.104
    title: As a Rogue with a bow, type /cvn buy ask and open a vendor
    setup: A Rogue with a bow and arrows that is low on Flash Powder.
    action:
      kind: manual
      text: Rogue only; press Skip otherwise. Press Run. It turns ammo buying and reagent buying on and
        sets both to ask first. Open a vendor that sells arrows and Flash Powder. Click |cffffd100No|r
        on both dialogs.
      commands:
      - /cvn buy on
      - /cvn buy ask
      - /cvn reagentbuy on
      - /cvn reagentbuy ask
    expect: Both dialogs show. Neither replaces the other.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log
      source: debug
      contains: 'ammo buy: asked'
      scope: attempt
      label: The ammo question showed
    - kind: log
      source: debug
      contains: 'reagent buy: asked'
      scope: attempt
      label: The reagent question showed
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'reagent buy: asked'
      - contains: 'ammo buy: declined'
      scope: attempt
      label: The ammo dialog was still open to answer after the reagent dialog showed
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'ammo buy: asked'
      - contains: 'reagent buy: declined'
      scope: attempt
      label: The reagent dialog was answered after the ammo dialog showed
    - kind: log
      source: debug
      pattern: 'buy: FAILED: the question did not show'
      absent: true
      scope: attempt
      label: No dialog failed to show
    notes: Rogue only. A dialog replaced by another writes no "declined" line, so each No on its own dialog
      proves both stayed open. Check 115 sets the buying settings back for this character.
  - id: cv.s13.105
    title: Type /cvn reagentbuy 0, then open the vendor
    setup: A class that uses reagents. Reagent buying is on.
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn reagentbuy 0|r). Open the vendor.
      commands:
      - /cvn reagentbuy 0
    expect: The addon buys nothing and shows no dialog.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log
      source: debug
      contains: 'reagent buy: amount is 0'
      scope: attempt
      label: The amount 0 stopped the purchase
    - kind: log
      source: debug
      contains: 'reagent buy: asked'
      absent: true
      scope: attempt
      label: No dialog was asked
    notes: The absent check waits the whole timeout. Check 106 puts the amount back to 20.
  - id: cv.s13.106
    title: Have less gold than one reagent costs, then open the vendor
    setup: A reagent class with reagents below 20. Reagent buying is on.
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn reagentbuy 20|r). Have less gold than one reagent costs, then open
        the vendor.
      commands:
      - /cvn reagentbuy 20
    expect: The addon buys nothing and chat says you cannot afford any reagents.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log
      source: debug
      contains: 'setting changed: reagentBuyTarget 0 -> 20'
      scope: attempt
      label: The amount is back to 20
      diagnostic: true
    - kind: log
      source: debug
      contains: 'plan: nothing, cost 0, short: money'
      scope: attempt
      label: Nothing was affordable
  - id: cv.s13.107
    title: Have gold for only part of the list, then open the vendor
    setup: A reagent class with several reagents below 20. Reagent buying is on.
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn reagentbuy auto|r). Have gold for only part of the list, then open
        the vendor.
      commands:
      - /cvn reagentbuy auto
    expect: The addon buys that part in table order.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log
      source: debug
      pattern: 'plan: %d+x%d+.*short: money'
      scope: attempt
      label: The plan is partial and money was short
    - kind: log
      source: debug
      contains: 'reagent buy: bought '
      scope: attempt
      label: The addon bought the part
    notes: 'Chat ends with "(all you could afford)": the text is a chat check left to the reviewer.'
  - id: cv.s13.108
    title: Fill ordinary bags completely, then open the reagent vendor
    setup: A reagent class with reagents below 20. Reagent buying is on.
    action:
      kind: manual
      text: Fill ordinary bags with no free slot and no partial stack of the reagent (quivers, soul bags
        and profession bags do not count). Open the vendor.
    expect: The addon buys nothing and chat says your bags have no room.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log
      source: debug
      contains: 'plan: nothing, cost 0, short: bags'
      scope: attempt
      label: No room in the bags
  - id: cv.s13.109
    title: Free one bag slot, then open the vendor
    setup: A reagent class with reagents below 20. Reagent buying is on.
    action:
      kind: manual
      text: Free one bag slot, then open the vendor.
    expect: The addon buys what fits.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log
      source: debug
      pattern: 'plan: %d+x%d+.*short: bags'
      scope: attempt
      label: The plan fits one slot and bags were short
    - kind: log
      source: debug
      contains: 'reagent buy: bought '
      scope: attempt
      label: The addon bought what fits
    notes: 'Chat ends with "(all that fits in your bags)": the text is a chat check left to the reviewer.'
  - id: cv.s13.110
    title: Keep a partial reagent stack in a full bag, then open the vendor
    setup: A reagent class. Every free slot is full and one stack of a reagent is not full.

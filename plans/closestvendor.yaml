    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'auto: '
      - pattern: 'accepted: .+ via '
      scope: attempt
      label: The test set its waypoint at once
    - kind: log
      source: debug
      contains: 'test command: nothing asked'
      absent: true
      scope: attempt
      label: The test found a vendor
    - kind: log
      source: debug
      contains: 'question shown: '
      absent: true
      scope: attempt
      label: No question
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the waypoint
    - kind: log
      source: debug
      contains: via chat
      absent: true
      scope: attempt
      label: The waypoint is on the map, not only a chat line
    notes: The "test command:" line comes from the command itself and proves nothing; the auto line is
      the proof, and the accepted line after it shows the waypoint was set. The wording "... to repair your gear." is covered by unit tests.
  - id: cv.s12.32
    title: Trigger an automatic waypoint for selling
    setup: Question mode is automatic from check 29. A vendor for it is known. A waypoint method is in
      use (TomTom, WaypointUI or the game waypoint).
    action:
      kind: manual
      text: Press Run to type |cff99ccff/cvn test sell|r.
      commands:
      - /cvn test sell
    expect: The waypoint is set at once, with no question.
    verify:
    - assertions
    auto: true
    timeout: 60
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'auto: '
      - pattern: 'accepted: .+ via '
      scope: attempt
      label: The test set its waypoint at once
    - kind: log
      source: debug
      contains: 'test command: nothing asked'
      absent: true
      scope: attempt
      label: The test found a vendor
    - kind: log
      source: debug
      contains: 'question shown: '
      absent: true
      scope: attempt
      label: No question
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the waypoint
    - kind: log
      source: debug
      contains: via chat
      absent: true
      scope: attempt
      label: The waypoint is on the map, not only a chat line
    notes: The "test command:" line comes from the command itself and proves nothing; the auto line is
      the proof, and the accepted line after it shows the waypoint was set. The wording "... to sell items and free bag space." is covered by unit tests.
  - id: cv.s12.33
    title: Trigger an automatic waypoint for a trainer
    setup: Question mode is automatic from check 29. You have a profession below its skill cap. Skip if
      you have none.
    action:
      kind: manual
      text: Press Run. It switches Professions off and on and types |cff99ccff/cvn trade 300|r, so any
        profession is near its cap. Check 35 sets the profession threshold back.
      commands:
      - /cvn trade off
      - /cvn trade on
      - /cvn trade 300
    expect: The waypoint is set at once. The text says "... to train <profession>." Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: 'auto: '
      scope: attempt
      label: An automatic waypoint was set
    notes: 'Player step. Chat wording: the "to train" text is not in the log. The auto line does not name
      the kind, so a low reagent could also write it. Reagent and trainer lines stay apart only by the
      text.'
  - id: cv.s12.34
    title: Pick 5 to 10 shipped reagent vendors in cities and camps
    action:
      kind: manual
      text: Pick 5 to 10 shipped reagent vendors in cities and camps. Set the waypoint, go there and open
        each.
    expect: Each vendor stands where the waypoint says and sells the reagent. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: merchant window opened
      scope: attempt
      label: A merchant window opened
    notes: Player step. Where a vendor stands is only visible in the game. The merchant line proves the
      window opened.
  - id: cv.s12.35
    title: Type the default reagent threshold back
    action:
      kind: manual
      text: 'Press Run to set everything back: |cff99ccff/cvn reagent 5|r, |cff99ccff/cvn choice ask|r,
        |cff99ccff/cvn trade 10|r and |cff99ccff/cvn reagents on|r.'
      commands:
      - /cvn reagent 5
      - /cvn choice ask
      - /cvn trade 10
      - /cvn reagents on
    expect: Chat shows the reagent threshold 5. Press Pass.
    verify:
    - player
    notes: 'Player step. Cleanup: the section changes the reagent threshold (10, 40), the question mode
      (auto), the profession threshold (300) and the Reagents warning. Checks 37 to 39 read the saved
      values.'
  - id: cv.s12.36
    title: Read the watched reagents after learning Portals
    setup: Optional. You learned Portals in check 4 and did not reload.
    action:
      kind: manual
      text: Optional, the Mage from check 4; press Skip otherwise. Nothing to type.
    expect: The addon now watches Rune of Portals.
    verify:
    - assertions
    auto: true
    timeout: 30
    call:
      addon: ClosestVendor
      entry: reagents
      args:
      - 17032
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.reagents
      op: ge
      value: 0
      label: Rune of Portals is watched
    notes: Reads the watched reagents without a reload, which check 4 asked for. The entry returns a number
      once the reagent is watched, even 0. Class step.
  - id: cv.s12.37
    title: Check the reagent threshold is back at 5
    action:
      kind: manual
      text: Nothing to type. CheckThat reads the saved reagent threshold.
    expect: The reagent threshold is 5.
    verify:
    - assertions
    auto: true
    timeout: 30
    call:
      addon: ClosestVendor
      entry: config
      args:
      - reagentThreshold
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.config
      op: eq
      value: 5
      label: The reagent threshold is 5
    notes: Reads the value saved by check 35.
  - id: cv.s12.38
    title: Check the question mode is Ask again
    action:
      kind: manual
      text: Nothing to type. CheckThat reads the saved question mode.
    expect: The question mode is ask.
    verify:
    - assertions
    auto: true
    timeout: 30
    call:
      addon: ClosestVendor
      entry: config
      args:
      - vendorMode
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.config
      op: eq
      value: ask
      label: The question mode is ask
    notes: Reads the value saved by check 35.
  - id: cv.s12.39
    title: Check the profession threshold is back at 10
    action:
      kind: manual
      text: Nothing to type. CheckThat reads the saved profession threshold.
    expect: The profession threshold is 10.
    verify:
    - assertions
    auto: true
    timeout: 30
    call:
      addon: ClosestVendor
      entry: config
      args:
      - tradeThreshold
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.config
      op: eq
      value: 10
      label: The profession threshold is 10
    notes: Reads the value saved by check 35.
- id: s13
  title: Status window, instances and auction house
  steps:
  - id: cv.s13.1
    title: Open settings with a slash command
    action:
      kind: manual
      text: Open settings with a slash command.
    expect: The settings tree opens (standalone fallback in the Settings and appearance acceptance section).
      Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: the settings pages and their order. No debug line proves it.'
  - id: cv.s13.2
    title: Open settings with the cog
    action:
      kind: manual
      text: Open settings with the cog.
    expect: It opens the same ordered tree. Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: the settings pages and their order. No debug line proves it.'
  - id: cv.s13.3
    title: Open settings from Options > AddOns
    action:
      kind: manual
      text: Open settings from Options > AddOns.
    expect: It opens the same ordered tree. Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: the settings pages and their order. No debug line proves it.'
  - id: cv.s13.4
    title: Open the Home page
    action:
      kind: manual
      text: Open the Home page.
    expect: It keeps all warning switches and the bag, durability and profession thresholds. Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: the settings pages and their order. No debug line proves it.'
  - id: cv.s13.5
    title: Open the Appearance page
    action:
      kind: manual
      text: Open the Appearance page.
    expect: It has a Status window section. Lock position comes first, then independent scale, background
      and text controls, a color picker action and six group visibility selectors (Ammo, Reagents, Supplies,
      Bags, Durability, Professions). Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: the settings pages and their order. No debug line proves it.'
  - id: cv.s13.6
    title: Use a class without ammo or reagents
    setup: A class without ammo or reagents, such as a Warrior.
    action:
      kind: manual
      text: Warrior only; press Skip otherwise. Open the Home and Appearance pages and look at the Ammo
        and Reagents groups.
    expect: Those groups are disabled with an explanation, and their item controls do not act. Press Pass.
    verify:
    - player
    notes: 'Player step. Drawing: disabled controls and their explanation. No debug line proves it. Warrior
      (or another class without ammo or reagents) only.'
  - id: cv.s13.7
    title: Set every row to the default and have nothing low
    setup: Every row group is at its default and no warning is due.
    action:
      kind: manual
      text: Make sure no status window line is low and every row group is at its default.
    expect: The status window is not shown.
    verify:
    - assertions
    auto: true
    timeout: 30
    call:
      addon: ClosestVendor
      entry: window
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.window
      op: eq
      value: hidden
      label: The status window is hidden

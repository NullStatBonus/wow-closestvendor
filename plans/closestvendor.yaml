ct: 1
kind: plan
addon: ClosestVendor
title: 'ClosestVendor in-game test plan: core'
preamble: |-
  These checks cover what the automated tests cannot: the real game. ClosestVendor has three plans, and all three run before each release, on WoW Forever and on Classic Era:
  |cff99ccffplans/closestvendor.yaml|r (this one: warnings, routes, holds, learning, buying, the report and find), |cff99ccffplans/closestvendor.ui.yaml|r (status window, visuals and settings) and |cff99ccffplans/closestvendor.addons.yaml|r (TomTom, WaypointUI, NorgannonDB and sound packs).
  Import one plan, finish it and export it (|cff99ccff/ct export|r, optionally |cff99ccff/cvn debug off|r, then |cff99ccff/reload|r) before you import the next: a run uses the last plan imported.

  Start with the default thresholds and at least 3 free bag slots. The steps that change a threshold type the default back later.
  A step for one class, a profession or another addon says so at the start: press Skip when your character does not have it.
  Each step has one player action. An automatic step records its own result from the debug log or a CheckThat entry. A player step shows what to look at; the log lines are for the reviewer.
logs:
  debug:
    global: ClosestVendorCharDB
    path: log.entries
    format: entries
    cap: 1000
  facts:
    global: CheckThatDB
    path: global.facts
    format: strings
    cap: 300
  errors:
    global: CheckThatDB
    path: global.errors
    format: strings
    quiet: true
    cap: 100
requirements:
  addon-loaded:
    text: ClosestVendor is loaded
    probe: addon-loaded
    name: ClosestVendor
offline:
  toc: wow-closest-vendor/ClosestVendor/ClosestVendor_Vanilla.toc
  steps:
  - event:
      name: ADDON_LOADED
      args:
      - ClosestVendor
  - event:
      name: PLAYER_LOGIN
  - label: The fake client gives no version, so the version entry returns nothing
    call:
      addon: ClosestVendor
      entry: version
    returns: []
  - label: The bag threshold is 2 by default
    call:
      addon: ClosestVendor
      entry: setting
      args:
      - bags.threshold
    returns:
    - '2'
  - label: The CheckThat integration is working
    call:
      addon: ClosestVendor
      entry: integration
    returns:
    - working
  - label: An unknown setting key returns nothing
    call:
      addon: ClosestVendor
      entry: setting
      args:
      - no.such.key
    returns: []
  - label: No warning request is open after login, so the active entry returns nothing
    call:
      addon: ClosestVendor
      entry: active
    returns: []
  - label: A fresh account has learned no vendor yet
    call:
      addon: ClosestVendor
      entry: learned
      args:
      - vendors
    returns:
    - 0
  - label: An npc id that is not learned returns nothing
    call:
      addon: ClosestVendor
      entry: learned
      args:
      - vendors
      - 999999
    returns: []
  - label: An unknown kind returns nothing
    call:
      addon: ClosestVendor
      entry: learned
      args:
      - bankers
    returns: []
  - label: An npc this character never saw has no standing
    call:
      addon: ClosestVendor
      entry: standing
      args:
      - 999999
    returns: []
  - label: The fake client has no TomTom, WaypointUI or game waypoint, so the waypoint is a chat line
    call:
      addon: ClosestVendor
      entry: nav
    returns:
    - chat
  - label: The fake client has no NorgannonDB
    call:
      addon: ClosestVendor
      entry: external
    returns:
    - not found
  - label: The status window scale is 100 by default
    call:
      addon: ClosestVendor
      entry: config
      args:
      - hudScale
    returns:
    - '100'
  - label: A row group nobody changed shows only while low
    call:
      addon: ClosestVendor
      entry: config
      args:
      - hudRow.bags
    returns:
    - low
  - label: A name that is not a setting returns nothing
    call:
      addon: ClosestVendor
      entry: config
      args:
      - no.such.setting
    returns: []
  - label: The status window has not drawn yet (its redraw waits for a timer), so the window entry returns nothing
    call:
      addon: ClosestVendor
      entry: window
    returns: []
  - label: The window entry for one row group returns nothing before the first draw too
    call:
      addon: ClosestVendor
      entry: window
      args:
      - supplies
    returns: []
  - label: No warning check has run yet, so the reagents entry returns nothing
    call:
      addon: ClosestVendor
      entry: reagents
    returns: []
sections:
- id: s0
  title: Setup
  intro: Copy ClosestVendor/ into the AddOns folder and log in. The reviewer reads ClosestVendorCharDB (character) and ClosestVendorDB (account) in the SavedVariables folder.
  steps:
  - id: cv.s0.1
    title: Check the ClosestVendor version
    auto: true
    action:
      kind: manual
      text: CheckThat reads the ClosestVendor version.
    expect: The ClosestVendor version is 1.11.3 or newer. If the step fails, copy ClosestVendor 1.11.3 into the game again.
    verify:
    - assertions
    call:
      addon: ClosestVendor
      entry: version
    timeout: 30
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.version
      op: ge
      value: 11103
      label: ClosestVendor is 1.11.3 or newer
    notes: The entry returns major*10000 + minor*100 + patch, so 1.11.3 is 11103. It reads a fact, not the debug log, so it runs before debug logging is on. CheckThat too old to offer entries leaves this step unverified.
  - id: cv.s0.2
    title: Turn on Lua errors and debug logging, then reload
    action:
      kind: manual
      text: Press Run. It turns on Lua error popups (|cff99ccff/console scriptErrors 1|r) and the debug log (|cff99ccff/cvn debug on|r), then reloads (|cff99ccff/reload|r).
      commands:
      - "/console scriptErrors 1"
      - "/cvn debug on"
      - "/reload"
    expect: The game reloads with no Lua error popup, and the debug log keeps recording after the reload.
    verify:
    - assertions
    auto: true
    reload: after_action
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: debug log turned on
      - contains: "---- login ----"
      scope: attempt
      label: The debug log turned on and still records after the reload
    notes: The login marker comes after the reload, so the Run command alone cannot pass the step. A Lua error popup is also caught by the last step of the plan, which reads CheckThat's error list.
- id: s1
  title: 'Selling: warning, waypoint and vendor'
  intro: One real sell warning from the question to the vendor. Have at least 3 free bag slots, and stand where a vendor the addon does not know is in reach.
  steps:
  - id: cv.s1.1
    title: 'WoW Forever: make the sell warning due and click Yes'
    clients:
    - forever-camelot
    setup: At least 3 free bag slots, so the default bag threshold 2 leaves the sell warning off before the step. No question is open.
    action:
      kind: manual
      text: Press Run. It picks the game waypoint (|cff99ccff/cvn nav native|r) and makes the sell warning due (|cff99ccff/cvn bags 200|r). Click |cffffd100Yes|r on the sell question (|cffffd100This map|r or |cffffd100Closest|r when it names two vendors).
      commands:
      - "/cvn nav native"
      - "/cvn bags 200"
    expect: The game waypoint to the vendor shows on the map and is tracked. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: trigger go sell
      - contains: 'question shown: sell, '
      - pattern: 'accepted: .+ via native'
      scope: attempt
      label: The sell warning asked, and Yes set the game waypoint
    notes: 'Player step. Drawing: the map waypoint. A real warning, not a test command. The game waypoint is picked even with TomTom or WaypointUI installed; the addons plan checks those. Check 6.1 sets the waypoint choice back to Automatic.'
  - id: cv.s1.2
    title: 'Classic Era: make the sell warning due and click Yes'
    clients:
    - classic-era
    setup: At least 3 free bag slots, so the default bag threshold 2 leaves the sell warning off before the step. No question is open.
    action:
      kind: manual
      text: 'Press Run (|cff99ccff/cvn bags 200|r) so the sell warning is due. Click |cffffd100Yes|r on the sell question (|cffffd100This map|r or |cffffd100Closest|r when it names two vendors). With TomTom installed, the TomTom arrow takes the waypoint instead: press Run, click |cffffd100Yes|r, then press Skip (the addons plan checks TomTom).'
      commands:
      - "/cvn bags 200"
    expect: A chat line names the vendor, its zone and its coordinates. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: trigger go sell
      - contains: 'question shown: sell, '
      - pattern: 'accepted: .+ via chat'
      scope: attempt
      label: The sell warning asked, and Yes gave the chat line
    notes: 'Player step. Drawing: the chat line. Classic Era has no game waypoint, so without TomTom the chat line is the waypoint. With TomTom, Run and Yes still set the waypoint that check 1.3 clears; only this step is skipped.'
  - id: cv.s1.3
    title: Open a vendor the addon does not know
    setup: The waypoint from check 1.1 or 1.2 is set. Stand at a vendor no character on this account has opened (for example in a zone you have not visited).
    action:
      kind: manual
      text: Open the vendor's window and close it.
    expect: The waypoint goes away when the window opens. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: merchant window opened
      - contains: 'waypoint cleared: a merchant window opened'
      scope: attempt
      label: Opening the vendor window cleared the waypoint
    - kind: log
      source: debug
      pattern: 'vendor learned: .+ %(npc %d+%), new'
      scope: attempt
      label: The vendor was learned as new
    - kind: log
      source: debug
      contains: it was not in the search pool
      diagnostic: true
      scope: attempt
      label: The vendor was new to the search (not shipped, not from NorgannonDB, not learned before)
    notes: 'Player step. Drawing: the waypoint going away. The step has no Run button; check 2.1 types the bag default back. Check 6.2 asks for this vendor after a reload, without opening its window.'
- id: s2
  title: Other warnings
  intro: Each warning once, from a real threshold. Steps for one class or a profession say so; press Skip otherwise, before the step's timeout ends, because an automatic step records a fail when its time runs out. Each step types back the thresholds the steps before it changed.
  steps:
  - id: cv.s2.1
    title: Make the repair warning due
    setup: Wear at least one item between 21% and 99% durability and nothing at 20% or below. No question is open.
    action:
      kind: manual
      text: Press Run. It types the bag default back (|cff99ccff/cvn bags 2|r) and makes the repair warning due (|cff99ccff/cvn dur 100|r). Leave the repair question open.
      commands:
      - "/cvn bags 2"
      - "/cvn dur 100"
    expect: The repair question appears.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: trigger go repair
      - contains: 'question shown: repair, '
      scope: attempt
      label: The repair warning went out and asked
    notes: The bag default ends the sell warning from section 1. Any item below 100% durability is below the threshold 100. With nothing at 20% or below, the default 20 typed back by the next steps ends the warning.
  - id: cv.s2.2
    title: 'Hunter: make the ammo warning due'
    setup: A Hunter with a bow, crossbow or gun equipped and more than 200 arrows or bullets (the default threshold).
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Press Run. It types the default durability threshold back (|cff99ccff/cvn dur 20|r) and raises the ammo threshold (|cff99ccff/cvn ammo 2000|r).
      commands:
      - "/cvn dur 20"
      - "/cvn ammo 2000"
    expect: The repair question closes, and the arrow or bullet question appears.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: trigger clear repair
      - contains: trigger go ammo (
      - pattern: 'question shown: [ab]%a+, '
      scope: attempt
      label: The repair warning ended, then the ammo warning asked
    notes: Class step. The question kind is arrow or bullet, after the ammo equipped; no other question kind starts with a or b. With more than 200 ammo, the default typed back in the next steps ends the warning.
  - id: cv.s2.3
    title: 'Reagent class: make a reagent warning due'
    setup: A class with reagents (for example a Mage) that knows a spell using one and carries 6 to 39 of that reagent.
    action:
      kind: manual
      text: Reagent class only; press Skip otherwise. Press Run. It types the durability and ammo defaults back (|cff99ccff/cvn dur 20|r, |cff99ccff/cvn ammo 200|r) and raises the reagent threshold (|cff99ccff/cvn reagent 40|r).
      commands:
      - "/cvn dur 20"
      - "/cvn ammo 200"
      - "/cvn reagent 40"
    expect: The reagent question appears and names the reagent and the count left.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'trigger go reagent '
      - contains: 'question shown: reagent '
      scope: attempt
      label: The reagent warning went out and asked
    notes: Class step. 40 is the highest reagent threshold, so 39 or fewer is low. With 6 or more, the default 5 typed back in the next step ends the warning.
  - id: cv.s2.4
    title: Make the food warning due
    setup: Carry 6 to 40 food items (cooked, looted or conjured all count).
    action:
      kind: manual
      text: Press Run. It types the durability, ammo and reagent defaults back (|cff99ccff/cvn dur 20|r, |cff99ccff/cvn ammo 200|r, |cff99ccff/cvn reagent 5|r) and raises the food threshold (|cff99ccff/cvn food 40|r).
      commands:
      - "/cvn dur 20"
      - "/cvn ammo 200"
      - "/cvn reagent 5"
      - "/cvn food 40"
    expect: A question about the closest food vendor appears. A Mage who knows Conjure Food gets a reminder to conjure food instead.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log
      source: debug
      pattern: "[y:] food[, ]"
      scope: attempt
      label: 'The food question was asked (question shown: supply food) or a conjure reminder was given (reminder: food)'
    - kind: log
      source: debug
      contains: 'question shown: supply food, '
      diagnostic: true
      scope: attempt
      label: The food question was asked (not for a Mage who knows Conjure Food)
    - kind: log
      source: debug
      contains: 'reminder: food ('
      diagnostic: true
      scope: attempt
      label: A Mage who knows Conjure Food was reminded instead
    notes: 'The pattern matches "question shown: supply food, " and "reminder: food (", the two outcomes the player sees; "trigger go food (" (the request alone) and "pet food" do not match. The two diagnostic lines tell the reviewer which one happened. Leave the question open; check 2.6 types the food default back.'
  - id: cv.s2.5
    title: Open a profession trainer
    setup: A character with a crafting or gathering profession. Stand at a trainer of that profession.
    action:
      kind: manual
      text: A character with a profession only; press Skip otherwise. Open the trainer's window and close it.
    expect: The addon learns the trainer and the professions it teaches, and logs the services the window lists.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: trainer window opened
      - contains: 'trainer learned: '
      scope: attempt
      label: The trainer was learned when its window opened
    - kind: log
      source: debug
      pattern: 'trainer services: %d+ listed; filters '
      scope: attempt
      label: The trainer probe logged the services the window lists
    - kind: log
      source: debug
      pattern: 'trainer learned: .+ %(npc %d+%), new'
      diagnostic: true
      scope: attempt
      label: The trainer was new to this account
    notes: The line names the trainer, its npc id, new, updated or unchanged, and what it teaches. Opening the window also makes the profession known, so check 2.6 can ask about it. The services line is the trainer probe (spec diagnostics); it is written once per window with the debug log on.
  - id: cv.s2.6
    title: Make the trainer warning due, then craft or gather
    setup: The profession from check 2.5, below its current cap, at the level the next tier needs.
    action:
      kind: manual
      text: A character with a profession only; press Skip otherwise. Press Run. It types the food default back (|cff99ccff/cvn food 5|r) and raises the profession threshold (|cff99ccff/cvn trade 300|r). Then craft one item or gather once with that profession. When the trainer question shows, click |cffffd100No|r.
      commands:
      - "/cvn food 5"
      - "/cvn trade 300"
    expect: The trainer question names the profession, the points left and a trainer.
    verify:
    - assertions
    auto: true
    timeout: 240
    assertions:
    - kind: log
      source: debug
      contains: 'question shown: trainer for '
      scope: attempt
      label: The trainer question was asked
    notes: With threshold 300 every profession below its cap is near it, so the next skill change or craft asks (Professions.lua). The food default ends the food request from check 2.4, which would hold the profession check back. Check 3.1 types the profession default back.
- id: s3
  title: Waiting for combat and dungeons
  intro: Do this section near a dungeon entrance with a monster to fight. A warning that comes due in a fight or a dungeon waits, and asks after it.
  steps:
  - id: cv.s3.1
    title: Make the sell warning due during a fight
    setup: Start a fight near a dungeon entrance. The Run button hides in combat, so copy each line from its box into chat, in order.
    action:
      kind: manual
      text: During the fight, enter |cff99ccff/cvn food 5|r, |cff99ccff/cvn trade 10|r and |cff99ccff/cvn bags 200|r from their boxes, in that order.
      commands:
      - "/cvn food 5"
      - "/cvn trade 10"
      - "/cvn bags 200"
    expect: No question appears during the fight.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log
      source: debug
      contains: 'trigger held in combat: sell'
      scope: attempt
      label: The sell warning waited for the fight
    - kind: log
      source: debug
      contains: 'question shown: sell, '
      absent: true
      diagnostic: true
      scope: attempt
      label: No sell question during the fight
    notes: 'The first two lines type the food and profession defaults back. Entered before the fight, /cvn bags 200 asks at once and the hold line is missing, so the step fails. Check 2.1 typed the bag default back, so the sell warning starts from off. The absent check is diagnostic: the fight may end inside the step and the question then comes.'
  - id: cv.s3.2
    title: End the fight
    action:
      kind: manual
      text: Finish the fight. Leave the sell question open when it appears.
    expect: The sell question appears after the fight ends.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: event PLAYER_REGEN_ENABLED
      - contains: 'question shown: sell, '
      scope: attempt
      label: The sell question came after the fight ended
  - id: cv.s3.3
    title: With the sell question open, enter the dungeon
    setup: The sell question from check 3.2 is open. The bag threshold is still 200.
    action:
      kind: manual
      text: Leave the sell question open and walk into the dungeon.
    expect: The question closes, and nothing is asked inside.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'question withdrawn: the player changed zone'
      - contains: 'trigger held in an instance: sell'
      scope: attempt
      label: The question was withdrawn at the zone change, and the warning waits inside
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.active
      op: eq
      value: sell
      label: The sell request is the open one when the step opens
    notes: 'A real warning, not a test command: a test question is never withdrawn. The active entry runs when the step opens, with the sell question from check 3.2 still open.'
    call:
      addon: ClosestVendor
      entry: active
  - id: cv.s3.4
    title: Leave the dungeon
    setup: You are inside the dungeon from check 3.3, with the sell warning still due.
    action:
      kind: manual
      text: Leave the dungeon. Leave the sell question open when it appears.
    expect: The sell question is asked again.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - pattern: 'instance: %a+ %-> none'
      - contains: 'question shown: sell, '
      scope: attempt
      label: Outside again, the sell question was asked
    notes: Check 4.1, 4.2 or 5.1 types the bag default back, which closes the question.
- id: s4
  title: Buying at a merchant
  intro: A Hunter buys ammo at once (the default); a class with reagents (for example a Mage) answers the reagent question. Other classes press Skip on each step of this section, before the step's timeout ends.
  steps:
  - id: cv.s4.1
    title: 'Reagent class: leave the purchase question open and close the merchant'
    setup: 'A class with reagents, fewer than 20 of a watched reagent, enough gold and room in your bags for at least one full purchase (one stack).'
    action:
      kind: manual
      text: Reagent class only; press Skip otherwise. Press Run. It types the bag default back (|cff99ccff/cvn bags 2|r) and turns reagent buying on (|cff99ccff/cvn reagentbuy on|r). Open a vendor that sells your reagent, leave the purchase question open and close the vendor window.
      commands:
      - "/cvn bags 2"
      - "/cvn reagentbuy on"
    expect: The purchase question shows, closes with the vendor window, and nothing is bought.
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'reagent buy: asked'
      - contains: 'purchase question closed with the merchant: reagents'
      scope: attempt
      label: The reagent question showed and closed with the merchant
    - kind: log
      source: debug
      contains: 'reagent buy: bought '
      absent: true
      scope: attempt
      label: Nothing was bought
    notes: 'Class step (reagents). Reagent buying asks first by default, so this step covers the purchase question and its close with the merchant. Ammo buys at once by default, which check 4.2 covers. The absent check waits the whole timeout.'
  - id: cv.s4.2
    title: 'Open the vendor: a Hunter buys at once, a reagent class clicks Yes'
    setup: 'Enough gold. Hunter: a bow, crossbow or gun and room in the quiver or ammo pouch for at least one full purchase (one stack). Reagent class: the vendor from check 4.1 and fewer than 20 of a watched reagent.'
    action:
      kind: manual
      text: Hunter or reagent class only; press Skip otherwise. Press Run. It types the bag default back (|cff99ccff/cvn bags 2|r) and keeps ammo buying at its default, buying at once (|cff99ccff/cvn buy auto|r). Open a vendor that sells your ammo or reagent. A reagent class clicks |cffffd100Yes|r on the purchase question; a Hunter clicks nothing.
      commands:
      - "/cvn bags 2"
      - "/cvn buy auto"
    expect: 'Hunter: the addon buys ammo as the window opens, with no question. Reagent class: Yes buys the reagents.'
    verify:
    - assertions
    auto: true
    timeout: 180
    assertions:
    - kind: log
      source: debug
      pattern: "%a+ buy: bought "
      scope: attempt
      label: The addon bought ammo or reagents
    - kind: log
      source: debug
      contains: 'ammo buy: asked'
      absent: true
      scope: attempt
      label: Ammo buying did not ask first (the default buys at once)
    - kind: log
      source: debug
      contains: " buy: FAILED"
      absent: true
      scope: attempt
      label: No purchase failed
    - kind: log
      source: debug
      contains: 'ammo buy: bought '
      diagnostic: true
      scope: attempt
      label: 'Hunter: ammo was bought at once'
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'reagent buy: asked'
      - contains: 'reagent buy: bought '
      diagnostic: true
      scope: attempt
      label: 'Reagent class: the question showed, then Yes bought'
    notes: 'Class step. For a Hunter this is the default purchase path: buying at once as the merchant opens. A bought line counts the purchases the game took; the game can still refuse one without an error, so checks 4.3 and 4.4 read what you carry afterwards. The diagnostic lines tell the reviewer which class path ran.'
  - id: cv.s4.3
    title: 'Hunter: open the vendor once more'
    setup: The ammo you bought in check 4.2 is in the quiver or ammo pouch.
    action:
      kind: manual
      text: Hunter only; press Skip otherwise. Close the vendor's window and open it again.
    expect: 'The addon buys nothing more: the quiver or ammo pouch is full.'
    verify:
    - assertions
    auto: true
    timeout: 90
    assertions:
    - kind: log
      source: debug
      contains: 'ammo buy: less than one purchase of room'
      scope: attempt
      label: The ammo storage is full now, so the purchase filled it
    - kind: log
      source: debug
      contains: 'ammo buy: bought '
      absent: true
      scope: attempt
      label: Nothing was bought
    notes: Class step (Hunter). The room line is computed from the ammo you carry, so with room for a full purchase before check 4.2 it proves the count rose; a bought line alone does not.
  - id: cv.s4.4
    title: 'Reagent class: open the vendor once more'
    setup: The reagents you bought in check 4.2 are in your bags.
    action:
      kind: manual
      text: Reagent class only; press Skip otherwise. Close the vendor's window and open it again.
    expect: 'The addon buys nothing more: each watched reagent is at the target.'
    verify:
    - assertions
    auto: true
    timeout: 90
    assertions:
    - kind: log
      source: debug
      pattern: 'reagent buy: target %d+, money %d+, plan: nothing, cost 0, short: nil'
      scope: attempt
      label: Every watched reagent is at the target now, so the purchase raised the count
    - kind: log
      source: debug
      contains: 'reagent buy: bought'
      absent: true
      scope: attempt
      label: Nothing was bought
    notes: Class step. The plan line is computed from the reagents in your bags, so an empty plan proves the count rose to the target (20 by default).
- id: s5
  title: Report and find
  steps:
  - id: cv.s5.1
    title: Open the debug report
    action:
      kind: manual
      text: Press Run. It types the bag default back (|cff99ccff/cvn bags 2|r) and opens the debug report (|cff99ccff/cvn log|r).
      commands:
      - "/cvn bags 2"
      - "/cvn log"
    expect: 'A window opens with the report selected for copying. Its first lines name the addon version and the game, and lines further down say "color picker: available, settings button: available" and "CheckThat: working". The newest log lines follow. Press Pass.'
    verify:
    - player
    notes: 'Player step. Drawing: the copyable report window and its header, read on the real client: the color picker and settings button lines say what this client has. /cvn log writes no log line; the "CheckThat:" header line is the same text as the integration entry, which the offline block checks. /cvn bags 2 ends the sell warning from section 3 for every class.'
  - id: cv.s5.2
    title: Find a drink seller and pick one
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn find juice|r). If a menu of items opens, pick one drink. In the seller list that opens, pick a seller.
      commands:
      - "/cvn find juice"
    expect: Chat says the sellers sell drink in general. A list opens at the mouse with the nearest seller marked, each with its zone and distance. After the pick, a waypoint is set to that seller. Press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'find: "juice", '
      - pattern: 'find: .+ looked up as '
      - contains: 'find: seller list for '
      - contains: 'find: chosen '
      - pattern: 'accepted: .+ via '
      scope: attempt
      label: The search found drinks, listed sellers, and the pick got a waypoint
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the waypoint
    notes: 'Player step. Drawing: the menus at the mouse and the marked nearest seller. The menus come from the find command itself, so the picks are part of its action.'
- id: s6
  title: Finish
  steps:
  - id: cv.s6.1
    title: Put the buying and waypoint settings back, then reload
    action:
      kind: manual
      text: Press Run. It turns reagent buying off (|cff99ccff/cvn reagentbuy off|r), sets the waypoint choice back to Automatic (|cff99ccff/cvn nav auto|r) and reloads (|cff99ccff/reload|r).
      commands:
      - "/cvn reagentbuy off"
      - "/cvn nav auto"
      - "/reload"
    expect: The game reloads.
    verify:
    - assertions
    auto: true
    reload: after_action
    timeout: 120
    assertions:
    - kind: log
      source: debug
      contains: "---- login ----"
      scope: attempt
      label: The game reloaded
    notes: 'Cleanup the player sees: sections 1 and 4 changed these settings. Each command is harmless when the setting is already at its default.'
  - id: cv.s6.2
    title: After the reload, ask for a sell vendor next to the vendor from check 1.3
    setup: Stand next to the vendor you opened in check 1.3. Do not open its window.
    action:
      kind: manual
      text: Press Run (|cff99ccff/cvn test sell|r).
      commands:
      - "/cvn test sell"
    expect: The test question names the vendor from check 1.3. Click |cffffd100No|r, then press Pass.
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'test command: sell'
      - contains: 'question shown: sell, '
      scope: attempt
      label: The sell question was asked after the reload
    - kind: log
      source: debug
      contains: merchant window opened
      absent: true
      scope: attempt
      label: No merchant window opened, so the search used the vendors loaded at login
    notes: 'Player step. Drawing: the vendor name in the dialog. The vendor stands next to you, so it is the closest one. Opening a merchant window adds that vendor to the search again, so the step asks without opening it: only the vendor saved before the reload of check 6.1 can name it.'
  - id: cv.s6.3
    title: No Lua error from ClosestVendor during the run
    action:
      kind: manual
      text: Nothing to do. CheckThat reads its list of Lua errors for this run.
    expect: ClosestVendor raised no Lua error during this plan.
    verify:
    - assertions
    auto: true
    timeout: 15
    assertions:
    - kind: log
      source: errors
      pattern: "%[ClosestVendor%]"
      absent: true
      scope: session
      label: ClosestVendor raised no Lua error in this run
    notes: 'Scope session reads CheckThat''s whole error list. CheckThat keeps an error only while a run is open, across /reload, up to the last 100, so the check covers every step of this run. CheckThat 0.21.0 has no scope for one run, and starting a run keeps the list: a ClosestVendor error from an earlier run (also of another ClosestVendor plan) fails this step too. When it fails, compare the error time with the start of this run. It passes when the 15 seconds end with no ClosestVendor error in the list. After this step, export the run (/ct export), optionally turn the debug log off (/cvn debug off), and type /reload so the game saves the log.'

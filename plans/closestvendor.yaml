    expect: No errors show and the addon finds no NorgannonDB. The section Artisan without NorgannonDB
      checks the rest.
    verify:
    - assertions
    auto: true
    timeout: 120
    reload: after_action
    assertions:
    - kind: log
      source: debug
      contains: 'NorgannonDB: not found'
      scope: attempt
      label: The addon loaded without NorgannonDB
    - kind: log
      source: errors
      pattern: '%[ClosestVendor%]'
      absent: true
      scope: attempt
      label: No ClosestVendor Lua error
    clients:
    - forever-camelot

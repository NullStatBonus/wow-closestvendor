ct: 1
kind: plan
addon: ClosestVendor
title: ClosestVendor in-game test plan
preamble: 'These checks cover what the automated tests cannot check: the real game.


  Run them on WoW Forever. Run them on Classic Era when you can.


  Run them before a release. Run them after a change to |cff99ccffAdapter.lua|r, |cff99ccffCore.lua|r,
  |cff99ccffReport.lua|r or |cff99ccffOptions.lua|r. Run them when a new game build comes out.


  Tick each item. Write down the client build.


  Each check has one player action, a |cff99ccffCheck:|r line with the result a player sees, and a |cff99ccffLog:|r
  line the reviewer reads in the debug log or |cff99ccffClosestVendorCharDB|r. A line that starts with
  "Note" asks you to record what the game does. Those items are unknown: verify them in game.'
logs:
  debug:
    global: ClosestVendorCharDB
    path: log.entries
    format: entries
    cap: 300
  facts:
    global: CheckThatDB
    path: global.facts
    format: strings
    cap: 300
  errors:
    global: CheckThatDB
    path: global.errors
    format: strings
    quiet: true
    cap: 100
requirements:
  addon-loaded:
    text: ClosestVendor is loaded
    probe: addon-loaded
    name: ClosestVendor
offline:
  toc: wow-closest-vendor/ClosestVendor/ClosestVendor_Vanilla.toc
  steps:
  - event:
      name: ADDON_LOADED
      args:
      - ClosestVendor
  - event:
      name: PLAYER_LOGIN
  - label: The fake client gives no version, so the version entry returns nothing
    call:
      addon: ClosestVendor
      entry: version
    returns: []
  - label: The bag threshold is 2 by default
    call:
      addon: ClosestVendor
      entry: setting
      args:
      - bags.threshold
    returns:
    - '2'
  - label: The CheckThat integration is working
    call:
      addon: ClosestVendor
      entry: integration
    returns:
    - working
  - label: An unknown setting key returns nothing
    call:
      addon: ClosestVendor
      entry: setting
      args:
      - no.such.key
    returns: []
sections:
- id: s0
  title: Setup
  steps:
  - id: cv.s0.1
    title: Check the ClosestVendor version
    auto: true
    action:
      kind: manual
      text: CheckThat reads the ClosestVendor version.
    expect: The ClosestVendor version is 1.11.0 or newer. If the step fails, copy ClosestVendor 1.11.0
      into the game again.
    verify:
    - assertions
    call:
      addon: ClosestVendor
      entry: version
    timeout: 30
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.version
      op: ge
      value: 11100
      label: ClosestVendor is 1.11.0 or newer
    notes: The entry returns major*10000 + minor*100 + patch, so 1.11.0 is 11100. It reads a fact, not
      the debug log, so it runs before debug logging is on. CheckThat too old to offer entries leaves
      this step unverified.
  - id: cv.s0.2
    title: Turn on Lua errors and reload
    action:
      kind: manual
      text: Type |cff99ccff/console scriptErrors 1|r, then |cff99ccff/reload|r.
      commands:
      - /console scriptErrors 1
      - /reload
    expect: No Lua error popup appears, and ClosestVendor is in the AddOns list (Esc, AddOns). Press Pass.
    verify:
    - player
    reload: after_action
  - id: cv.s0.3
    title: 'Optional: install TomTom, and WaypointUI (WoW Forever only)'
    action:
      kind: manual
      text: 'Optional: install TomTom, and WaypointUI (WoW Forever only). The Navigation and Waypoint
        choice sections use them.'
    expect: Both show in the AddOns list. Press Pass.
    verify:
    - player
    clients:
    - forever-camelot
  - id: cv.s0.4
    title: 'Ammo sections: use a ranged class with ammo equipped'
    action:
      kind: manual
      text: 'Ammo sections only: use a hunter, warrior or rogue with a bow, crossbow or gun equipped and
        some ammo in the ammo slot.'
    expect: The ammo shows in the ammo slot. Press Pass.
    verify:
    - player
  - id: cv.s0.5
    title: Turn debug logging on
    action:
      kind: manual
      text: Type |cff99ccff/cvn debug on|r, then |cff99ccff/reload|r.
      commands:
      - /cvn debug on
      - /reload
    expect: After the reload, the debug log still records that it turned on.
    verify:
    - assertions
    reload: after_action
    auto: true
    timeout: 120
    assertions:
    - kind: log
      source: debug
      contains: debug log turned on
      scope: attempt
      label: The debug log records that it turned on
  intro: 'Install: copy |cff99ccffClosestVendor/|r into the AddOns folder and start the game. Every item
    is pass/fail. The tester checks the expected result. The reviewer checks the log lines. After the
    last check, type |cff99ccff/reload|r again so the game saves the log. The reviewer reads |cff99ccffClosestVendorCharDB|r
    in |cff99ccffWTF/Account/<account>/<realm>/<character>/SavedVariables/ClosestVendor.lua|r and |cff99ccffClosestVendorDB|r
    in |cff99ccffWTF/Account/<account>/SavedVariables/ClosestVendor.lua|r.
    A section that says "Setup" lists what only that section needs, such as a class, a profession or an
    addon.'
- id: s1
  title: Settings page and commands
  steps:
  - id: cv.s1.1
    title: Open Esc, Options, AddOns, Closest Vendor and look at Home
    action:
      kind: manual
      text: Open Esc, Options, AddOns, |cffffd100Closest Vendor|r and look at Home.
    expect: 'Home lists the Warnings in order: Bag space, Durability and Professions (each a checkbox
      and a slider), then Ammo, Reagents and Supplies (a checkbox only). Press Pass.'
    verify:
    - player
  - id: cv.s1.2
    title: Look at the pages below Home
    action:
      kind: manual
      text: Look at the pages below Home.
    expect: The pages are Restock, Navigation, Appearance, Advanced and About. Restock holds Ammo, Reagents
      and Supplies. Appearance holds the Notifications, Status window and Sound tabs. Press Pass.
    verify:
    - player
  - id: cv.s1.3
    title: Open the Ammo page as a Hunter
    action:
      kind: manual
      text: Open the Ammo page as a Hunter.
    expect: Below the ammo slider are Buy ammo, Ask before buying and the arrow and bullet dropdowns.
      Press Pass.
    verify:
    - player
  - id: cv.s1.4
    title: Open the Reagents page as a reagent class (for example a Mage)
    action:
      kind: manual
      text: Open the Reagents page as a class that uses reagents (for example a Mage).
    expect: Under the slider is one checkbox for each reagent of your class. Press Pass.
    verify:
    - player
  - id: cv.s1.5
    title: Move a slider, then enter /cvn
    action:
      kind: manual
      text: Move a slider, then enter |cff99ccff/cvn|r.
      commands:
      - /cvn
    expect: '|cff99ccff/cvn|r shows the new slider number. Press Pass.'
    verify:
    - player
  - id: cv.s1.6
    title: Enter /cvn ammo 500 and reopen the page
    action:
      kind: manual
      text: Enter |cff99ccff/cvn ammo 500|r and reopen the page.
      commands:
      - /cvn ammo 500
    expect: The ammo slider is at 500. Press Pass.
    verify:
    - player
  - id: cv.s1.7
    title: Clear a checkbox
    action:
      kind: manual
      text: Clear a checkbox.
    expect: Its slider is greyed out and that trigger stops asking. Press Pass.
    verify:
    - player
  - id: cv.s1.8
    title: Enter /cvn config
    action:
      kind: manual
      text: Enter |cff99ccff/cvn config|r.
      commands:
      - /cvn config
    expect: The settings page opens. Press Pass.
    verify:
    - player
  - id: cv.s1.9
    title: Enter /cvn
    action:
      kind: manual
      text: Enter |cff99ccff/cvn|r.
      commands:
      - /cvn
    expect: It prints readable lines with no stray symbols or missing text. Press Pass.
    verify:
    - player
  - id: cv.s1.10
    title: Enter /cvn help
    action:
      kind: manual
      text: Enter |cff99ccff/cvn help|r.
      commands:
      - /cvn help
    expect: It prints readable lines with no stray symbols or missing text. Press Pass.
    verify:
    - player
  - id: cv.s1.11
    title: Change settings with /cvn and on the page, then reload
    action:
      kind: manual
      text: Change settings on the page and with the Closest Vendor slash command. Type |cff99ccff/reload|r.
      commands:
      - /reload
    expect: The settings stay. Press Pass.
    verify:
    - player
    reload: after_action
  - id: cv.s1.12
    title: Change settings again and restart the game
    action:
      kind: manual
      text: Change settings again and restart the game.
    expect: The settings stay. Press Pass.
    verify:
    - player
- id: s2
  title: The question
  steps:
  - id: cv.s2.1
    title: Enter /cvn test sell
    action:
      kind: manual
      text: Enter |cff99ccff/cvn test sell|r.
      commands:
      - /cvn test sell
    expect: A question shows a vendor name and a zone. Press Pass.
    verify:
    - player
    - assertions
    - reviewer
    assertions:
    - kind: log
      source: debug
      contains: 'test command: sell'
    reviewer: 'The log has "test command: sell". The original plan also expected "reminder: test", but
      Controller.lua logs that line only for "/cvn test remind", so it is not asserted here.'
  - id: cv.s2.2
    title: Enter /cvn test repair
    action:
      kind: manual
      text: Enter |cff99ccff/cvn test repair|r.
      commands:
      - /cvn test repair
    expect: A question shows a vendor name and a zone. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"test command: repair".'
  - id: cv.s2.3
    title: As a Hunter, type /cvn test arrows, then /cvn test bullets
    action:
      kind: manual
      text: As a Hunter, type |cff99ccff/cvn test arrows|r, then |cff99ccff/cvn test bullets|r.
      commands:
      - /cvn test arrows
      - /cvn test bullets
    expect: The last question shows a vendor name and a zone. The reviewer confirms both tests ran. Press
      Pass.
    verify:
    - player
    - reviewer
    reviewer: '"test command: arrows" and "test command: bullets".'
  - id: cv.s2.4
    title: Enter /cvn test sell and click Yes
    action:
      kind: manual
      text: Enter |cff99ccff/cvn test sell|r and click |cffffd100Yes|r.
      commands:
      - /cvn test sell
    expect: A waypoint to the vendor is set (see the Navigation section). Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"accepted: <vendor> via <provider>".'
  - id: cv.s2.5
    title: Enter /cvn test sell, click No, then enter it again and press Esc
    action:
      kind: manual
      text: Enter |cff99ccff/cvn test sell|r and click |cffffd100No|r, then enter it again and press Esc.
      commands:
      - /cvn test sell
    expect: Nothing happens after either answer. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"question declined: sell".'
  - id: cv.s2.6
    title: Fill your bags to the threshold, then change your bags again
    action:
      kind: manual
      text: Fill your bags to the threshold (default 2 free slots or fewer), then change your bags again.
    expect: The sell question appears once and does not repeat. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: 'one "question shown: sell" line.'
  - id: cv.s2.7
    title: Wear one item below the durability threshold (default 20%)
    action:
      kind: manual
      text: Wear one item below the durability threshold (default 20%).
    expect: The repair question appears once. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"question shown: repair".'
  - id: cv.s2.8
    title: Click Yes on the repair question
    action:
      kind: manual
      text: Click |cffffd100Yes|r on the repair question.
    expect: Navigation starts to the vendor named in the question. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"accepted: <vendor> via <provider>".'
  - id: cv.s2.9
    title: Click No on a real question, then sell or repair
    action:
      kind: manual
      text: Click |cffffd100No|r on a real question, then sell or repair.
    expect: The addon does not ask again until the condition clears, then the question comes back. Press
      Pass.
    verify:
    - player
    - reviewer
    reviewer: '"question declined: sell".'
  - id: cv.s2.10
    title: Open a question, then sell or repair while it is open
    action:
      kind: manual
      text: Open a question, then sell or repair while it is open.
    expect: The question closes by itself. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"request released:" line.'
  - id: cv.s2.11
    title: Make the repair and the sell condition true together
    action:
      kind: manual
      text: Make the repair and the sell condition true together.
    expect: The repair question comes first. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"question shown: repair" comes before any sell question.'
  - id: cv.s2.12
    title: Meet a condition during combat
    action:
      kind: manual
      text: Meet a condition during combat.
    expect: No question appears in combat. Press Pass.
    verify:
    - player
    - reviewer
    - assertions
    reviewer: '"trigger" line with combat=true.'
    assertions:
    - kind: log
      source: debug
      contains: combat=true
      diagnostic: true
  - id: cv.s2.13
    title: End combat with the condition still true
    action:
      kind: manual
      text: End combat with the condition still true.
    expect: The question appears after combat ends. Press Pass.
    verify:
    - player
    - reviewer
    - assertions
    reviewer: '"trigger" line with combat=false.'
    assertions:
    - kind: log
      source: debug
      contains: combat=false
      diagnostic: true
- id: s3
  title: Navigation
  steps:
  - id: cv.s3.1
    title: With TomTom, trigger a question and click Yes
    action:
      kind: manual
      text: With TomTom, trigger a question and click |cffffd100Yes|r.
    expect: The arrow points at the vendor. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"accepted: <vendor> via <provider>".'
  - id: cv.s3.2
    title: On WoW Forever with WaypointUI, trigger a question and click Yes
    action:
      kind: manual
      text: On WoW Forever with WaypointUI, trigger a question and click |cffffd100Yes|r.
    expect: The destination shows. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"accepted: <vendor> via <provider>".'
  - id: cv.s3.3
    title: On WoW Forever with neither addon, trigger a question and click Yes
    action:
      kind: manual
      text: On WoW Forever with neither addon, trigger a question and click |cffffd100Yes|r.
    expect: The map waypoint shows and is tracked. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"accepted: <vendor> via <provider>".'
  - id: cv.s3.4
    title: On Classic Era with neither addon, trigger a question and click Yes
    action:
      kind: manual
      text: On Classic Era with neither addon, trigger a question and click |cffffd100Yes|r.
    expect: A chat line shows the vendor, the zone and the coordinates. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"accepted: <vendor> via <provider>".'
  - id: cv.s3.5
    title: With TomTom, set a waypoint and open any vendor window
    action:
      kind: manual
      text: With TomTom, set a waypoint and open any vendor window.
    expect: The arrow goes away. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"merchant window opened".'
  - id: cv.s3.6
    title: With WaypointUI, set a waypoint and arrive at the vendor
    action:
      kind: manual
      text: With WaypointUI, set a waypoint and arrive at the vendor.
    expect: The destination goes away. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"merchant window opened".'
  - id: cv.s3.7
    title: Enter /cvn log
    action:
      kind: manual
      text: Enter |cff99ccff/cvn log|r.
      commands:
      - /cvn log
    expect: The report names the navigation method used. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: 'the report line "navigation: <provider> (preference <choice>)".'
- id: s4
  title: Vendors and learning
  steps:
  - id: cv.s4.1
    title: Open a repair vendor the addon does not know, then test repair
    action:
      kind: manual
      text: Open a repair vendor the addon does not know (a new WoW Forever zone, for example Mount Hyjal
        or Zephras Isle). Then enter |cff99ccff/cvn test repair|r.
      commands:
      - /cvn test repair
    expect: The question names that vendor. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"merchant window opened" and "question shown:" naming that vendor.'
  - id: cv.s4.2
    title: Open an ammo vendor the addon does not know, as a Hunter
    action:
      kind: manual
      text: Open an ammo vendor the addon does not know, as a Hunter. Then enter |cff99ccff/cvn test arrows|r.
      commands:
      - /cvn test arrows
    expect: The question names that vendor. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"merchant window opened" and "question shown:" naming that vendor.'
  - id: cv.s4.3
    title: Open a general vendor the addon does not know
    action:
      kind: manual
      text: Open a general vendor the addon does not know. Then enter |cff99ccff/cvn test sell|r.
      commands:
      - /cvn test sell
    expect: The question names that vendor. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"merchant window opened" and "question shown:" naming that vendor.'
  - id: cv.s4.4
    title: Open a vendor that will not trade with you (Unfriendly or Hostile)
    action:
      kind: manual
      text: Open a vendor that will not trade with you (Unfriendly or Hostile). Then enter |cff99ccff/cvn
        test sell|r.
      commands:
      - /cvn test sell
    expect: The question does not name that vendor. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"standing: npc <id> will not trade (Unfriendly or Hostile)".'
- id: s5
  title: Ammo
  steps:
  - id: cv.s5.1
    title: As a Hunter, equip a bow with fewer arrows than the threshold
    action:
      kind: manual
      text: As a Hunter, equip a bow with fewer arrows than the threshold.
    expect: The arrows question appears. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"question shown: arrows".'
  - id: cv.s5.2
    title: As a Hunter, equip a gun with fewer bullets than the threshold
    action:
      kind: manual
      text: As a Hunter, equip a gun with fewer bullets than the threshold.
    expect: The bullets question appears. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"question shown: bullets".'
  - id: cv.s5.3
    title: As a Hunter, shoot ammo down to the threshold
    action:
      kind: manual
      text: As a Hunter, shoot ammo down to the threshold.
    expect: The question appears when you cross the threshold. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"event BAG_UPDATE_DELAYED", "event UNIT_INVENTORY_CHANGED" and "event PLAYER_EQUIPMENT_CHANGED"
      lines show which events fired as the count dropped.'
  - id: cv.s5.4
    title: As a Hunter, equip a bow with only bullets in the ammo slot
    action:
      kind: manual
      text: As a Hunter, equip a bow with only bullets in the ammo slot.
    expect: The addon counts it as no ammo and asks. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"trigger" line with the ammo value.'
  - id: cv.s5.5
    title: As a Rogue or Warrior, equip a thrown weapon
    action:
      kind: manual
      text: As a Rogue or Warrior, equip a thrown weapon.
    expect: The addon never asks about ammo. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: no "question shown:" line for ammo.
  - id: cv.s5.6
    title: As a Mage, Priest or Warlock, equip a wand
    action:
      kind: manual
      text: As a Mage, Priest or Warlock, equip a wand.
    expect: The addon never asks about ammo. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: no "question shown:" line for ammo.
- id: s6
  title: Professions
  steps:
  - id: cv.s6.1
    title: Open a profession trainer, then enter /cvn log
    action:
      kind: manual
      text: Open a profession trainer, then enter |cff99ccff/cvn log|r.
      commands:
      - /cvn log
    expect: 'The report lists the profession trainer (|cff99ccfftrainers: 1 learned|r and the profession).
      Press Pass.'
    verify:
    - player
    - reviewer
    reviewer: '"trainer window opened" and "trainer services:" line.'
  - id: cv.s6.2
    title: Open a class trainer, then enter /cvn log
    action:
      kind: manual
      text: Open a class trainer, then enter |cff99ccff/cvn log|r.
      commands:
      - /cvn log
    expect: The report records nothing for the class trainer. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"trainer window opened" with no "trainer services:" line.'
  - id: cv.s6.3
    title: Reach the profession threshold and gather
    action:
      kind: manual

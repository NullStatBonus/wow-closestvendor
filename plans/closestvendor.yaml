      - /cvn ah on
      - /cvn hud row reagents always
    expect: The waypoint goes to the auctioneer.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'direct pin: reagent '
      - contains: 'direct pin: auctioneer '
      - contains: 'accepted: '
      scope: attempt
      label: The click pinned the auctioneer
    - kind: log
      source: debug
      contains: via nothing available
      absent: true
      scope: attempt
      label: A waypoint provider took the waypoint
    notes: Only ammo and reagent rows may route to an auction house. Check 116 turns routing off and puts
      Reagents back.
  - id: cv.s13.87
    title: With routing on, click a tradeable row where a vendor is closer
    setup: Routing is on (check 86).
    action:
      kind: manual

      contains: 'setting changed: hudAlpha 50 -> 80'
      scope: attempt
      label: The background opacity is 80 again
      diagnostic: true
    - kind: log
      source: debug
      contains: 'setting changed: hudTextAlpha 60 -> 100'
      scope: attempt
      label: The text opacity is 100 again
      diagnostic: true
    - kind: log
      source: debug
      contains: 'setting changed: hudColor 1a2b3c -> 000000'
      scope: attempt
      label: The colour is black again
      diagnostic: true
    notes: 'Restores the look changed in checks 56 to 67. Drawing: the result. The setting lines are diagnostic
      because they depend on which checks you ran.'
  - id: cv.s13.118
    title: Reload after learning the auction house
    action:
      kind: manual
      text: WoW Forever only; press Skip otherwise. Press Run (|cff99ccff/reload|r).

      text: 'Classic Era only. Setup: bind your hearthstone at an inn you are not bound to, then type
        |cff99ccff/reload|r at once.'
      commands:
      - /reload
    expect: Nothing changes on screen. The reviewer confirms this from the saved file. Press Pass.
    verify:
    - player
    - reviewer
    - assertions
    reload: after_action
    reviewer: ClosestVendorCharDB.hearth has x and y for that inn.
    assertions:
    - kind: log
      source: debug
      contains: ClosestVendorCharDB.hearth
      diagnostic: true
    clients:
    - classic-era
  - id: cv.s34.6
    title: Open a merchant while low durability gear wears
    action:
      kind: manual
      text: Low durability on gear that wears (or wait for a tick). Open a merchant at the same moment.
    expect: No repair question stays on screen. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"merchant window opened" comes before any "trigger" line for repair.'
  intro: 'The reviewer reads |cff99ccffClosestVendorCharDB|r and |cff99ccffClosestVendorDB|r in |cff99ccffWTF/Account/<account>/<realm>/<character>/SavedVariables/ClosestVendor.lua|r.
    No in-game check, unit tests only: the demo with an unreadable waypoint or a waypoint near a demo
    pin, the reagent names in another game language, the Unfriendly NorgannonDB trainer, the vendor and
    auctioneer tie in whole yards, the player waypoint next to the addon''s, the demo with an unreadable
    waypoint or a failed timer, and Move (Done, Cancel, lock).'
- id: s35
  title: Find supplies
  steps:
  - id: cv.s35.1
    title: Type /cvn find zzzz
    action:
      kind: manual
      text: Type |cff99ccff/cvn find zzzz|r.
      commands:
      - /cvn find zzzz
    expect: Chat says no supply item matches zzzz, and no menu opens. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"find: no item matches".'
  - id: cv.s35.2
    title: Type /cvn find with part of a drink name and pick one
    action:
      kind: manual
      text: Type |cff99ccff/cvn find|r and part of a drink's name, for example |cff99ccff/cvn find juice|r.
        If a menu of items opens, pick one drink.
      commands:
      - /cvn find
      - /cvn find juice
    expect: Chat says the sellers sell drink in general. A list opens at the mouse with the nearest seller
      marked, each with zone and distance. Your waypoint has not changed. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"find: <item> looked up as drink" and "find: seller list for <item>".'
  - id: cv.s35.3
    title: In that list, pick a seller
    action:
      kind: manual
      text: In that list, pick a seller.
    expect: A waypoint is set to that seller and chat names it. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"accepted: <seller> via <provider>".'
  - id: cv.s35.4
    title: Repeat the search, then press Escape with the list open
    action:
      kind: manual
      text: Repeat the search, then press Escape with the list open.
    expect: The list closes and the waypoint stays where it was. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: no new "accepted:" line.
  - id: cv.s35.5
    title: Mage only. Type /cvn find rune of teleportation
    action:
      kind: manual
      text: Mage only. Type |cff99ccff/cvn find rune of teleportation|r.
      commands:
      - /cvn find rune of teleportation
    expect: Chat says the sellers of that rune are listed, and a list opens with no "sell drink in general"
      note. Press Pass.
    verify:
    - player
    - reviewer
    reviewer: '"find: seller list for Rune of Teleportation".'
  - id: cv.s35.6
    title: Type a drink name in Find supplies at the end of Home
    action:
      kind: manual
      text: Type |cff99ccff/cvn settings|r, type a drink name in |cffffd100Find supplies|r at the end
        of Home, press Okay.
      commands:
      - /cvn settings
    expect: The same menu opens as for the command. Closing the settings window changes no setting. Press
      Pass.
    verify:
    - player
    - reviewer
    - assertions
    reviewer: '"find:" lines as for the command; ClosestVendorCharDB has no new setting.'
    assertions:
    - kind: log
      source: debug
      contains: ClosestVendorCharDB
      diagnostic: true
  intro: 'Use a character that knows a vendor that sells drink (any class) and, for the reagent check,
    a mage. No in-game check, unit tests only: more than 8 matching items (chat asks for more of the name;
    it needs nine cached names), a seller of the wrong pet diet leaving the pet warning open, a pick ending
    a running demo, a reagent found by its game-language name, no menu control on the client (chat names
    the nearest seller), the search from the hearthstone point in an instance, an item the client has
    not named yet found by link, and the other faction''s sellers.'

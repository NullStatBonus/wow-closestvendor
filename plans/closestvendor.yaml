  intro: 'Use a mage who knows Arcane Brilliance and Teleport, and a reagent vendor. Write down the client
    build. The addon decides these from game calls the fake-API tests cannot reach. The settings layout
    has no in-game check: unit tests cover saved values and disabled controls.'

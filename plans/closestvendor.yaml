ct: 1
kind: plan
addon: ClosestVendor
title: 'ClosestVendor in-game test plan: core'
preamble: |-
  This is the release check: the few things that make ClosestVendor work in the real game. One ordinary character runs it, once on WoW Forever and once on Classic Era. Any class and any level works, and you need no profession.
  Stand in a capital city, such as Stormwind or Orgrimmar, where a vendor and a profession trainer are both within about 30 yards. Have at least 3 free bag slots, and play with no addon except ClosestVendor and CheckThat.
  The setup step turns on test settings, so the plan runs on the default settings whatever yours are. The last step turns them off and your own settings come back.
  Each step starts with one sentence that says what to expect: a question to answer, nothing (CheckThat checks by itself), or something to look at. CheckThat records the result of most steps from the debug log or a CheckThat entry. Only the steps that ask you to look wait for Pass or Fail.
  This plan is the release gate. A feature that needs deeper checks gets its own feature plan when it is built or changed.
  Import the plan, finish it and export it (|cff99ccff/ct export|r, optionally |cff99ccff/cvn debug off|r, then |cff99ccff/reload|r).
logs:
  debug:
    global: ClosestVendorCharDB
    path: log.entries
    format: entries
    cap: 1000
  facts:
    global: CheckThatDB
    path: global.facts
    format: strings
    cap: 300
  errors:
    global: CheckThatDB
    path: global.errors
    format: strings
    quiet: true
    cap: 100
requirements:
  addon-loaded:
    text: ClosestVendor is loaded
    probe: addon-loaded
    name: ClosestVendor
offline:
  level: 6
  toc: wow-closest-vendor/ClosestVendor/ClosestVendor_Vanilla.toc
  tocs:
    era: wow-closest-vendor/ClosestVendor/ClosestVendor_Vanilla.toc
    forever: wow-closest-vendor/ClosestVendor/ClosestVendor_Camelot.toc
  steps:
  - label: The CheckThat integration is working after a real load
    call:
      addon: ClosestVendor
      entry: integration
    returns:
    - working
  - label: The saved bag threshold is 2 on a new character
    call:
      addon: ClosestVendor
      entry: setting
      args:
      - bags.threshold
    returns:
    - '2'
  - label: A fresh account has learned no vendor yet
    call:
      addon: ClosestVendor
      entry: learned
      args:
      - vendors
    returns:
    - 0
  - label: The warning check at login opened no warning request
    call:
      addon: ClosestVendor
      entry: active
    returns: []
sections:
- id: s0
  title: Setup
  intro: Copy ClosestVendor/ into the AddOns folder and log in. The reviewer reads ClosestVendorCharDB (character) and ClosestVendorDB (account) in the SavedVariables folder.
  steps:
  - id: cv.s0.1
    title: Check the ClosestVendor version
    auto: true
    action:
      kind: manual
      text: Nothing appears. CheckThat checks by itself. CheckThat reads the ClosestVendor version.
    expect: The ClosestVendor version is 1.13.0 or newer. If the step fails, copy ClosestVendor 1.13.0 into the game again.
    verify:
    - assertions
    call:
      addon: ClosestVendor
      entry: version
    timeout: 30
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.version
      op: ge
      value: 11300
      label: ClosestVendor is 1.13.0 or newer
    notes: The entry returns major*10000 + minor*100 + patch, so 1.13.0 is 11300. It reads a fact, not the debug log, so it runs before debug logging is on. CheckThat too old to offer entries leaves this step unverified.
  - id: cv.s0.2
    title: Turn on Lua errors, debug logging and test settings, then reload
    action:
      kind: manual
      text: Nothing appears. CheckThat checks by itself. Press Run to turn on Lua error popups, the debug log and test settings, which puts your own settings aside and uses the defaults, and to reload the game.
      commands:
      - "/console scriptErrors 1"
      - "/cvn debug on"
      - "/cvn testsettings on"
      - "/reload"
    expect: The game reloads with no Lua error popup, and chat says test settings are on.
    verify:
    - assertions
    auto: true
    reload: after_action
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: debug log turned on
      - contains: "---- login ----"
      - contains: "test settings: on at login"
      scope: attempt
      label: The debug log turned on, and test settings were still on after the reload
    notes: The login marker and the test settings line come after the reload, so the Run commands alone cannot pass the step. Test settings put the tester's own settings aside for the whole plan, so every step sees the defaults it assumes; the last step turns them off. A Lua error popup is also caught by the last step of the plan, which reads CheckThat's error list.
- id: s1
  title: 'Selling: a real warning, the waypoint, the vendor and the status window'
  intro: One real sell warning, from the bag threshold to the question, the waypoint, the vendor and the status window.
  steps:
  - id: cv.s1.1
    title: "WoW Forever: make bag space low and click Yes"
    clients:
    - forever-camelot
    setup: "Needs: at least 3 free bag slots, so the default bag threshold 2 leaves the sell warning off before the step. No question is open."
    action:
      kind: manual
      text: "A question appears. Click Yes. Look, then press Pass or Fail. Press Run to make your bags count as almost full, click Yes on the sell question (or This map when it names two vendors), then look at your map."
      commands:
      - "/cvn nav native"
      - "/cvn bags 200"
    expect: "A waypoint to the vendor shows on your map. Press Pass."
    verify:
    - player
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - pattern: "trigger go sell %(bags=%d+ durability="
      - pattern: "question shown: sell, .+ %(npc %d+%), %a+, %d+ yd"
      - pattern: "accepted: .+ via native"
      scope: attempt
      label: "The real bag count crossed the threshold, the question named a vendor, and Yes set the game waypoint"
    notes: "Player step. Drawing: the map waypoint. A real warning, not a test command: the trigger line carries the real bag and durability reads. Run also picks the game waypoint, even with TomTom or WaypointUI installed. Check 1.5 puts the bag threshold back, and the last step turns test settings off."
  - id: cv.s1.2
    title: "Classic Era: make bag space low and click Yes"
    clients:
    - classic-era
    setup: "Needs: at least 3 free bag slots, so the default bag threshold 2 leaves the sell warning off before the step. No question is open."
    auto: true
    action:
      kind: manual
      text: "A question appears. Click Yes. Press Run to make your bags count as almost full, then click Yes on the sell question (or This map when it names two vendors)."
      commands:
      - "/cvn nav chat"
      - "/cvn bags 200"
    expect: "A chat line names the vendor, its zone and its coordinates."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - pattern: "trigger go sell %(bags=%d+ durability="
      - pattern: "question shown: sell, .+ %(npc %d+%), %a+, %d+ yd"
      - pattern: "accepted: .+ via chat"
      scope: attempt
      label: "The real bag count crossed the threshold, the question named a vendor, and Yes gave the chat line"
    notes: "Classic Era has no game waypoint, so the chat line is the waypoint. Run picks the chat line, so it wins even with TomTom installed. Check 1.5 puts the bag threshold back."
  - id: cv.s1.3
    title: "Open that vendor: the waypoint goes away and the vendor is learned"
    setup: "Needs: the sell question from check 1.1 or 1.2, answered Yes."
    auto: true
    action:
      kind: manual
      text: "Nothing appears. CheckThat checks by itself. Walk to the vendor the sell question named, open its window and close it."
    expect: "The waypoint goes away when the vendor window opens."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "merchant window opened"
      - contains: "waypoint cleared: a merchant window opened"
      scope: attempt
      label: "Opening the vendor window cleared the waypoint"
    - kind: log
      source: debug
      pattern: "vendor learned: .+ %(npc %d+%), %a+"
      scope: attempt
      label: "The vendor window opened and the vendor was learned (new, updated or unchanged)"
    - kind: log
      source: debug
      contains: "it was not in the search pool"
      diagnostic: true
      scope: attempt
      label: "The vendor was new to the search (not shipped, not from NorgannonDB, not learned before)"
    notes: "Any vendor works: the learned line ends with new, updated or unchanged, and the plan accepts all three. A new vendor is unit tested. Bag space stays low until check 1.5. Check 6.2 asks for this vendor after a reload without opening it."
  - id: cv.s1.4
    title: "Look at the status window"
    action:
      kind: manual
      text: "Look, then press Pass or Fail. Look at the status window on your screen."
    expect: "The status window shows the Bag space row in red with a Low label. Press Pass."
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      pattern: "status window: shown, rows: .*bags low"
      scope: session
      label: "The status window holds the Bag space row, and it is low"
    notes: "Player step. Drawing: the red row and the Low label. The window line is written when the row appears, in check 1.1 or 1.2, so the check reads the whole session. The window shows by default under test settings."
  - id: cv.s1.5
    title: "Put bag space back to normal: the Bag space row goes away"
    auto: true
    action:
      kind: manual
      text: "Nothing appears. CheckThat checks by itself. Press Run to put your bag warning back to normal."
      commands:
      - "/cvn bags 2"
    expect: "The Bag space row leaves the status window."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "setting changed: bagThreshold 200 -> 2"
      - pattern: "status window: [hs]%a+"
      scope: attempt
      label: "The bag threshold went back to 2, and the status window redrew without the Bag space row"
    notes: "The window line is written only when its text changes, so a line after the threshold change proves the low row left. No trigger clear line is written here: opening the vendor in check 1.3 already ended the sell warning, and a clear is logged only for a warning that is still open. Other rows, such as water, may stay in the window."
- id: s2
  title: Questions from real vendor and trainer data
  intro: Each question comes from the real vendor and trainer data around you. Any class can ask for each one.
  steps:
  - id: cv.s2.1
    title: "Ask for a repair vendor and click No"
    auto: true
    action:
      kind: manual
      text: "A question appears. Click No. Press Run to ask for a repair vendor, then click No."
      commands:
      - "/cvn test repair"
    expect: "A question names a repair vendor."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "test command: repair"
      - pattern: "question shown: repair, .+ %(npc %d+%), %a+, %d+ yd"
      - contains: "question declined: repair"
      scope: attempt
      label: "The repair question named a repair vendor with its source and distance, and No was answered"
    notes: "A test command asks the same question as a real warning, whatever the gear. The real durability read is on the trigger line of check 1.1 or 1.2."
  - id: cv.s2.4
    title: "Ask for a food vendor and click No"
    auto: true
    action:
      kind: manual
      text: "A question appears. Click No. Press Run to ask for a food vendor, then click No."
      commands:
      - "/cvn test food"
    expect: "A question names a vendor that sells food."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "test command: food"
      - pattern: "question shown: supply food, .+ %(npc %d+%), %a+, %d+ yd, %d+ left"
      - contains: "question declined: supply"
      scope: attempt
      label: "The food question named a food vendor with the food count read from the bags, and No was answered"
    notes: "The count comes from the real bag contents, with the food items the addon knows. A character with no food shows 0 left."
  - id: cv.s2.5
    title: "Open a profession trainer"
    auto: true
    action:
      kind: manual
      text: "Nothing appears. CheckThat checks by itself. Open the window of any profession trainer and close it."
    expect: "The step finishes by itself after the trainer window opens."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "trainer learned: "
      - contains: "trainer window opened"
      scope: attempt
      label: "The trainer was learned when its window opened"
    - kind: log
      source: debug
      pattern: "trainer services: %d+ listed; filters "
      scope: attempt
      label: "The trainer probe logged the services the window lists"
    - kind: log
      source: debug
      pattern: "trainer learned: .+ %(npc %d+%), new"
      diagnostic: true
      scope: attempt
      label: "The trainer was new to this account"
    notes: "Any profession trainer works, and the character needs no profession. The addon learns the trainer once the window lists its services (often at TRAINER_UPDATE, after a first nothing-learned line), and only then writes trainer window opened. The line names the trainer, its npc id, new, updated or unchanged, and what it teaches. The services line is the trainer probe (spec diagnostics); it is written once per window with the debug log on."
  - id: cv.s2.7
    title: "Ask for a trainer and click No"
    auto: true
    action:
      kind: manual
      text: "A question appears. Click No. Press Run to ask for a trainer, then click No."
      commands:
      - "/cvn test trainer"
    expect: "A question names the profession trainer you just opened."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "test command: trainer"
      - pattern: "question shown: trainer for .+ %(npc %d+%), learned, %d+ yd"
      - contains: "question declined: trainer"
      scope: attempt
      label: "The trainer question named a trainer this account learned, with its distance, and No was answered"
    notes: "The trainer from check 2.5 is learned and stands next to you, so it is the nearest one. The question is a test question: no skill threshold or profession is needed."
- id: s6
  title: Finish
  steps:
  - id: cv.s6.1
    title: "Reload the game"
    auto: true
    action:
      kind: manual
      text: "Nothing appears. CheckThat checks by itself. Press Run to reload the game."
      commands:
      - "/reload"
    expect: "The game reloads."
    verify:
    - assertions
    reload: after_action
    assertions:
    - kind: log
      source: debug
      contains: "---- login ----"
      scope: attempt
      label: "The game reloaded"
    notes: "Check 6.2 needs a reload between learning the vendor and asking for it."
  - id: cv.s6.2
    title: "After the reload, open the vendor from check 1.3 again"
    setup: "Needs: the vendor you opened in check 1.3."
    auto: true
    action:
      kind: manual
      text: "Nothing appears. CheckThat checks by itself. Open the window of the vendor you opened in check 1.3 and close it."
    expect: "The step finishes by itself after the vendor window opens."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - pattern: "vendor learned: .+ %(npc %d+%), u%a+"
      - contains: "merchant window opened"
      scope: attempt
      label: "After the reload the addon still knew the vendor: updated or unchanged, not new"
    notes: "The learned line says new for a vendor the account never saw, and updated or unchanged for one it knows. After the reload it can only know the vendor from the saved variables. When check 1.3 learned the vendor as new, this proves that save; when the vendor was known before the run, it proves the reload path. Search over learned data is proven by check 2.7, which names a learned trainer."
  - id: cv.s6.3
    title: Turn test settings off, then check for Lua errors
    action:
      kind: manual
      text: Nothing appears. CheckThat checks by itself. Press Run to turn test settings off, so your own settings come back, and to let CheckThat read its list of Lua errors for this run.
      commands:
      - "/cvn testsettings off"
    expect: Chat says your own settings are back, and ClosestVendor raised no Lua error during this plan.
    verify:
    - assertions
    auto: true
    timeout: 120
    assertions:
    - kind: log
      source: debug
      contains: 'test settings: off (own settings restored)'
      scope: attempt
      label: Test settings are off and your own settings are back
    - kind: log
      source: errors
      pattern: "%[ClosestVendor%]"
      absent: true
      scope: session
      label: ClosestVendor raised no Lua error in this run
    notes: 'Scope session reads CheckThat''s whole error list. CheckThat keeps an error only while a run is open, across /reload, up to the last 100, so the check covers every step of this run. CheckThat 0.21.0 has no scope for one run, and starting a run keeps the list: a ClosestVendor error from an earlier run (also of another ClosestVendor plan) fails this step too. When it fails, compare the error time with the start of this run. It passes when the list has no ClosestVendor error after Run has finished. Press Run first: it turns test settings off and writes the line the first assertion reads. After this step, export the run (/ct export), optionally turn the debug log off (/cvn debug off), and type /reload so the game saves the log.'

      - contains: 'instance: pvp -> none'
      - contains: trigger go sell
      scope: attempt
      label: The sell warning went off after you left
    - kind: log
      source: debug
      contains: 'question shown: sell, '
      count:
        exactly: 1
      scope: attempt
      label: The sell question showed once
    notes: The count check waits the whole timeout.

        a dungeon and click a status window row.
      commands:
      - /cvn anchor hearth
    expect: The addon searches from your last position outside.
    verify:
    - assertions
    auto: true
    timeout: 300
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: 'direct pin: '
      - contains: 'accepted: '
      - contains: 'direct pin: the search started from your last position outside'
      scope: attempt
      label: With no hearthstone point, the click searched from the last position outside
    notes: 'The anchor falls back to the other point when the chosen one is unknown. A row must be shown:
      use a low line or Always. The waypoint line comes before the anchor line: the addon sets the waypoint,
      then says where the search started.'
  - id: cv.s13.84
    title: Type /cvn anchor hearth, then /cvn anchor last
    action:
      kind: manual
      text: Type |cff99ccff/cvn anchor hearth|r, then |cff99ccff/cvn anchor last|r.

ct: 1
kind: plan
addon: ClosestVendor
title: 'ClosestVendor in-game test plan: other addons'
preamble: |-
  These checks cover ClosestVendor with other addons: TomTom, WaypointUI (WoW Forever), NorgannonDB (WoW Forever) and a sound pack (an addon that adds LibSharedMedia sounds). Each step starts with Needs: the addon it needs. The card says Blocked when that addon is not loaded: press Skip. Run the plan on WoW Forever and on Classic Era.
  ClosestVendor has three plans, and all three run before each release: |cff99ccffplans/closestvendor.yaml|r (core), |cff99ccffplans/closestvendor.ui.yaml|r (status window, visuals and settings) and |cff99ccffplans/closestvendor.addons.yaml|r (this one). Import one plan, finish it and export it (|cff99ccff/ct export|r, optionally |cff99ccff/cvn debug off|r, then |cff99ccff/reload|r) before you import the next: a run uses the last plan imported.

  The setup step turns on test settings, so the plan runs on the default settings whatever yours are. The last step turns them off and your own settings come back.
  Each step starts with one sentence that says what to expect: a question to answer, nothing (CheckThat checks by itself), or something to look at. CheckThat records the result of most steps from the debug log. Only the steps that ask you to look or listen wait for Pass or Fail.
logs:
  debug:
    global: ClosestVendorCharDB
    path: log.entries
    format: entries
    cap: 1000
  facts:
    global: CheckThatDB
    path: global.facts
    format: strings
    cap: 300
  errors:
    global: CheckThatDB
    path: global.errors
    format: strings
    quiet: true
    cap: 100
requirements:
  addon-loaded:
    text: ClosestVendor is loaded
    probe: addon-loaded
    name: ClosestVendor
  tomtom:
    text: TomTom is not loaded. Press Skip
    probe: addon-loaded
    name: TomTom
  waypointui:
    text: WaypointUI is not loaded. Press Skip
    probe: addon-loaded
    name: WaypointUI
  norgannondb:
    text: NorgannonDB is not loaded. Press Skip
    probe: addon-loaded
    name: NorgannonDB
offline:
  level: 6
  toc: wow-closest-vendor/ClosestVendor/ClosestVendor_Vanilla.toc
  tocs:
    era: wow-closest-vendor/ClosestVendor/ClosestVendor_Vanilla.toc
    forever: wow-closest-vendor/ClosestVendor/ClosestVendor_Camelot.toc
  steps:
  - label: The game has no TomTom, WaypointUI or map waypoint here, so the waypoint is a chat line
    call:
      addon: ClosestVendor
      entry: nav
    returns:
    - chat
  - label: NorgannonDB is not installed
    call:
      addon: ClosestVendor
      entry: external
    returns:
    - not found
sections:
- id: s20
  title: Setup
  intro: Copy ClosestVendor/ into the AddOns folder, enable the other addons you have, and log in.
  steps:
  - id: cv.s20.1
    title: Check the ClosestVendor version
    auto: true
    action:
      kind: manual
      text: Nothing appears. CheckThat checks by itself. CheckThat reads the ClosestVendor version.
    expect: The ClosestVendor version is 1.12.0 or newer. If the step fails, copy ClosestVendor 1.12.0 into the game again.
    verify:
    - assertions
    call:
      addon: ClosestVendor
      entry: version
    timeout: 30
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.version
      op: ge
      value: 11200
      label: ClosestVendor is 1.12.0 or newer
    notes: The entry returns major*10000 + minor*100 + patch, so 1.12.0 is 11200. It reads a fact, not the debug log, so it runs before debug logging is on. CheckThat too old to offer entries leaves this step unverified.
  - id: cv.s20.2
    title: Turn on Lua errors, debug logging and test settings, then reload
    action:
      kind: manual
      text: Nothing appears. CheckThat checks by itself. Press Run. It turns on Lua error popups (|cff99ccff/console scriptErrors 1|r), the debug log (|cff99ccff/cvn debug on|r) and test settings (|cff99ccff/cvn testsettings on|r, which puts your own settings aside and uses the defaults), then reloads (|cff99ccff/reload|r).
      commands:
      - "/console scriptErrors 1"
      - "/cvn debug on"
      - "/cvn testsettings on"
      - "/reload"
    expect: The game reloads with no Lua error popup, the debug log keeps recording and chat says test settings are on.
    verify:
    - assertions
    auto: true
    reload: after_action
    timeout: 120
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: debug log turned on
      - contains: "---- login ----"
      - contains: "test settings: on at login"
      scope: attempt
      label: The debug log turned on, and test settings were still on after the reload
    notes: The login marker and the test settings line come after the reload, so the Run commands alone cannot pass the step. Test settings put the tester's own settings aside for the whole plan, so every step sees the defaults it assumes; the last step turns them off. A Lua error popup is also caught by the last step of the plan, which reads CheckThat's error list.
- id: s21
  title: Other addons
  intro: Each step says what it needs. A step for an addon you do not have shows Blocked, so press Skip. An automatic step waits for you and records its result when its checks hold.
  steps:
  - id: cv.s21.1
    title: "TomTom: ask the test sell question, click Yes, then open a vendor"
    requires:
    - tomtom
    setup: "Needs: TomTom; otherwise press Skip."
    auto: true
    action:
      kind: manual
      text: "A question appears. Click Yes. Press Run. It sets the waypoint choice to Automatic (|cff99ccff/cvn nav auto|r) and asks the sell question (|cff99ccff/cvn test sell|r). Click |cffffd100Yes|r (|cffffd100This map|r or |cffffd100Closest|r when it names two vendors). Then open any vendor's window and close it."
      commands:
      - "/cvn nav auto"
      - "/cvn test sell"
    expect: "TomTom takes the waypoint to the vendor. The waypoint goes away when the vendor window opens."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "test command: sell"
      - pattern: "accepted: .+ via tomtom"
      - contains: "merchant window opened"
      - contains: "waypoint cleared: a merchant window opened"
      scope: attempt
      label: "TomTom took the waypoint, and a merchant window cleared it"
    notes: "Automatic. The log proves the hand-over to TomTom and the clear; the arrow itself is TomTom's drawing. Automatic uses TomTom first when it is installed. Check 21.2 was merged into this step and its id is retired."
  - id: cv.s21.3
    title: "WoW Forever, WaypointUI: ask the test sell question and click Yes"
    clients:
    - forever-camelot
    requires:
    - waypointui
    setup: "Needs: WoW Forever and WaypointUI; otherwise press Skip."
    auto: true
    action:
      kind: manual
      text: "A question appears. Click Yes. Press Run. It picks WaypointUI (|cff99ccff/cvn nav waypointui|r) and asks the sell question (|cff99ccff/cvn test sell|r). Click |cffffd100Yes|r (|cffffd100This map|r or |cffffd100Closest|r when it names two vendors)."
      commands:
      - "/cvn nav waypointui"
      - "/cvn test sell"
    expect: "WaypointUI takes the waypoint to the vendor."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "test command: sell"
      - pattern: "accepted: .+ via waypointui"
      scope: attempt
      label: "WaypointUI took the waypoint"
    notes: "Automatic. The choice makes WaypointUI take the waypoint even with TomTom installed. Check 21.10 sets the choice back to Automatic."
  - id: cv.s21.4
    title: "WoW Forever, NorgannonDB: the addon read it at login"
    clients:
    - forever-camelot
    requires:
    - norgannondb
    setup: "Needs: WoW Forever and NorgannonDB; otherwise press Skip."
    auto: true
    action:
      kind: manual
      text: "Nothing appears. CheckThat checks by itself. Nothing to type: it reads what ClosestVendor took from NorgannonDB."
    expect: "The addon found NorgannonDB at login and added its vendors."
    verify:
    - assertions
    call:
      addon: ClosestVendor
      entry: external
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.external
      op: contains
      value: "found, schema "
      label: "NorgannonDB was found with a supported schema"
    - kind: log
      source: debug
      contains: "NorgannonDB: found, schema "
      scope: session
      label: "The login line says NorgannonDB was found"
    notes: "The login line comes from the reload of check 20.2, so it uses scope session. The entry gives the same text as the report line."
  - id: cv.s21.5
    title: "WoW Forever, NorgannonDB: ask for a vendor in a Forever-only zone and open it"
    clients:
    - forever-camelot
    requires:
    - norgannondb
    setup: "Needs: WoW Forever and NorgannonDB, and you stand next to a vendor in Riverglades or Zephras Isle (maps only WoW Forever has); otherwise press Skip."
    auto: true
    action:
      kind: manual
      text: "A question appears. Click No. Press Run (|cff99ccff/cvn test sell|r). Click |cffffd100No|r. Then open the window of the vendor the question named, and close it."
      commands:
      - "/cvn test sell"
    expect: "The question names a vendor in that zone. The addon then records whose position it uses for that vendor."
    verify:
    - assertions
    assertions:
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "test command: sell"
      - contains: "question shown: sell, "
      - contains: "question declined: sell"
      - contains: "merchant window opened"
      - contains: "vendor learned: "
      - contains: "NorgannonDB position"
      scope: attempt
      label: "The question named a vendor, and opening it decided whose position to use"
    notes: "The shipped data has no vendor on these maps, so the vendor comes from NorgannonDB, and the NorgannonDB position line proves it. The line ends with \"replaces the NorgannonDB position\" (another map, or more than 0.03 of the map away) or \"the NorgannonDB position is kept\". Check 21.6 was merged into this step and its id is retired."
  - id: cv.s21.7
    title: "WoW Forever, NorgannonDB: Artisan asks for a trainer that teaches it"
    clients:
    - forever-camelot
    requires:
    - norgannondb
    setup: "Needs: WoW Forever, NorgannonDB and a crafting profession at 215 to 225 of 225, level 35 or more, with no other known profession 10 points or fewer from its limit; otherwise press Skip."
    auto: true
    action:
      kind: manual
      text: "A question appears. Click No. Craft one item or gain a point in that profession. Click |cffffd100No|r on the trainer question."
    expect: "The question names a Master trainer (for example Brikk Keencraft in Booty Bay for Blacksmithing)."
    verify:
    - assertions
    assertions:
    - kind: log
      source: debug
      pattern: "trainer search: .+ needs tier 4; nearest .+ teaches tier 4"
      scope: attempt
      label: "A trainer that teaches Artisan was chosen"
    - kind: log-sequence
      source: debug
      sequence:
      - contains: "question shown: trainer for "
      - contains: "question declined: trainer"
      scope: attempt
      label: "The trainer question was asked and answered"
    notes: "Without NorgannonDB trainer tiers the addon does not route Artisan (unit tested). Tier 4 is Artisan; the trainer search names the trainer that teaches it."
  - id: cv.s21.8
    title: "Sound pack: choose a pack sound and play it"
    setup: "Needs: an addon with LibSharedMedia sounds (a sound pack); otherwise press Skip."
    action:
      kind: manual
      text: "Look, then press Pass or Fail. Open Appearance, Sound in the settings and choose a sound marked \"(sound pack)\". Then press Run (|cff99ccff/cvn test remind|r) and listen."
      commands:
      - "/cvn test remind"
    expect: "Pack sounds follow the built-in ones, each marked \"(sound pack)\". The sound you chose plays when you choose it and again after Run. Press Pass."
    verify:
    - player
    - assertions
    assertions:
    - kind: log
      source: debug
      contains: "setting changed: remindSound "
      scope: attempt
      label: "The chosen pack sound was saved"
    - kind: log
      source: debug
      pattern: "reminder: [tfh]%a+"
      scope: attempt
      label: "The reminder ran for this class (test, food or healthstone)"
    - kind: log
      source: debug
      contains: "test command: remind"
      diagnostic: true
      scope: attempt
      label: "The test command ran"
    notes: "Player step. Sound: the chosen sound is heard, and the list marks are seen; no line proves a sound. Check 21.9 was merged into this step and its id is retired. The reminder line proves the reminder ran (non mage or warlock: reminder: test; Mage: reminder: food (N); Warlock: reminder: healthstone (0))."
  - id: cv.s21.10
    title: "Put the waypoint and sound settings back"
    action:
      kind: manual
      text: "Look, then press Pass or Fail. Press Run. It sets the waypoint choice back to Automatic (|cff99ccff/cvn nav auto|r) and the notification sound back to the default (|cff99ccff/cvn sound whisper|r). Listen for the whisper sound."
      commands:
      - "/cvn nav auto"
      - "/cvn sound whisper"
    expect: "Chat shows the waypoint choice Automatic, and the default whisper sound plays. Press Pass."
    verify:
    - player
    notes: "Player step. Cleanup the player sees: checks 21.1, 21.3 and 21.8 changed these settings. A command that changes nothing writes no setting line, so the next step reads the sound as a fact."
  - id: cv.s21.11
    title: Turn test settings off, then check for Lua errors
    action:
      kind: manual
      text: Nothing appears. CheckThat checks by itself. Press Run. It turns test settings off (|cff99ccff/cvn testsettings off|r) and your own settings come back. CheckThat then reads its list of Lua errors for this run.
      commands:
      - "/cvn testsettings off"
    expect: Chat says your own settings are back, and ClosestVendor raised no Lua error during this plan.
    verify:
    - assertions
    auto: true
    timeout: 120
    call:
      addon: ClosestVendor
      entry: config
      args:
      - remindSound
    assertions:
    - kind: fact
      source: facts
      addon: ClosestVendor
      key: entry.config
      op: eq
      value: whisper
      label: The notification sound is back to the default whisper after check 21.10
    - kind: log
      source: debug
      contains: 'test settings: off (own settings restored)'
      scope: attempt
      label: Test settings are off and your own settings are back
    - kind: log
      source: errors
      pattern: "%[ClosestVendor%]"
      absent: true
      scope: session
      label: ClosestVendor raised no Lua error in this run
    notes: 'The config entry runs when the step opens, after check 21.10 typed the sound default back. Scope session reads CheckThat''s whole error list. CheckThat keeps an error only while a run is open, across /reload, up to the last 100, so the check covers every step of this run. CheckThat 0.21.0 has no scope for one run, and starting a run keeps the list: a ClosestVendor error from an earlier run (also of another ClosestVendor plan) fails this step too. When it fails, compare the error time with the start of this run. It passes when the list has no ClosestVendor error after Run has finished. Press Run first: it turns test settings off and writes the line the first assertion reads. After this step, export the run (/ct export), optionally turn the debug log off (/cvn debug off), and type /reload so the game saves the log.'
